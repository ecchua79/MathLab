  {t:'例题17　作 y=−x²−4x−1 的图像',q:'',s:'y=−(x²+4x)−1=−[(x+2)²−4]−1=−(x+2)²+3<br>a<0 开口向下，顶点 (−2,3)（最高点），对称轴 x=−2，交 y 轴 (0,−1)',f:`<figure>${plotQ(-1,-4,-1,{pts:[[-2,3,'(−2,3)'],[0,-1,'(0,−1)']]})}</figure>`},
  {t:'例题22　40 m 篱笆围长方形菜园，怎样围面积最大？',q:'',s:'2x+2y=40 ⟹ y=20−x<br>A=x(20−x)=−(x−10)²+100<br>x=10 时 A 最大 =100，此时 y=10：围成边长 10 m 的正方形，最大面积 <b>100 m²</b>',f:`<figure>${rectD(0)}</figure><figure>${plotQ(-1,20,0,{pts:[[10,100,'(10,100)']],noax:1,w:240,h:170})}</figure>`}],
 calc:{rows:[[['a',1],['b',-2],['c',-3]]],lb:['a=','b=','c='],
  run(v){const{a,b,c}=v;if(!a)return{h:'a 不能为 0'};const h=-b/(2*a),k=c-b*b/(4*a),D=b*b-4*a*c;let o=`<div>配方：<b>${vf(a,h,k)}</b></div><div>开口${a>0?'向上':'向下'}；顶点 <b>${pt2(h,k)}</b>；对称轴 <b>x=${N(h)}</b></div><div>x=${N(h)} 时 y 有<b>${a>0?'最小':'最大'}值 ${N(k)}</b></div><div>交 y 轴：(0, ${N(c)})</div>`;
   const pts=[[h,k,'顶点'+pt2s(h,k)],[0,c,'(0,'+T(c)+')']];if(D>=0){const s=Math.sqrt(D)/(2*Math.abs(a));o+=`<div>交 x 轴：(${N(h-s)}, 0)${D>0?'、('+N(h+s)+', 0)':''}</div>`;pts.push([h-s,0,''],[h+s,0,''])}else o+='<div>与 x 轴没有交点（Δ<0）</div>';
   return{h:o,svg:plotQ(a,b,c,{pts})}}}},
{id:'2.4',title:'2.4 抛物线与直线',
 intro:'抛物线 y=ax²+bx+c 与直线 y=mx+n 联立，代入消元得 <b>ax²+(b−m)x+(c−n)=0</b>，再看判别式：Δ>0 相交于两点；Δ=0 相切（一个交点）；Δ<0 没有交点。',
 ex:[{t:'例题23　y=x²+(2k−1)x+k² 与 x 轴的交点个数',q:'',s:'Δ=(2k−1)²−4k²=1−4k<br>(a) 一个交点：k='+F(1,4)+'　(b) 两个交点：k<'+F(1,4)+'　(c) 没有交点：k>'+F(1,4),f:fg(1,-.5,.0625,'k='+F(1,4)+'：相切')+fg(1,-3,1,'k=−1：两个交点')+fg(1,1,1,'k=1：没有交点')},
  {t:'例题24　y=x²−2kx+k² 与 y=2x−1 相交，求 k 的范围',q:'',s:'x²−2kx+k²=2x−1 ⟹ x²−2(k+1)x+(k²+1)=0<br>Δ=4(k+1)²−4(k²+1)=8k ≥ 0 ⟹ <b>k≥0</b>',f:fg(1,-2,1,'k=1：两个交点',{m:2,n:-1})+fg(1,0,0,'k=0：相切',{m:2,n:-1})},
  {t:'例题25　证明 y=1−x² 与 y=2(1−x) 相切，求切点',q:'',s:'1−x²=2−2x ⟹ x²−2x+1=0，Δ=(−2)²−4=0 ⟹ 相切<br>(x−1)²=0 ⟹ x=1，y=1−1²=0，切点 <b>(1, 0)</b>',f:`<figure>${plotQ(-1,0,1,{m:-2,n:2})}</figure>`}],
 calc:{rows:[[['a',1],['b',-4],['c',3]],[['m',1],['n',-1]]],lb:['抛物线 a=','b=','c=','直线 y=mx+n：m=','n='],
  run(v){const{a,b,c,m,n}=v;if(!a)return{h:'a 不能为 0'};const B=b-m,C=c-n,D=B*B-4*a*C;let o=`<div>联立：${P(a,b,c)}=${lineS(m,n)} ⟹ <b>${P(a,B,C)}=0</b></div><div>Δ=${sg(B)}²−4(${sg(a)})(${sg(C)})=<b>${N(D)}</b> ⟹ ${D>0?'相交于<b>两点</b>':D==0?'<b>相切</b>（一个交点）':'<b>没有交点</b>'}</div>`;
   if(D>=0){const s=Math.sqrt(D),xs=D==0?[-B/(2*a)]:[(-B-s)/(2*a),(-B+s)/(2*a)];o+='<div>交点：'+xs.map(x=>pt2(x,m*x+n)).join('、')+'</div>'}

TABS[0].gens=[[G11,1],[G12,0],[G13,1],[G14,1]];
TABS[1].gens=[[G21,1],[G22,0],[G23,1],[G24,0]];
TABS[2].gens=[[G31,1],[G32,1],[G33,1],[G34,1],[G35,1]];
TABS[3].gens=[[G41,0],[G42,1],[G43,1],[G44,0],[G45,1]];
const HARD=[[H1,1],[H2,1],[H3,1]],ALL=[].concat(...TABS.map(t=>t.gens));
const pickG=(l,n)=>{const r=shuf(l).slice(0,n);while(r.length<n)r.push(pick(l));return r};
/* ---------- 测验组件 ---------- */
function grade(fa,s){s=String(s).replace(/[−－—]/g,'-').replace(/[（）]/g,m=>m=='（'?'(':')').trim();if(fa.t=='n'){const x=parseNum(s.replace(/^[a-zA-Z²]*=/,'').replace(/^RM/i,''));return isFinite(x)&&Math.abs(x-fa.v)<1e-6}
 const m=s.match(/-?\d+(?:\.\d+)?(?:\s*\/\s*\d+)?/g);if(!m||m.length<2)return false;const n=m.map(parseNum);return Math.abs(n[0]-fa.v[0])<1e-6&&Math.abs(n[1]-fa.v[1])<1e-6}
function Quiz(root,list,nM,nF,rev){
 function start(){
  let sc=0,dn=0,fs=0,fd=0;root.innerHTML='';
  const head=el('div','mut'),mb=el('div'),fb=el('div'),rs=el('div');root.append(head,mb,fb,rs);
  const upd=()=>head.innerHTML=`选择题：已答 ${dn}/${nM}，答对 ${sc}`+(fb.children.length?`　｜　作答题：已答 ${fd}/${nF}，答对 ${fs}`:'');
  let ms;if(rev){const hd=pickG(HARD,2).map(x=>x[0]);ms=hd.concat(pickG(ALL.filter(x=>!HARD.includes(x)),nM-2).map(x=>x[0]))}else ms=pickG(list,nM).map(x=>x[0]);
  const allDone=()=>{const tot=sc+fs,all=nM+nF,pc=Math.round(tot/all*100);
   rs.innerHTML=`<div class="card intro"><b>${rev?'总复习成绩':'本节成绩'}：${tot}/${all}（${pc}%）</b><br>选择题 ${sc}/${nM}　作答题 ${fs}/${nF}<br>${pc>=90?'🏆 优秀！掌握得非常扎实。':pc>=70?'👍 良好，再检查错题就更稳了。':pc>=50?'🙂 及格，建议回看例题与计算器再试一次。':'💪 继续加油，先看例题再重新出题。'}</div>`;
   const b=el('button','btn','🔄 换一组新题');b.onclick=start;rs.append(b)};
  const mcDone=()=>{if(dn<nM)return;
   if(!rev&&sc<3){rs.innerHTML=`<div class="card">本组答对 ${sc}/${nM}，需答对 3 题以上才能解锁作答题。回看例题后再试一组吧！</div>`;const b=el('button','btn','🔄 重新出题');b.onclick=start;rs.append(b);return}
   const pool=rev?[pickG(HARD.filter(x=>x[1]),1)[0]].concat(pickG(ALL.filter(x=>x[1]&&!HARD.includes(x)),nF-1)):pickG(list.filter(x=>x[1]),nF);
   fb.append(el('h3','','✍️ 作答题'+(rev?'':'（已解锁）')));pool.forEach((x,i)=>fb.append(fillCard(x[0](),i)));upd()};
  function mcCard(g,i){const c=el('div','q',`<b>第 ${i+1} 题</b>　${g.q}${g.fig?'<div class="fig">'+g.fig+'</div>':''}`),os=el('div','opts'),f=el('div','fb');let lock=0;
   shuf([g.ans].concat(g.wr)).forEach(t=>{const b=el('button','opt',t);b.onclick=()=>{if(lock)return;lock=1;dn++;const ok=t===g.ans;if(ok)sc++;b.classList.add(ok?'ok':'bad');[...os.children].forEach(x=>{if(x.innerHTML===g.ans)x.classList.add('ok')});
    f.innerHTML=`<span class="${ok?'g':'r'}">${ok?'✅ 正确！':'❌ 错误，正确答案：'+g.ans}</span><div class="exp">${g.e}${g.ef?'<div class="fig">'+g.ef()+'</div>':''}</div>`;upd();mcDone()};os.append(b)});c.append(os,f);return c}
  function fillCard(g,i){const c=el('div','q',`<b>作答 ${i+1}</b>　${g.fq||g.q}${g.fig?'<div class="fig">'+g.fig+'</div>':''}`),r=el('div','row'),inp=el('input','ci');inp.style.width='9em';inp.placeholder=g.fa.t=='p'?'(x, y)':'答案';const b=el('button','btn','提交'),f=el('div','fb');
   b.onclick=()=>{if(b.disabled||!inp.value.trim())return;b.disabled=inp.disabled=true;fd++;const ok=grade(g.fa,inp.value);if(ok)fs++;f.innerHTML=`<span class="${ok?'g':'r'}">${ok?'✅ 正确！':'❌ 错误，正确答案：'+(g.fans||g.ans)}</span><div class="exp">${g.e}${g.ef?'<div class="fig">'+g.ef()+'</div>':''}</div>`;upd();if(fd==nF)allDone()};
   r.append(inp,b);c.append(r,f);return c}
  ms.map(f=>f()).forEach((g,i)=>mb.append(mcCard(g,i)));upd()}
 start()}
/* ---------- 页面搭建 ---------- */
function calcCard(t){const C=t.calc,card=el('div','card');card.innerHTML=`<h3>🧮 ${t.title.split(' ')[0]} 专属计算器</h3><div class="mut">输入数值（可用分数如 −1/3），自动生成解答与图像</div>`;
 const ins={};let k=0;C.rows.forEach(r=>{const row=el('div','row');r.forEach(([n,d])=>{row.append(el('span','',C.lb[k++]));const i=el('input','ci');i.value=d;i.inputMode='text';ins[n]=i;row.append(i)});card.append(row)});
 const out=el('div','out'),sv=el('div','fig');card.append(out,sv);
 const go=()=>{const v={};for(const n in ins){v[n]=n[0]=='r'?ins[n].value:parseNum(ins[n].value)}
  const bad=Object.keys(v).filter(n=>n[0]!='r'&&!isFinite(v[n]));if(bad.length){out.innerHTML='请输入有效数字';sv.innerHTML='';return}
  const r=C.run(v);out.innerHTML=r.h;sv.innerHTML=r.svg||''};
 Object.values(ins).forEach(i=>i.addEventListener('input',go));go();return card}
function build(){
 const tabs=$('#tabs'),main=$('#main');
 TABS.forEach((t,i)=>{
  const p=el('section','pane');p.id='p'+i;
  p.append(el('div','card intro',`<h3>${t.title}</h3>${t.intro}`));
  t.ex.forEach(e=>p.append(el('div','card',`<h3>${e.t}</h3>${e.q?'<div>'+e.q+'</div>':''}<div class="exp">${e.s}</div><div class="fig">${e.f}</div>`)));
  p.append(calcCard(t));
  const qc=el('div','card');qc.append(el('h3','','📝 随堂小测（5 题选择 · 答对 3 题解锁 2 题作答）'));const qb=el('div');qc.append(qb);p.append(qc);Quiz(qb,t.gens,5,2,false);
  main.append(p)});
 const p=el('section','pane');p.id='p'+TABS.length;
 p.append(el('div','card intro','<h3>总复习</h3>从 2.1–2.4 各节随机抽题，并加入课本总复习题中较难的题型（对称轴求参数、利润最值、根的平方和）。共 <b>10 题选择 + 5 题作答</b>，每次题目都不同。'));
 const rc=el('div','card'),rb=el('div');rc.append(rb);p.append(rc);Quiz(rb,ALL,10,5,true);main.append(p);
 const names=TABS.map(t=>t.title).concat(['📋 总复习']);
 names.forEach((n,i)=>{const b=el('button','',n);b.onclick=()=>show(i);tabs.append(b)});
 function show(i){[...tabs.children].forEach((b,j)=>b.classList.toggle('on',i==j));[...main.children].forEach((s,j)=>s.classList.toggle('on',i==j));window.scrollTo(0,0);tabs.children[i].scrollIntoView({inline:'center',block:'nearest'})}
 show(0)}
build();
