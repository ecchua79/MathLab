G('19.1',()=>{const a=R(3,6),b=R(3,6),c=R(3,6),t=R(0,1),h=`${a}名高一生、${b}名高二生、${c}名高三生组成研究小组。`,it=[[a,'高一'],[b,'高二'],[c,'高三']];return t?{q:h+'每个年级各选一名组长，有多少种选法？',a:B(a*b*c),w:[a+b+c],e:`分三步：${a}×${b}×${c}=${a*b*c}（乘法原理）。`,s:sl(it,'×',a*b*c)}:{q:h+'选其中一人当组长，有多少种选法？',a:B(a+b+c),w:[a*b*c],e:`分三类：${a}+${b}+${c}=${a+b+c}（加法原理）。`,s:sl(it,'+',a+b+c)}})];

/* ---------- 计算器 / 测验 ---------- */
function calc(h,d){h.innerHTML=`<div class="ci">${d.i.map(([k,l,v,o])=>`<label>${l}${o?`<select data-k="${k}">${o.map(x=>`<option>${x}</option>`).join('')}</select>`:`<input data-k="${k}" value="${v}">`}</label>`).join('')}</div><button class="bt">计算</button><div class="co"></div>`;const run=()=>{const v={};h.querySelectorAll('[data-k]').forEach(e=>v[e.dataset.k]=e.value);h.querySelector('.co').innerHTML=d.f(v)};h.querySelector('.bt').onclick=run;h.querySelectorAll('[data-k]').forEach(e=>e.oninput=run);run()}
function opts(x){const a=String(x.a);let w=[...new Set((x.w||[]).map(v=>B(v)).filter(v=>v>0n&&v!=x.a).map(String))].slice(0,3),t=0;while(w.length<3&&t++<99){const v=x.a+B(R(1,6))*(Math.random()<.5?-1n:1n);if(v>0n&&!w.includes(String(v))&&String(v)!=a)w.push(String(v))}return shuf([a,...w])}
function quiz(h,cf){const mk=g=>({...g(),tag:g.tag}),M=cf.mc().map(mk),Fq=cf.fl().map(mk);let ma=0,mo=0,fd=0,fo=0,bad={};
 h.innerHTML='<div class="pg"></div><div class="mq"></div><div class="fq"></div><div class="sm"></div><button class="bt">🔄 重新出题</button>';const[pg,mq,fq,sm,rb]=h.children;rb.onclick=()=>quiz(h,cf);
 const up=()=>pg.textContent=`选择题 ${ma}/${M.length}　答对 ${mo}`+(ma==M.length&&mo>=cf.need?`　｜　作答题 ${fd}/${Fq.length}　答对 ${fo}`:''),
 exh=(x,ok)=>`<div class="ex ${ok?'':'no'}"><b>${ok?'✅ 回答正确':'❌ 回答错误'}</b>，正确答案：<b>${F(x.a)}</b><br>${x.e}${x.s||''}</div>`,
 fin=()=>{const t=mo+fo,N=M.length+Fq.length,p=Math.round(t/N*100);if(cf.rev){const wk=Object.keys(bad).map(k=>`${k}（错${bad[k]}题）`).join('、');sm.innerHTML=`<div class="msg ${p>=50?'':'no'}"><b>总分：${t} / ${N}（${p}%）</b><br>${p>=90?'🏆 优秀！排列与组合掌握得非常扎实。':p>=70?'👍 良好！再巩固出错的类型就更稳了。':p>=50?'🙂 及格。建议回到各节例题和计算器再练习。':'💪 需要加强，先从各节随堂题开始，再回来挑战。'}${wk?`<br>建议复习：${wk}`:'<br>没有失分，太棒了！'}</div>`}else sm.innerHTML=`<div class="msg">本节完成：选择题 ${mo}/${M.length}，作答题 ${fo}/${Fq.length}。${t==N?'🎉 全部答对！':'点“重新出题”可挑战全新题目。'}</div>`},
 showF=()=>{Fq.forEach((x,i)=>{const d=document.createElement('div');d.className='q';d.innerHTML=`<p><b>作答题 ${i+1}</b>　${x.q}</p><input inputmode="numeric" placeholder="输入整数答案"> <button class="bt">提交</button><div class="r"></div>`;const bt=d.querySelector('button'),ip=d.querySelector('input');bt.onclick=()=>{if(!ip.value.trim())return;ip.disabled=bt.disabled=true;const ok=ip.value.replace(/[,，\s]/g,'')==String(x.a);ok?fo++:bad[x.tag]=(bad[x.tag]||0)+1;fd++;d.querySelector('.r').innerHTML=exh(x,ok);up();if(fd==Fq.length)fin()};fq.appendChild(d)})},
 afterMC=()=>{if(mo<cf.need){sm.innerHTML=`<div class="msg no">本次答对 ${mo} 题，需答对 ${cf.need} 题以上才能解锁作答题。看完解析后点“重新出题”再试一次！</div>`;return}sm.innerHTML=cf.rev?'':`<div class="msg">🎉 答对 ${mo} 题，已解锁作答题！</div>`;showF()};
 M.forEach((x,i)=>{const o=opts(x),d=document.createElement('div');d.className='q';d.innerHTML=`<p><b>第${i+1}题</b>　${x.q}</p><div class="os">${o.map((v,j)=>`<button class="op" data-v="${v}">${'ABCD'[j]}. ${F(v)}</button>`).join('')}</div><div class="r"></div>`;
  d.querySelector('.os').onclick=e=>{const b=e.target.closest('.op');if(!b||d.dataset.d)return;d.dataset.d=1;const ok=b.dataset.v==String(x.a);d.querySelectorAll('.op').forEach(k=>{k.disabled=true;if(k.dataset.v==String(x.a))k.classList.add('ok')});if(ok)mo++;else{b.classList.add('no');bad[x.tag]=(bad[x.tag]||0)+1}ma++;d.querySelector('.r').innerHTML=exh(x,ok);up();if(ma==M.length)afterMC()};mq.appendChild(d)});up()}
