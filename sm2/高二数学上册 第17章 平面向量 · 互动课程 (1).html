<script>
const ri=(a,b)=>Math.floor(Math.random()*(b-a+1))+a,pick=a=>a[ri(0,a.length-1)],sh=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]);
const N=x=>String(Math.round(x*1000)/1000).replace('-','−'),PT=(x,y)=>`(${N(x)}, ${N(y)})`;
const V=s=>`<span class=vv>${s}</span>`,M=(x,y)=>`<span class=mx><i>${x}</i><i>${y}</i></span>`,F=(n,d)=>`<span class=fr><i>${n}</i><i>${d}</i></span>`;
const R=s=>{s=String(s);const w=Math.round(s.length*8.6)+2;return `<svg class=rd width=${w+22} height=28 viewBox="0 0 ${w+22} 28"><path d="M2 16L5 14L9 24L15 4H${w+19}" fill="none" stroke-width="1.7"/><text x=18 y=21 font-size=15 textLength=${w} lengthAdjust="spacingAndGlyphs">${s}</text></svg>`};
const CL={b:'#4da3ff',r:'#ff5d6c',g:'#3ddc97',o:'#ffb02e'},L=(a,b,c,d)=>[a,b,c,d,'#8a93a6','',2];
function G(o){let X=[],Y=[];const ad=(x,y)=>{X.push(x);Y.push(y)};(o.p||[]).forEach(q=>ad(q[0],q[1]));(o.a||[]).forEach(q=>{ad(q[0],q[1]);ad(q[2],q[3])});(o.pg||[]).forEach(q=>ad(q[0],q[1]));if(o.ax)ad(0,0);
const x0=Math.floor(Math.min(...X))-1,x1=Math.ceil(Math.max(...X))+1,y0=Math.floor(Math.min(...Y))-1,y1=Math.ceil(Math.max(...Y))+1,W=340,H=250,u=Math.min(W/(x1-x0),H/(y1-y0),44),ox=(W-(x1-x0)*u)/2,oy=(H-(y1-y0)*u)/2,sx=x=>ox+(x-x0)*u,sy=y=>H-oy-(y-y0)*u;let s='',used={};
if(o.g&&x1-x0<=24&&y1-y0<=24){for(let i=x0;i<=x1;i++)s+=`<line class=gl x1=${sx(i)} y1=${sy(y0)} x2=${sx(i)} y2=${sy(y1)} />`;for(let i=y0;i<=y1;i++)s+=`<line class=gl x1=${sx(x0)} y1=${sy(i)} x2=${sx(x1)} y2=${sy(i)} />`}
if(o.ax){s+=`<line class=ax x1=${sx(x0)} y1=${sy(0)} x2=${sx(x1)} y2=${sy(0)} /><line class=ax x1=${sx(0)} y1=${sy(y0)} x2=${sx(0)} y2=${sy(y1)} /><text class=tx x=${sx(x1)-10} y=${sy(0)-6}>x</text><text class=tx x=${sx(0)+6} y=${sy(y1)+12}>y</text><text class=tx x=${sx(0)-13} y=${sy(0)+13}>O</text>`;
if(u>=16){for(let i=x0;i<=x1;i++)if(i&&i>x0&&i<x1)s+=`<text class=tx font-size=10 x=${sx(i)-3} y=${sy(0)+13} style="font-size:10px">${N(i)}</text>`;for(let i=y0;i<=y1;i++)if(i&&i>y0&&i<y1)s+=`<text class=tx x=${sx(0)-15} y=${sy(i)+4} style="font-size:10px">${N(i)}</text>`}}
if(o.pg)s+=`<polygon points="${o.pg.map(q=>sx(q[0])+','+sy(q[1])).join(' ')}" fill="rgba(77,163,255,.1)" stroke="#8a93a6" stroke-width="1.5"/>`;
(o.a||[]).forEach(q=>{const c=q[4]||CL.b,X1=sx(q[0]),Y1=sy(q[1]),X2=sx(q[2]),Y2=sy(q[3]);used[c]=1;s+=`<line x1=${X1} y1=${Y1} x2=${X2} y2=${Y2} stroke="${c}" stroke-width=2.4${q[6]?' stroke-dasharray="5 4"':''}${q[6]==2?'':` marker-end="url(#m${c.slice(1)})"`} />`;
if(q[5]){const dx=X2-X1,dy=Y2-Y1,l=Math.hypot(dx,dy)||1;s+=`<text x=${(X1+X2)/2+dy/l*13-6} y=${(Y1+Y2)/2-dx/l*13+4} fill="${c}" font-size=14 font-weight=bold font-family=serif>${q[5]}</text>`}});
(o.p||[]).forEach(q=>{s+=`<circle class=pt cx=${sx(q[0])} cy=${sy(q[1])} r=3.5 />`+(q[2]?`<text class=tx x=${sx(q[0])+(q[3]??7)} y=${sy(q[1])+(q[4]??-7)}>${q[2]}</text>`:'')});
return `<svg viewBox="0 0 ${W} ${H}" class=fig><defs>${Object.keys(used).map(c=>`<marker id=m${c.slice(1)} markerWidth=8 markerHeight=8 refX=7 refY=4 orient=auto><path d="M0 0L8 4L0 8z" fill="${c}"/></marker>`).join('')}</defs>${s}</svg>`}
const PG=()=>G({p:[[0,0,'A',-14,14],[4,0,'B',6,14],[5.5,2.5,'C',6,-6],[1.5,2.5,'D',-14,-6]],a:[[0,0,4,0,CL.b,'a'],[0,0,1.5,2.5,CL.r,'b']],pg:[[0,0],[4,0],[5.5,2.5],[1.5,2.5]]}).replace('<svg ','<svg data-k=1 ');
/* ===== 例题 ===== */
const EX=[[
{h:'例题 1',q:`ABCD 是菱形，${V('AB')}=${V('a')}，${V('AD')}=${V('b')}。以 ${V('a')}、${V('b')} 表示 ${V('BC')} 及 ${V('DC')}。`,g:G({p:[[0,0,'A',-14,14],[3,1,'B',6,14],[2,4,'C',6,-6],[-1,3,'D',-14,-6]],a:[[0,0,3,1,CL.b,'a'],[0,0,-1,3,CL.r,'b'],[3,1,2,4,CL.r,'b'],[-1,3,2,4,CL.b,'a']],pg:[[0,0],[3,1],[2,4],[-1,3]]}),s:`菱形（平行四边形）对边平行且相等：<br>${V('BC')}=${V('AD')}=${V('b')}，${V('DC')}=${V('AB')}=${V('a')}`},
{h:'例题 2',q:`ABCD 是平行四边形，${V('AD')}=${V('a')}，${V('DB')}=${V('b')}。求 (a) ${V('AB')}；(b) ${V('DC')}。`,g:G({p:[[0,2.5,'A',-12,-4],[3.5,2.5,'B',4,-6],[1.5,0,'D',-12,14],[5,0,'C',4,14]],a:[[0,2.5,1.5,0,CL.b,'a'],[1.5,0,3.5,2.5,CL.r,'b'],[0,2.5,3.5,2.5,CL.g,'a+b']],pg:[[0,2.5],[3.5,2.5],[5,0],[1.5,0]]}),s:`(a) ${V('AB')}=${V('AD')}+${V('DB')}=${V('a')}+${V('b')}（三角形法则：首尾相接）<br>(b) ${V('DC')}=${V('DB')}+${V('BC')}=${V('b')}+${V('a')}（因为 ${V('BC')}=${V('AD')}=${V('a')}）`},
{h:'例题 3',q:`ABCD 是长方形，${V('AB')}=${V('a')}，${V('BC')}=${V('b')}。(a) 以 ${V('a')}、${V('b')} 表示 ${V('CD')} 及 ${V('DA')}；(b) 求 ${V('AB')}+${V('BC')}+${V('CD')}+${V('DA')}。`,g:G({p:[[0,0,'A',-14,14],[0,2.5,'B',-14,-4],[4,2.5,'C',6,-4],[4,0,'D',6,14]],a:[[0,0,0,2.5,CL.b,'a'],[0,2.5,4,2.5,CL.r,'b'],[4,2.5,4,0,CL.o,'−a'],[4,0,0,0,CL.g,'−b']]}),s:`(a) ${V('CD')}=−${V('AB')}=−${V('a')}，${V('DA')}=−${V('BC')}=−${V('b')}<br>(b) ${V('a')}+${V('b')}+(−${V('a')})+(−${V('b')})=<b>0</b>（首尾相接回到起点，得零向量）`},
{h:'例题 4',q:`ABCD 是平行四边形，${V('BA')}=${V('a')}，${V('BC')}=${V('b')}。求 (a) ${V('AC')}；(b) ${V('DB')}。`,g:G({p:[[2,3,'B',-4,-8],[6,3,'C',6,-6],[0,0,'A',-14,14],[4,0,'D',6,14]],a:[[2,3,0,0,CL.b,'a'],[2,3,6,3,CL.r,'b'],[0,0,6,3,CL.g,'AC'],[4,0,2,3,CL.o,'DB']],pg:[[2,3],[6,3],[4,0],[0,0]]}),s:`(a) ${V('AC')}=${V('AB')}+${V('BC')}=−${V('BA')}+${V('BC')}=−${V('a')}+${V('b')}<br>(b) ${V('DB')}=${V('DC')}+${V('CB')}=−${V('BA')}−${V('BC')}=−${V('a')}−${V('b')}`},
{h:'例题 5',q:`A、B、C 分别为 △DEF 三边 DE、DF、EF 的中点，${V('AB')}=${V('a')}，${V('CA')}=${V('b')}。求 ${V('EF')}、${V('EB')}、${V('CB')}、${V('ED')}。`,g:G({p:[[2,4,'D',-4,-8],[0,0,'E',-12,12],[4,0,'F',6,12],[1,2,'A',-14,0],[3,2,'B',7,0],[2,0,'C',-3,14]],a:[[1,2,3,2,CL.b,'a'],[2,0,1,2,CL.r,'b']],pg:[[2,4],[0,0],[4,0]]}),s:`${V('EF')}=${V('EC')}+${V('CF')}=${V('a')}+${V('a')}=2${V('a')}<br>${V('EB')}=${V('EC')}+${V('CA')}+${V('AB')}=${V('a')}+${V('b')}+${V('a')}=2${V('a')}+${V('b')}<br>${V('CB')}=${V('CA')}+${V('AB')}=${V('b')}+${V('a')}<br>${V('ED')}=${V('EF')}+${V('FD')}=2${V('a')}+2${V('b')}`},
{h:'例题 6',q:`△PQR 中，S、T 分别在 PQ、QR 上，PT 与 RS 交于 O。填入适当的向量：(a) ${V('SP')}−${V('RP')}=＿＿；(b) ${V('OP')}+＿＿=${V('OR')}；(c) ${V('QS')}−＿＿=${V('QR')}；(d) ${V('QS')}+${V('SP')}=${V('QT')}−＿＿。`,g:G({p:[[2,5,'P',-4,-8],[0,0,'Q',-14,14],[6,0,'R',6,14],[.8,2,'S',-14,0],[2.5,0,'T',-4,14],[2.36,1.4,'O',6,-6]],a:[L(2,5,2.5,0),L(6,0,.8,2)],pg:[[2,5],[0,0],[6,0]]}),s:`(a) ${V('SP')}−${V('RP')}=${V('SP')}+${V('PR')}=<b>${V('SR')}</b><br>(b) x=${V('OR')}−${V('OP')}=${V('OR')}+${V('PO')}=${V('PO')}+${V('OR')}=<b>${V('PR')}</b><br>(c) x=${V('QS')}−${V('QR')}=${V('QS')}+${V('RQ')}=${V('RQ')}+${V('QS')}=<b>${V('RS')}</b><br>(d) ${V('QS')}+${V('SP')}=${V('QP')}，x=${V('QT')}−${V('QP')}=${V('QT')}+${V('PQ')}=${V('PQ')}+${V('QT')}=<b>${V('PT')}</b>`}],
[{h:'例题 7',q:`求向量 ${V('AB')}=${M('−4','3')} 的大小。`,g:G({a:[[0,0,-4,3,CL.b,'AB'],L(0,0,-4,0),L(-4,0,-4,3)],ax:1,g:1}),s:`|${V('AB')}|=${R('(−4)²+3²')}=${R('25')}=5<br>（图中直角三角形两条直角边为 4 与 3，斜边即向量的大小。）`},
{h:'例题 8',q:`${V('a')}=${M(3,2)}，${V('b')}=${M(-2,'q')}，求常数 p、q 使 p(${V('a')}+${V('b')})=4i+24j。`,g:G({a:[[0,0,3,2,CL.b,'a'],[0,0,-2,4,CL.r,'b'],[0,0,1,6,CL.o,'a+b'],[0,0,4,24,CL.g,'4(a+b)']],ax:1}),s:`${V('a')}+${V('b')}=${M(1,'2+q')}，p${M(1,'2+q')}=${M(4,24)}<br>p=4 ①，p(2+q)=24 ②；①代入②：4(2+q)=24 → 2+q=6 → <b>p=4，q=4</b><br>图：a+b=(1, 6)，放大 4 倍得 (4, 24)。`},
{h:'例题 9',q:`${V('p')}=2i+5j，${V('q')}=i−3j，求常数 m、n 使 m${V('p')}+n${V('q')}=8i+9j。`,g:G({a:[[0,0,6,15,CL.b,'3p'],[6,15,8,9,CL.r,'2q'],[0,0,8,9,CL.g,'8i+9j']],ax:1}),s:`比较 i、j 的系数：<br>2m+n=8 ①，5m−3n=9 ②<br>由①：n=8−2m，代入②：5m−3(8−2m)=9 → 11m=33 → <b>m=3，n=2</b><br>图：3${V('p')}（蓝）接 2${V('q')}（红），合成 8i+9j（绿）。`},
{h:'例题 10',q:`${V('a')}=${M('m','−3')}，${V('b')}=${M('−5','6')} 平行，求 m。`,g:G({a:[[0,0,2.5,-3,CL.b,'a'],[0,0,-5,6,CL.r,'b']],ax:1,g:1}),s:`存在 k 使 ${V('a')}=k${V('b')}：m=−5k ①，−3=6k ②<br>由②：k=−${F(1,2)}，代入①：m=−5×(−${F(1,2)})=<b>${F(5,2)}</b><br>图：a 与 b 在同一直线上，方向相反。`},
{h:'例题 11',q:`A(−3,2)、C(4,−2)，${V('AB')}=${M(4,1)}，求点 B 的坐标，并求 ${V('BC')}。`,g:G({p:[[-3,2,'A',-14,14],[1,3,'B',-4,-9],[4,-2,'C',6,-6]],a:[[-3,2,1,3,CL.b,'AB'],[1,3,4,-2,CL.r,'BC']],ax:1,g:1}),s:`${V('OB')}=${V('OA')}+${V('AB')}=${M(-3,2)}+${M(4,1)}=${M(1,3)}，<b>B(1, 3)</b><br>${V('BC')}=${V('OC')}−${V('OB')}=${M(4,-2)}−${M(1,3)}=${M(3,-5)}`},
{h:'例题 12',q:`${V('a')}=8i−6j，求与 ${V('a')} 同向的单位向量。`,g:G({a:[[0,0,8,-6,CL.b,'a'],[0,0,.8,-.6,CL.o,'â']],ax:1,g:1}),s:`|${V('a')}|=${R('8²+(−6)²')}=10<br>â=${F(V('a'),'|a|')}=${F('8i−6j',10)}=${F(4,5)}i−${F(3,5)}j<br>反向单位向量为 −â；大小为 2 的反向向量为 −2â。`}],
[{h:'例题 13',q:`菱形 ABCD 中 A(2,1)、B(5,2)、D(3,4)。求 (a) BD 中点 M；(b) 点 C。`,g:G({p:[[2,1,'A',-14,14],[5,2,'B',6,14],[6,5,'C',6,-4],[3,4,'D',-14,-4],[4,3,'M',6,-6]],pg:[[2,1],[5,2],[6,5],[3,4]],ax:1,g:1}),s:`(a) ${V('OM')}=${F(V('OD')+'+'+V('OB'),2)}=${F(M(3,4)+'+'+M(5,2),2)}=${M(4,3)}，M(4, 3)<br>(b) ${V('AD')}=${V('BC')} → ${V('OC')}=${V('OD')}−${V('OA')}+${V('OB')}=${M(3,4)}−${M(2,1)}+${M(5,2)}=${M(6,5)}，C(6, 5)`},
{h:'例题 14',q:`A(0,k)、B(2,4)、C(6,6) 三点共线，求 (a) k；(b) BC:CA。`,g:G({p:[[0,3,'A',-14,14],[2,4,'B',-4,-9],[6,6,'C',4,-8]],a:[[0,3,2,4,CL.o,''],[2,4,6,6,CL.g,'']],ax:1,g:1}),s:`${V('BC')}=${M(4,2)}，${V('CA')}=${M(-6,'k−6')}<br>共线 ⇒ ${V('BC')}∥${V('CA')}：${F(4,-6)}=${F(2,'k−6')} → k−6=−3 → <b>k=3</b><br>BC:CA=|${F(4,-6)}|=${F(2,3)}，即 <b>2:3</b>`},

{h:'例题 16',q:`${V('OA')}=${V('a')}，${V('OB')}=${V('b')}。D 在 AB 上，CE 经过 D 并与射线 OA 交于 E。(a) 若 ${F('AD','DB')}=${F(1,4)}，以 ${V('a')}、${V('b')} 表示 ${V('OD')}；(b) 若 ${V('OE')}=4${V('OA')}，以 ${V('a')}、${V('b')} 表示 ${V('DE')}。`,g:G({p:[[0,0,'O',-14,14],[2,0,'A',-4,14],[8,0,'E',6,14],[0,5,'B',-14,-4],[0,1.25,'C',-14,4],[1.6,1,'D',-2,-9]],a:[[0,0,2,0,CL.b,'a'],[0,0,0,5,CL.r,'b'],[0,0,1.6,1,CL.g,'OD'],[1.6,1,8,0,CL.o,'DE'],L(0,5,2,0),L(0,1.25,1.6,1)]}),s:`(a) ${V('OD')}=${F(V('OB')+'+4'+V('OA'),'1+4')}=${F(1,5)}${V('b')}+${F(4,5)}${V('a')}<br>(b) ${V('OE')}=4${V('a')}，${V('DE')}=${V('OE')}−${V('OD')}=4${V('a')}−(${F(1,5)}${V('b')}+${F(4,5)}${V('a')})=${F(16,5)}${V('a')}−${F(1,5)}${V('b')}`},

{h:'例题 18',q:`扫地机器人从 O 出发：向东 8 m、向北 6 m；再向东 4 m、向南 1 m。求最终位移向量及与 O 的距离。`,g:G({a:[[0,0,8,6,CL.b,'a'],[8,6,12,5,CL.r,'b'],[0,0,12,5,CL.g,'a+b']],p:[[0,0,'O',-12,14]],ax:1,g:1}),s:`${V('a')}=${M(8,6)}，${V('b')}=${M(4,-1)}<br>${V('a')}+${V('b')}=${M(12,5)} m<br>距离 |${V('a')}+${V('b')}|=${R('12²+5²')}=${R(169)}=<b>13 m</b>`}]];

else if(m==1){t=`${V('a')}−${V('b')}=${M(N(ax),N(ay))}−${M(N(bx),N(by))}=${M(N(ax-bx),N(ay-by))}<br>大小：${mag((ax-bx)**2+(ay-by)**2)}`;a=[[0,0,ax,ay,CL.b,'a'],[0,0,bx,by,CL.r,'b'],[bx,by,ax,ay,CL.o,'a−b']]}
else{t=`${N(k)}${V('a')}=${N(k)}${M(N(ax),N(ay))}=${M(N(k*ax),N(k*ay))}<br>大小：|k||a|=${N(Math.abs(k))}×${N(Math.hypot(ax,ay))}=${N(Math.abs(k)*Math.hypot(ax,ay))}；${k>0?'与 a 同向':k<0?'与 a 反向':'零向量'}`;a=[[0,0,ax,ay,CL.b,'a'],[0,0,k*ax,k*ay,CL.g,'ka']]}
o.innerHTML=t+G({a,ax:1,g:1})})}

wire(h,()=>{const[x1,y1,x2,y2]=rd(h),dx=x2-x1,dy=y2-y1,n=dx*dx+dy*dy,c=Math.sqrt(n),cs=Number.isInteger(c)?c:R(n),a=[[x1,y1,x2,y2,CL.b,'PQ'],L(x1,y1,x2,y1),L(x2,y1,x2,y2)];
let t=`${V('PQ')}=${V('OQ')}−${V('OP')}=${M(N(x2),N(y2))}−${M(N(x1),N(y1))}=${M(N(dx),N(dy))}=${N(dx)}i+(${N(dy)})j<br>|${V('PQ')}|=${R(`(${N(dx)})²+(${N(dy)})²`)}=${mag(n)}<br>`;
if(n){t+=`单位向量 â=${M(F(N(dx),cs),F(N(dy),cs))}≈${M(N(dx/c),N(dy/c))}`;a.push([x1,y1,x1+dx/c,y1+dy/c,CL.o,'â'])}else t+='零向量，没有单位向量';
h.querySelector('.out').innerHTML=t+G({a,p:[[x1,y1,'P',-14,14],[x2,y2,'Q',6,-6]],ax:1,g:1})})}

wire(h,()=>{const[x1,y1,x2,y2,m,n]=rd(h),s=m+n;if(!s||m<0||n<0){h.querySelector('.out').innerHTML='请输入非负的 m、n（m+n≠0）';return}
const px=(m*x2+n*x1)/s,py=(m*y2+n*y1)/s;h.querySelector('.out').innerHTML=`${V('OP')}=${F('m'+V('OB')+'+n'+V('OA'),'m+n')}<br>x=${F(`${N(m)}(${N(x2)})+${N(n)}(${N(x1)})`,N(s))}=${N(px)}，y=${F(`${N(m)}(${N(y2)})+${N(n)}(${N(y1)})`,N(s))}=${N(py)}<br><b>P(${N(px)}, ${N(py)})</b>`+G({a:[[x1,y1,px,py,CL.g,N(m)],[px,py,x2,y2,CL.o,N(n)]],p:[[x1,y1,'A',-14,14],[x2,y2,'B',6,-6],[px,py,'P',-4,-9]],ax:1,g:1})})}

const g31b=()=>{const p=sec();return mcq(`A${PT(p.x,p.y)}、B${PT(p.X,p.Y)}，点 P 内分 AB 成 ${p.m}:${p.n}，求 P。`,PT(p.px,p.py),[PT(p.x+p.n*p.dx,p.y+p.n*p.dy),PT((p.x+p.X)/2,(p.y+p.Y)/2),PT(p.px+1,p.py),PT(p.X-p.m*p.dx,p.Y-p.m*p.dy)],secE(p)+`，故 P${PT(p.px,p.py)}`,secG(p))};
const f31a=()=>{const p=sec();return{q:`A${PT(p.x,p.y)}、B${PT(p.X,p.Y)}，点 P 内分 AB 成 ${p.m}:${p.n}，求点 P 的 x 坐标。`,v:p.px,e:secE(p),s:secG(p)}};
function col(){const k=ri(-4,4),dx=ri(1,3),dy=pick([-2,-1,1,2,3]),t=ri(2,3);return{k,bx:dx,by:k+dy,cx:dx*t,cy:k+dy*t}}
const colE=p=>`${V('BC')}=${M(N(p.cx-p.bx),N(p.cy-p.by))}，${V('CA')}=${M(N(-p.cx),'k−'+(p.cy<0?`(${N(p.cy)})`:p.cy))}；${V('BC')}∥${V('CA')}：${F(N(p.cx-p.bx),N(-p.cx))}=${F(N(p.cy-p.by),'k−'+(p.cy<0?`(${N(p.cy)})`:p.cy))}，解得 k=${N(p.k)}`,colG=p=>G({p:[[0,p.k,'A',-14,14],[p.bx,p.by,'B',-4,-9],[p.cx,p.cy,'C',4,-8]],a:[[0,p.k,p.cx,p.cy,CL.o,'']],ax:1,g:1});
const g31c=()=>{const p=col();return mcq(`A(0,k)、B${PT(p.bx,p.by)}、C${PT(p.cx,p.cy)} 三点共线，求 k。`,N(p.k),[p.k+1,p.k-1,-p.k,p.k+2].map(N),colE(p),colG(p))};
const f31b=()=>{const p=col();return{q:`A(0,k)、B${PT(p.bx,p.by)}、C${PT(p.cx,p.cy)} 三点共线，求 k。`,v:p.k,e:colE(p),s:colG(p)}};
const g31d=()=>{const A=[ri(-3,2),ri(-3,2)],B=[A[0]+ri(2,5),A[1]+ri(-1,1)],C=[B[0]+ri(-1,2),B[1]+ri(2,4)],D=[A[0]+C[0]-B[0],A[1]+C[1]-B[1]];return mcq(`平行四边形 ABCD 中 A${PT(...A)}、B${PT(...B)}、C${PT(...C)}，求 D。`,PT(...D),[PT(A[0]+B[0]-C[0],A[1]+B[1]-C[1]),PT(B[0]+C[0]-A[0],B[1]+C[1]-A[1]),PT(D[0]+1,D[1])],`${V('AD')}=${V('BC')} ⇒ ${V('OD')}=${V('OA')}+${V('OC')}−${V('OB')}=${M(N(A[0]),N(A[1]))}+${M(N(C[0]),N(C[1]))}−${M(N(B[0]),N(B[1]))}=${M(N(D[0]),N(D[1]))}`,G({p:[[...A,'A',-14,14],[...B,'B',6,14],[...C,'C',6,-6],[...D,'D',-14,-6]],pg:[A,B,C,D],ax:1,g:1}))};
const g31e=()=>{const x=ri(-4,2),y=ri(-4,2),dx=ri(1,2),dy=pick([-1,1,2]),t=ri(3,5),r=`1:${t-1}`;return mcq(`A${PT(x,y)}、B${PT(x+dx,y+dy)}、C${PT(x+t*dx,y+t*dy)} 三点共线，求 AB:BC。`,r,[`1:${t}`,`${t-1}:1`,`${t}:1`],`${V('AB')}=${M(N(dx),N(dy))}，${V('BC')}=${M(N((t-1)*dx),N((t-1)*dy))}=${t-1}${V('AB')}，故 AB:BC=${r}`,G({p:[[x,y,'A',-14,14],[x+dx,y+dy,'B',-4,-9],[x+t*dx,y+t*dy,'C',6,-6]],a:[[x,y,x+t*dx,y+t*dy,CL.o,'']],ax:1,g:1}))};

B.querySelectorAll('.qc').forEach((c,i)=>{const q=f[i];c.querySelector('.sb').onclick=()=>{if(c.dataset.l)return;c.dataset.l=1;let s=c.querySelector('input').value.replace(/−/g,'-').replace(/\s/g,''),v=s.includes('/')?s.split('/')[0]/s.split('/')[1]:parseFloat(s);const ok=Math.abs(v-q.v)<.011;

A.querySelectorAll('.qc').forEach((c,i)=>{const q=m[i],bs=[...c.querySelectorAll('.op')];bs.forEach((b,j)=>b.onclick=()=>{if(c.dataset.l)return;c.dataset.l=1;const ok=j==q.a;bs[q.a].classList.add('ok');if(!ok)b.classList.add('bad');
