<script>
const $=s=>document.querySelector(s),rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1)),pick=a=>a[rnd(0,a.length-1)];
const shuf=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=rnd(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
const gcd=(a,b)=>b?gcd(b,a%b):Math.abs(a),N=n=>String(n).replace('-','−');
const F=(n,d)=>`<span class=fr><i>${n}</i><b>${d}</b></span>`,P=(b,e)=>`${b}<sup>${e}</sup>`,L=(b,x)=>`log<sub>${b}</sub>${x}`;
const R=(c,k=2)=>`<span class=rd>${k!==2?`<i>${k}</i>`:''}<svg viewBox="0 0 10 20" preserveAspectRatio="none"><path d="M0 12L3 10L5 19L10 1H11"/></svg><span class=rr>${c}</span></span>`;
const rat=(n,d=1)=>{if(d<0){n=-n;d=-d}const g=gcd(n,d)||1;return[n/g,d/g]};
const fR=([n,d])=>d==1?N(n):(n<0?'−':'')+F(Math.abs(n),d),fe=(p,q)=>q==1?N(p):(p<0?'−':'')+F(Math.abs(p),q);
const fn=v=>N(Number.isInteger(v)?v:parseFloat(v.toPrecision(8)));
const lin=(p,q)=>(p==1?'x':p+'x')+(q>0?'+'+q:q<0?'−'+(-q):'');
/* ---------- SVG helpers ---------- */
function G(o){const W=320,H=210,m=26,[x0,x1]=o.xr,[y0,y1]=o.yr,sx=x=>m+(x-x0)/(x1-x0)*(W-2*m),sy=y=>H-m-(y-y0)/(y1-y0)*(H-2*m);
 const ay=Math.min(Math.max(0,y0),y1),ax=Math.min(Math.max(0,x0),x1),sxp=Math.max(1,Math.round((x1-x0)/8)),syp=Math.max(1,Math.round((y1-y0)/6));
 let s=`<svg viewBox="0 0 ${W} ${H}" class=gr><defs><clipPath id=cp><rect x=${m} y=${m/2} width=${W-2*m} height=${H-1.5*m}/></clipPath></defs>`;
 for(let x=Math.ceil(x0/sxp)*sxp;x<=x1;x+=sxp)if(x)s+=`<line x1=${sx(x)} x2=${sx(x)} y1=${sy(ay)-2} y2=${sy(ay)+2} stroke=currentColor /><text x=${sx(x)} y=${sy(ay)+11} text-anchor=middle>${N(x)}</text>`;
 for(let y=Math.ceil(y0/syp)*syp;y<=y1;y+=syp)if(y)s+=`<line y1=${sy(y)} y2=${sy(y)} x1=${sx(ax)-2} x2=${sx(ax)+2} stroke=currentColor /><text x=${sx(ax)-4} y=${sy(y)+3} text-anchor=end>${N(y)}</text>`;
 s+=`<line x1=${sx(x0)} x2=${sx(x1)} y1=${sy(ay)} y2=${sy(ay)} stroke=currentColor /><line x1=${sx(ax)} x2=${sx(ax)} y1=${sy(y0)} y2=${sy(y1)} stroke=currentColor /><text x=${W-8} y=${sy(ay)-4}>x</text><text x=${sx(ax)+5} y=${m/2+6}>y</text>`;
 (o.hl||[]).forEach(v=>s+=`<line x1=${sx(x0)} x2=${sx(x1)} y1=${sy(v)} y2=${sy(v)} stroke=#16a34a stroke-dasharray="4 3" /><text x=${sx(x1)-4} y=${sy(v)-3} text-anchor=end>y=${N(v)}</text>`);
 (o.vl||[]).forEach(v=>s+=`<line y1=${sy(y0)} y2=${sy(y1)} x1=${sx(v)} x2=${sx(v)} stroke=#16a34a stroke-dasharray="4 3" /><text x=${sx(v)+3} y=${m/2+14}>x=${N(v)}</text>`);
 (o.curves||[]).forEach((c,k)=>{let d='',pen=0;for(let i=0;i<=240;i++){const x=x0+(x1-x0)*i/240,y=c.f(x);if(isFinite(y)&&y>y0-(y1-y0)&&y<y1+(y1-y0)){d+=(pen?'L':'M')+sx(x).toFixed(1)+' '+sy(y).toFixed(1)+' ';pen=1}else pen=0}
  s+=`<path d="${d}" fill=none stroke=${c.c||['#e11d48','#2563eb'][k]} stroke-width=2 clip-path="url(#cp)"/>`;if(c.l)s+=`<text x=${sx(c.lx??x1)-4} y=${sy(c.f(c.lx??x1))>m?Math.max(sy(c.f(c.lx??x1)),m)-4:m} text-anchor=end fill=${c.c||['#e11d48','#2563eb'][k]} style="fill:${c.c||['#e11d48','#2563eb'][k]}">${c.l}</text>`});
 (o.pts||[]).forEach(p=>{s+=`<line x1=${sx(p.x)} x2=${sx(p.x)} y1=${sy(p.y)} y2=${sy(ay)} stroke=#888 stroke-dasharray="2 2" /><line x1=${sx(p.x)} x2=${sx(ax)} y1=${sy(p.y)} y2=${sy(p.y)} stroke=#888 stroke-dasharray="2 2" /><circle cx=${sx(p.x)} cy=${sy(p.y)} r=3.5 fill=#f59e0b stroke=#000 /><text x=${sx(p.x)+(sx(p.x)>W-90?-6:6)} y=${sy(p.y)-6} text-anchor=${sx(p.x)>W-90?'end':'start'}>${p.l}</text>`});
 return s+'</svg>'}
const flow=(rows,w=78)=>{const h=26,g=20;let s='';rows.forEach((r,j)=>r.forEach((t,i)=>{const x=i*(w+g)+2,y=j*40+4;s+=`<rect x=${x} y=${y} width=${w} height=${h} rx=6 class=bx /><text x=${x+w/2} y=${y+17} text-anchor=middle style="font-size:10.5px">${t}</text>`+(i?`<path d="M${x-g+3} ${y+13}H${x-3}m-5-4l5 4l-5 4" class=ar />`:'')}));return`<svg viewBox="0 0 ${Math.max(...rows.map(r=>r.length))*(w+g)} ${rows.length*40+6}" class=gr>${s}</svg>`};
/* ---------- question engine ---------- */
const build=(q,ansH,wr,exp,ex={})=>{const w=[...new Set(wr)].filter(x=>x!==ansH).slice(0,3),opts=shuf([ansH,...w]);return{q,opts,a:opts.indexOf(ansH),exp,ansH,...ex}};
const mkR=(q,ans,wr,exp,ex={})=>{ans=rat(...ans);const seen=new Set([ans.join()]),w=[];for(const r of [...wr.map(x=>rat(...x)),...[1,-1,2,-2,3,-3].map(k=>[ans[0]+k*ans[1],ans[1]])]){if(!seen.has(r.join())){seen.add(r.join());w.push(r)}}return build(q,fR(ans),w.map(fR),exp,{val:ans[0]/ans[1],...ex})};
const g11a=()=>{const r=pick([2,3,4,5]),q=pick([2,3]),a=r**q;let p=pick([1,2,3,-1,-2,-3]);if(p%q==0)p=p>0?1:-1;const ap=Math.abs(p),ans=p>0?[r**p,1]:[1,r**ap];
 return mkR(`求 ${P(a,fe(p,q))} 的值（不使用计算机）`,ans,[[r*ap,1],[a**ap,1],p>0?[1,r**p]:[r**ap,1],[-ans[0],ans[1]]],`${P(a,fe(p,q))} = (${R(a,q)})<sup>${N(p)}</sup> = ${r}<sup>${N(p)}</sup> = ${fR(ans)}`)};
const g11b=()=>{const b=pick([2,3,5]);let p1,q1,p2,q2,mul,P3,Q3;do{p1=rnd(1,3);q1=rnd(-3,3);p2=rnd(1,3);q2=rnd(-3,3);mul=Math.random()<.5;P3=p1+(mul?p2:-p2);Q3=q1+(mul?q2:-q2)}while(P3<1);
 const A=lin(p1,q1),B=lin(p2,q2);return build(`化简 ${P(b,A)} ${mul?'×':'÷'} ${P(b,B)}`,P(b,lin(P3,Q3)),[P(b,lin(P3,-Q3)),P(b,lin(P3,q1*q2)),P(b,lin(p1*p2,Q3)),P(b,lin(P3+1,Q3)),P(b,lin(P3+2,Q3)),P(b,lin(P3,Q3+1)),P(b,lin(P3,Q3-1))],`${mul?'同底数相乘，指数相加':'同底数相除，指数相减'}：(${A}) ${mul?'+':'−'} (${B}) = ${lin(P3,Q3)}`)};
const g11c=()=>{const big=Math.random()<.5,a=big?pick([1.5,2,3,5]):pick([0.3,0.5,0.6,0.8]);let s=rnd(-30,30)/10,t=rnd(-30,30)/10;if(s==t)t=s+1.5;
 const A=P(a,N(s)),B=P(a,N(t)),gt=(s>t)==big,top=Math.max(a**s,a**t,1.5)*1.25;
 return build(`比较 ${A} 与 ${B} 的大小`,gt?`${A} > ${B}`:`${A} < ${B}`,[gt?`${A} < ${B}`:`${A} > ${B}`,`${A} = ${B}`,'无法比较'],`底数 ${a} ${big?'> 1，函数在 (−∞, ∞) 上是增函数':'介于 0 与 1 之间，函数在 (−∞, ∞) 上是减函数'}；指数 ${N(s)} ${s>t?'>':'<'} ${N(t)}，所以 ${A} ${gt?'>':'<'} ${B}。`,
  {fig:G({xr:[-3.5,3.5],yr:[-top*.1,top],curves:[{f:x=>a**x,l:`y=${a}ˣ`,lx:3}],pts:[{x:s,y:a**s,l:N(s)},{x:t,y:a**t,l:N(t)}]})})};
const g11d=()=>{const a=pick([2,3,5]),k=rnd(1,3);return mkR(`已知 f(x) = ${P(a,'x')}，求 f(${N(-k)})`,[1,a**k],[[-1,a**k],[a**k,1],[-(a**k),1],[1,a*k]],`f(${N(-k)}) = ${P(a,N(-k))} = ${F(1,P(a,k))} = ${F(1,a**k)}`)};
const g11e=()=>{const b=pick([2,3,5]),k=pick([-3,-2,1,2,3]);return build(`函数 y = ${P(b,'x')} ${k>0?'+':'−'} ${Math.abs(k)} 的图像的渐近线是？`,`y = ${N(k)}`,['y = 0',`y = ${N(1+k)}`,`x = ${N(k)}`],`因为 ${P(b,'x')} > 0 且趋近 0，所以 y = ${P(b,'x')} ${k>0?'+':'−'} ${Math.abs(k)} 无限趋近 y = ${N(k)}。`,
 {fig:G({xr:[-3,3],yr:[Math.min(-1,k-1.5),Math.max(k+6,6)],curves:[{f:x=>b**x+k}],hl:[k]})})};
const g21=()=>{const a=pick([2,3,5]),n=pick([-2,-1,2,3,4]),V=fR(n>0?[a**n,1]:[1,a**-n]);return build(`将 ${P(a,N(n))} = ${V} 写成对数式`,`${L(a,V)} = ${N(n)}`,[`${L(a,N(n))} = ${V}`,`${L(V,a)} = ${N(n)}`,`${L(a,V)} = ${N(-n)}`],`${P('a','n')} = x ⇔ ${L('a','x')} = n：底数 ${a} 是对数的底，幂 ${V} 是真数，指数 ${N(n)} 是对数值。`)};
const g22=()=>{const a=pick([2,3,4,5,10]),n=pick([-2,-1,2,3]),x=n>0?[a**n,1]:[1,a**-n];return mkR(`求 x：${L(a,'x')} = ${N(n)}`,x,[[a*n,1],n>0?[n**a,1]:[1,(-n)**a],[a+n,1],n>0?[1,a**n]:[a**-n,1]],`${L(a,'x')} = ${N(n)} ⇒ x = ${P(a,N(n))} = ${fR(x)}`)};
const g23=()=>{if(Math.random()<.5){const a=pick([2,3,5]),s=rnd(2,4),t=rnd(1,s-1),add=Math.random()<.5,X=a**s,Y=a**t,ans=add?s+t:s-t;
  return mkR(`不使用计算机，求 ${L(a,X)} ${add?'+':'−'} ${L(a,Y)} 的值`,[ans,1],add?[[s*t,1],[s-t,1],[ans+1,1]]:[[s+t,1],[s*t,1],[ans+1,1]],`${add?'积':'商'}的对数：${L(a,X)} ${add?'+':'−'} ${L(a,Y)} = ${L(a,`${X}${add?'×':'÷'}${Y}`)} = ${L(a,a**ans)} = ${ans}`)}
 const k=rnd(1,3),C=pick([2,4,5,8,25]),M=C*10**k,A=pick([2,4,5,8,20,25,40,50,100,200,250].filter(d=>M%d==0&&M/d>=2)),B=M/A;
 return mkR(`不使用计算机，求 log ${A} + log ${B} − log ${C} 的值`,[k,1],[[k+1,1],[k+2,1],[k-1,1]],`log ${A} + log ${B} − log ${C} = log ${F(A+'×'+B,C)} = log ${10**k} = ${k}`)};
const g24=()=>{const r=pick([2,3,5]),p=pick([2,3,4]);if(Math.random()<.5){const q=rnd(1,5),ans=rat(q,p);
  return mkR(`不使用计算机，求 ${L(r**p,r**q)} 的值`,ans,[rat(p,q),[q*p,1],[q-p,1]],`换底（以 ${r} 为底）：${L(r**p,r**q)} = ${F(L(r,P(r,q)),L(r,P(r,p)))} = ${F(q,p)}${ans[1]==1?' = '+ans[0]:''}`)}
 const ans=rat(1,2*p);return mkR(`不使用计算机，求 ${L(r**p,R(r))} 的值`,ans,[rat(1,p),[2*p,1],rat(p,2)],`${R(r)} = ${P(r,fe(1,2))}，换底：${L(r**p,R(r))} = ${F(L(r,P(r,fe(1,2))),L(r,P(r,p)))} = ${F(F(1,2),p)} = ${fR(ans)}`)};
const g25=()=>{const a=pick([2,3,5]),k=pick([-4,-3,-2,-1,1,2,3,4]),T=k>0?`x − ${k}`:`x + ${-k}`;
 return build(`函数 y = ${L(a,'('+T+')')} 的定义域是？`,`x > ${N(k)}`,[`x > ${N(-k)}`,`x < ${N(k)}`,`x ≥ ${N(k)}`],`真数必须大于 0：${T} > 0 ⇒ x > ${N(k)}。图中虚线 x = ${N(k)} 是渐近线。`,{fig:G({xr:[k-2.5,k+8],yr:[-3,4],curves:[{f:x=>Math.log(x-k)/Math.log(a)}],vl:[k]})})};
const g26=()=>{const bb=pick([[2,1],[3,1],[5,1],[1,2],[1,3],[2,5]]),a=bb[0]/bb[1],big=a>1;let m=rnd(2,12),n=rnd(2,12);if(m==n)n=m+3;
 const B=bb[1]==1?bb[0]:F(bb[0],bb[1]),X=L(B,m),Y=L(B,n),gt=(m>n)==big,f=x=>Math.log(x)/Math.log(a),lo=Math.min(f(m),f(n),0)-1,hi=Math.max(f(m),f(n),0)+1;
 return build(`比较 ${X} 与 ${Y} 的大小`,`${X} ${gt?'>':'<'} ${Y}`,[`${X} ${gt?'<':'>'} ${Y}`,`${X} = ${Y}`,'无法比较'],`底数 ${B} ${big?'> 1，对数函数在 (0, ∞) 上是增函数':'介于 0 与 1 之间，对数函数在 (0, ∞) 上是减函数'}；真数 ${m} ${m>n?'>':'<'} ${n}，所以 ${X} ${gt?'>':'<'} ${Y}。`,{fig:G({xr:[-.5,14],yr:[lo,hi],curves:[{f}],pts:[{x:m,y:f(m),l:`真数${m}`},{x:n,y:f(n),l:`真数${n}`}]})})};
const g31=()=>{const a=pick([2,3,5]),c=pick([2,3]),x0=pick([-2,-1,1,2,3,4]),b=x0*(c-1);return mkR(`解方程 ${P(a,lin(1,b))} = ${P(a,c+'x')}`,[x0,1],[rat(b,c+1),[-x0,1],[b,1]],`底数相同，指数相等：x ${b>=0?'+ '+b:'− '+(-b)} = ${c}x ⇒ ${c-1==1?'':c-1}x = ${b} ⇒ x = ${x0}`)};
const g32=()=>{const a=pick([2,3,5]),k=rnd(1,4),M=(a-1)*a**k;return mkR(`解方程 ${P(a,'x+1')} − ${P(a,'x')} = ${M}`,[k,1],[[k+1,1],[k-1,1],[a**k,1]],`${P(a,'x+1')} = ${a}·${P(a,'x')}，故 ${P(a,'x')}(${a} − 1) = ${M} ⇒ ${P(a,'x')} = ${a**k} = ${P(a,k)} ⇒ x = ${k}`)};
