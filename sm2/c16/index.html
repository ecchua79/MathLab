const tri=[[3,4],[4,3],[6,8],[8,6],[5,12],[12,5]],hyp=t=>Math.round(Math.hypot(...t)),o3=(ok,c)=>[...new Set(c.filter(x=>x!==ok))].slice(0,3).map(String);

if(m2==n2){const a=2*(x2-x1),b=2*(y2-y1),c=x2*x2+y2*y2-x1*x1-y1*y1,g=gcd(gcd(a,b),c)||1;return{h:`PA = PB ⇒ P 在 AB 的垂直平分线上<br>${2*(x2-x1)}x + ${2*(y2-y1)}y = ${c} 化简得：<br><b>${lt(a/g,b/g,c/g)}</b>`,g:{p:[[x1,y1,'A'],[x2,y2,'B']],s:[[x1,y1,x2,y2]],l:[[a,b,-c]]}}}

const calc2={t:'三点求圆计算器',f:[['x1','P 的 x',2],['y1','P 的 y',2],['x2','Q 的 x',6],['y2','Q 的 y',-6],['x3','R 的 x',-2],['y3','R 的 y',0]],run:v=>{const{x1,y1,x2,y2,x3,y3}=v,s=[-(x1*x1+y1*y1),-(x2*x2+y2*y2),-(x3*x3+y3*y3)],D=det([x1,y1,1,x2,y2,1,x3,y3,1]),r=ci(det([s[0],y1,1,s[1],y2,1,s[2],y3,1]),det([x1,s[0],1,x2,s[1],1,x3,s[2],1]),det([x1,y1,s[0],x2,y2,s[1],x3,y3,s[2]]),D);if(r.e)return r.e;const g=cg(r);g.p.push([x1,y1,'P'],[x2,y2,'Q'],[x3,y3,'R']);return{h:`设 x²+y²+Ax+By+C=0，把三点代入得三元一次方程组并解出 A、B、C：<br>${r.html}`,g}}};

{t:'例题 7',q:'圆过点 (1, 2)、(3, 2)，且半径为 √[5]，求圆的标准方程式。',s:'设圆心 (h, k)，(x−h)² + (y−k)² = 5<br>代入两点：(1−h)² + (2−k)² = 5 ⋯(1)，(3−h)² + (2−k)² = 5 ⋯(2)<br>(1)−(2)：(1−h)² − (3−h)² = 0 ⇒ 4h = 8 ⇒ h = 2<br>代入 (1)：(2−k)² = 4 ⇒ k = 0 或 k = 4<br>∴ <b>(x−2)² + y² = 5</b> 或 <b>(x−2)² + (y−4)² = 5</b>（两个圆）',g:{c:[[2,0,Math.sqrt(5)],[2,4,Math.sqrt(5),'h']],p:[[1,2,'P'],[3,2,'Q'],[2,0,'C₁','b'],[2,4,'C₂','b']]}},
{t:'例题 8',q:'圆过 A(1, 4)、B(4, 3)，且圆心在直线 x + y − 4 = 0 上，求圆的方程式。',s:'设圆心 C(h, k)。圆心在直线上：h + k − 4 = 0 ⋯(1)<br>CA = CB：(h−1)² + (k−4)² = (h−4)² + (k−3)² ⇒ 3h − k − 4 = 0 ⋯(2)<br>(1)+(2)：4h − 8 = 0 ⇒ h = 2，k = 2<br>r = CA = √[(2−1)²+(2−4)²] = √[5]<br>∴ <b>(x−2)² + (y−2)² = 5</b>',g:{c:[[2,2,Math.sqrt(5)]],l:[[1,1,-4,'h',1]],p:[[1,4,'A'],[4,3,'B'],[2,2,'C','b']],s:[[2,2,1,4,'m',1],[2,2,4,3,'m',1]]}},

ex:[{t:'例题 11',q:'判断点 A(3, 2)、B(3, 3)、C(2, 2) 在圆 (x−1)² + (y−2)² = 2² 上、圆外或圆内。',s:'圆心 D(1, 2)，r = 2<br>AD = √[(3−1)²+(2−2)²] = 2 = r ⇒ A 在圆上<br>BD = √[(3−1)²+(3−2)²] = √[5] &gt; r ⇒ B 在圆外<br>CD = √[(2−1)²+(2−2)²] = 1 &lt; r ⇒ C 在圆内',g:{c:[[1,2,2]],p:[[3,2,'A'],[3,3,'B'],[2,2,'C','h'],[1,2,'D','b']]}},
{t:'例题 12',q:'求点 P(1, 5) 到圆 (x+2)² + (y−1)² = 9 的最长及最短距离。',s:'圆心 C(−2, 1)，r = 3<br>PC = √[3² + 4²] = 5 &gt; r ⇒ P 在圆外<br>最短 PQ = PC − r = 5 − 3 = <b>2</b><br>最长 PQ′ = PC + r = 5 + 3 = <b>8</b>',g:{c:[[-2,1,3]],p:[[1,5,'P'],[-2,1,'C','b'],[-.2,3.4,'Q','h'],[-3.8,-1.4,"Q′",'h']],s:[[1,5,-3.8,-1.4,'h']]}}

{t:'例题 15',q:'证明圆 x² + y² − 2x − 15 = 0 与直线 3x − 4y + 17 = 0 相切。',s:'<b>证法一</b>：y = {3x+17/4} 代入圆方程：25x² + 70x + 49 = 0<br>Δ = 70² − 4(25)(49) = 0 ⇒ 只有一个交点 ⇒ 相切<br><b>证法二</b>：圆 (x−1)² + y² = 4²，圆心 (1, 0)，r = 4<br>d = {|3(1)−4(0)+17|/√[3²+(−4)²]} = {20/5} = 4 = r ⇒ 相切',g:gLine(1,0,4,{a:3,b:-4,c:17})},

{t:'例题 17',q:'圆 (x−3)² + (y−2)² = 5 与直线 x + 2y + k = 0，求 k 的取值范围使圆与直线相离。',s:'圆心 (3, 2)，r = √[5]。相离 ⇒ d &gt; r<br>d = {|3+4+k|/√[1²+2²]} = {|k+7|/√[5]} &gt; √[5] ⇒ |k + 7| &gt; 5<br>⇒ k + 7 &gt; 5 或 k + 7 &lt; −5<br>∴ <b>k &lt; −12 或 k &gt; −2</b>（与课本判别式法 (k+12)(k+2) &gt; 0 结果相同）<br>图中虚线为 k = −12、k = −2 的两条切线。',g:{c:[[3,2,Math.sqrt(5)]],l:[[1,2,-12,'h',1],[1,2,-2,'h',1],[1,2,3,'r']],p:[[3,2,'C','b']]}},
{t:'例题 18',q:'斜率为 3 的直线与圆 x² + y² + 8x − 6y + 15 = 0 相切，求此直线的方程式。',s:'设直线 3x − y + c = 0。圆：(x+4)² + (y−3)² = 10，圆心 (−4, 3)，r = √[10]<br>{|3(−4)−3+c|/√[3²+(−1)²]} = √[10] ⇒ |c − 15| = 10<br>c = 25 或 c = 5<br>∴ <b>3x − y + 25 = 0</b> 或 <b>3x − y + 5 = 0</b>（两条切线）',g:{c:[[-4,3,Math.sqrt(10)]],l:[[3,-1,25],[3,-1,5]],p:[[-4,3,'C','b']]}},
{t:'例题 19',q:'P(4, 8) 为圆 x² + y² − 4x − 4y + 4 = 0 外一点，求切线长 PQ。',s:'(x−2)² + (y−2)² = 2² ⇒ C(2, 2)，r = 2<br>△CPQ 为直角三角形（CQ ⊥ PQ）<br>PQ² = CP² − CQ² = (4−2)² + (8−2)² − 2² = 36<br>∴ 切线长 <b>PQ = 6</b>',g:{c:[[2,2,2]],p:[[4,8,'P'],[2,2,'C','b'],[4,2,'Q','h']],s:[[2,2,4,8,'m',1],[4,8,4,2,'r'],[2,2,4,2]],ra:[[4,2,2,2,4,8]]}}],

/* ---------- 界面 ---------- */
function calcCard(c){const d=document.createElement('div');d.className='card';d.innerHTML=`<h4>🧮 ${c.t}</h4><div class=in>${c.f.map(f=>Array.isArray(f[2])?`<label>${f[1]}<select name="${f[0]}">${f[2].map(o=>{const[a,b]=o.split('|');return`<option value="${a}">${b}</option>`}).join('')}</select></label>`:`<label>${f[1]}<input ${f[3]?'type=text':'type=number step=any'} name="${f[0]}" value="${f[2]}"></label>`).join('')}</div><button class=btn>计算并画图</button><div class=out></div>`;
const run=()=>{const v={};c.f.forEach(f=>{const e=$(`[name=${f[0]}]`,d);v[f[0]]=Array.isArray(f[2])||f[3]?e.value:Number(e.value)});let r;try{r=c.run(v)}catch(e){r='输入有误'}$('.out',d).innerHTML=typeof r=='string'?`<p class=b1>${r}</p>`:`<p>${T(r.h)}</p>`+G(r.g)};$('.btn',d).onclick=run;d.addEventListener('keydown',e=>{if(e.key=='Enter')run()});run();return d}
function quiz(el,mg,fg,gate,again,rev){el.innerHTML='<div class=ml></div><div class=fl></div><div class=rs></div>';const ml=$('.ml',el),fl=$('.fl',el),rs=$('.rs',el),N=mg.length;let ms=0,md=0,fs=0,fd=0;
const fin=()=>{const tot=ms+fs,all=N+fg.length,p=tot/all;rs.innerHTML=`<p><b>成绩：选择题 ${ms}/${N}，作答题 ${fs}/${fg.length}${rev?`；总分 ${tot}/${all}（${Math.round(p*100)} 分）`:''}</b></p>${rev?`<p>${p>=.85?'🏆 优秀！掌握得非常扎实。':p>=.65?'👍 良好，请再看看错题的解析。':p>=.45?'🙂 及格，建议回到各节复习例题与计算器。':'💪 需要加强，请从 16.1 逐节复习后再挑战。'}</p>`:''}<button class=btn>再来一组（重新出题）</button>`;$('.btn',rs).onclick=again};
const unlock=()=>{if(ms<gate){rs.innerHTML=`<p>选择题答对 ${ms}/${N}，需答对 ${gate} 题或以上才能解锁作答题。</p><button class=btn>重新出题</button>`;$('.btn',rs).onclick=again;return}
rs.innerHTML=`<p class=g1><b>${gate?`🎉 选择题 ${ms}/${N}，解锁作答题！`:`选择题 ${ms}/${N}，接下来是作答题`}</b></p>`;
fg.forEach((g,i)=>{const d=g(),c=document.createElement('div');c.className='q';c.innerHTML=`<p><b>作答 ${i+1}.</b> ${T(d.q)}</p><input type=text inputmode=decimal placeholder="输入答案"> <button class=btn>提交</button><div class=ex></div>`;const inp=$('input',c),bt=$('button',c);
bt.onclick=()=>{if(c.dataset.l||inp.value.trim()==='')return;c.dataset.l=1;const good=Math.abs(Number(inp.value.replace('−','-').trim())-d.ans)<1e-6;inp.disabled=bt.disabled=true;if(good)fs++;$('.ex',c).innerHTML=`<b class=${good?'g1':'b1'}>${good?'✔ 正确':'✘ 错误'}</b> 正确答案：${d.ans}<br>${T(d.ex)}${d.g?G(d.g):''}`;if(++fd==fg.length)fin()};fl.append(c)})};
mg.forEach((g,i)=>{const d=g(),o=sh([...new Set([d.ok,...d.bad])]),c=document.createElement('div');c.className='q';c.innerHTML=`<p><b>${i+1}.</b> ${T(d.q)}</p><div class=op>${o.map(x=>`<button>${T(x)}</button>`).join('')}</div><div class=ex></div>`;const bs=[...c.querySelectorAll('.op button')];
bs.forEach((b,j)=>b.onclick=()=>{if(c.dataset.l)return;c.dataset.l=1;const good=o[j]===d.ok;bs.forEach((x,t)=>{x.disabled=true;if(o[t]===d.ok)x.classList.add('ok')});if(!good)b.classList.add('no');else ms++;$('.ex',c).innerHTML=`<b class=${good?'g1':'b1'}>${good?'✔ 正确':'✘ 错误'}</b> 正确答案：${T(d.ok)}<br>${T(d.ex)}${d.g?G(d.g):''}`;if(++md==N)unlock()});ml.append(c)})}
function startQuiz(el,S){quiz(el,S.rev?sh(S.mp).slice(0,10):sh(Array.from({length:5},(_,i)=>S.mg[i%S.mg.length])),S.rev?sh(S.fp).slice(0,5):S.fg,S.rev?0:3,()=>startQuiz(el,S),S.rev)}
const tabs=$('#tabs'),main=$('#main'),ps=[],bs=[];
SEC.forEach((S,i)=>{const b=document.createElement('button');b.textContent=`${S.k} ${S.n}`;b.onclick=()=>show(i);tabs.append(b);bs.push(b);const p=document.createElement('section');p.hidden=true;
p.innerHTML=S.rev?`<h2>总复习：10 题选择 + 5 题作答</h2><div class=card>题目抽取自 16.1–16.4 的题型，并加入总复习题中较难的题型（最小半径、斜率切线、弦长）。10 题选择题完成后出现 5 题作答题，最后给出分数评估。</div><div class="card qz"></div>`:`<h2>${S.k} ${S.n}</h2><div class=card>${T(S.th)}</div><h3>📘 课本例题（点击展开 / 折叠）</h3>${S.ex.map((e,i)=>`<details class=card${i?'':' open'}><summary><b>${e.t}</b> · ${T(e.q)}</summary><p>${T(e.s)}</p>${G(e.g)}</details>`).join('')}<h3>🧮 专属计算器</h3><div class=cs></div><h3>📝 随堂测验</h3><div class="card qz"></div>`;
main.append(p);ps.push(p);S.calcs&&S.calcs.forEach(c=>$('.cs',p).append(calcCard(c)));startQuiz($('.qz',p),S)});
function show(i){ps.forEach((p,j)=>{p.hidden=i!=j;bs[j].classList.toggle('on',i==j)});bs[i].scrollIntoView({inline:'center',block:'nearest',behavior:'smooth'});scrollTo(0,0)}show(0);
