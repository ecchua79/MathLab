// ---------- 解答 ----------
const s2=m=>{const[[a,b],[c,d]]=m;return`(${P(a)})(${P(d)}) − (${P(b)})(${P(c)})<br>= ${P(a*d)} − ${P(b*c)}<br>= <b>${f(d2(m))}</b>`};
const s3=m=>{const[p,n]=tm(m);return`= ${p.map(P).join(' + ')} − ${n.map(P).join(' − ')}<br>= <b>${f(d3(m))}</b>`};
function ex(M,t,i){let tx=[],nu=[],v=0;for(let j=0;j<3;j++){const[r,c]=t=='r'?[i,j]:[j,i],mi=d2(mn(M,r,c)),sg=(r+c)%2?-1:1,co=sg*mi;v+=M[r][c]*co;

function prop(M,op,r,s,k){const T=m=>m[0].map((_,j)=>m.map(x=>x[j]));let A=M.map(x=>x.slice()),rule,pred,o={},d1=d3(M);const c=op=='SC'?'列':'行';
if(op=='P5'){const B=M.map(x=>x.slice()),C=M.map(x=>x.slice());B[r]=M[r].map(v=>v-k);C[r]=M[r].map(()=>k);const a=d3(B),b=d3(C);return`<div class=row>${mx(M)}<b>=</b>${mx(B,{hr:r})}<b>+</b>${mx(C,{hr:r})}</div>性质5：第${r+1}行每个数拆成「原数 − ${f(k)}」与 ${f(k)}<br>${f(d1)} = ${f(a)} + ${f(b)} ${Math.abs(d1-a-b)<1e-9?'✔':''}`}

else if(op=='SR'||op=='SC'){if(op=='SC')A=T(A);[A[r],A[s]]=[A[s],A[r]];if(op=='SC')A=T(A);rule=`性质2：对调第${r+1}、${s+1}${c}，值变号`;pred=-d1}
else if(op=='K'){A[r]=A[r].map(v=>v*k);o={hr:r};rule=`性质4：第${r+1}行乘以 ${f(k)}，值变为 ${f(k)} 倍`;pred=k*d1}

// ---------- 题目引擎 ----------
const sym3=[['a','b','c'],['d','e','f'],['g','h','i']];
const G={
g2(){const m=rm(2,-9,9),[[a,b],[c,d]]=m,v=d2(m);return{q:'求二阶行列式的值：',fig:mx(m),a:v,w:[a*d+b*c,b*c-a*d,a*d,b*c,v+1,v-1],e:s2(m),ef:mx(m,{x:1})}},
geq(){const p=ri(-5,5),q=ri(-4,4)||2,r=ri(-4,4)||-3,s=pick([-3,-2,2,3,4]),x0=ri(-6,6),e=s*(x0+p)-q*r,xp='x'+(p?(p>0?'+'+p:'−'+-p):'');
return{q:'解方程，求 x：',fig:mx([[xp,q],[r,s]],{cw:52})+' = '+f(e),a:x0,w:[-x0,x0+p,x0-p,x0+1,x0-1],e:`展开：${P(s)}(${xp}) − ${P(q)}×${P(r)} = ${f(e)}<br>${P(s)}(${xp}) = ${f(e+q*r)}<br>${xp} = ${fr(f(e+q*r),f(s))} = ${f(x0+p)}<br>x = <b>${f(x0)}</b>`}},

gcof(){const m=rm(3,-4,4),i=ri(0,2),j=ri(0,2),mi=d2(mn(m,i,j)),sg=(i+j)%2?-1:1,a=sg*mi;
return{q:`求元素 ${f(m[i][j])}（第${i+1}行第${j+1}列）的代数余子式的值：`,fig:mx(m,{hr:i,hc:j,ce:[i,j]}),a,w:[-a,mi,-mi,m[i][j]*a,a+1],e:`划去第${i+1}行、第${j+1}列，余子式 = ${mx(mn(m,i,j),{sc:.7})} = ${f(mi)}<br>符号 (−1)<sup>${i+1}+${j+1}</sup> = ${sg>0?'+1':'−1'}<br>代数余子式 = <b>${f(a)}</b>`}},
gexp(){const m=rm(3,-4,4),t=pick(['r','c']),i=ri(0,2),z=ri(0,2);t=='r'?m[i][z]=0:m[z][i]=0;let ns=0;for(let j=0;j<3;j++){const[r,c]=t=='r'?[i,j]:[j,i];ns+=m[r][c]*d2(mn(m,r,c))}
const v=d3(m);return{q:`按第${i+1}${t=='r'?'行':'列'}展开，求值：`,fig:mx(m,t=='r'?{hr:i}:{hc:i}),a:v,w:[ns,-v,ns+1,v+2],e:ex(m,t,i)}},
gp(h){const D=pick([-8,-6,-5,-4,-3,-2,2,3,4,5,6,7,8]),k=pick([2,3,4,5,-2,-3]),K=f(k),r=pick([1,2,3]),s=pick([1,2,3].filter(x=>x!=r)),d=pick(['行','列']);let c,a,e;
if(h)[c,a,e]=[`先对调第${r}${d}与第${s}${d}，再把第${r}${d}所有元素乘以 ${K}，最后行列互换`,-k*D,`对调变号 → −(${f(D)})；乘以${K} → ${K}×(−(${f(D)}))；转置值不变`];
else[c,a,e]=pick([['将行与列依次对调',D,'性质1：值不变'],[`将第${r}${d}与第${s}${d}对调`,-D,`性质2：值变号 → −(${f(D)})`],[`把第${r}${d}的所有元素都乘以 ${K}`,k*D,`性质4：${K}×(${f(D)})`],[`把第${r}${d}乘以 ${K} 后加到第${s}${d}对应元素上`,D,'性质6：值不变'],[`若第${r}${d}与第${s}${d}的对应元素相同`,0,'性质3：有两'+d+'相同，值为0']]);

const k=r*(A-B);return{q:'求值：',fig:mx([[sr(a),sr(b)],[sr(c),sr(d)]],{cw:50}),a:k,w:[A-B,r*(A+B),r*(B-A),A-B+r,k+r],e:`= (${rs(a,r)})(${rs(d,r)}) − (${rs(b,r)})(${rs(c,r)})<br>= ${P(A*r)} − ${P(B*r)} = <b>${f(k)}</b>`}};
G.gph=()=>G.gp(1);
function opts(a,w){let s=new Set([a]);for(const x of sh(w))if(s.size<4&&Number.isFinite(x)&&!s.has(x))s.add(x);while(s.size<4)s.add(a+ri(-9,9));return sh([...s])}
const num=t=>parseFloat(String(t).replace(/[−–—]/g,'-'));
function quiz(el,gs,fg,nm,nf,gate,rev){let ok,mc,fd;
const lst=(g,n)=>{let L=[];while(L.length<n)L.push(...sh(g));return L.slice(0,n)};

function calc(el,n,def,extra,fn){el.innerHTML=`<div class=g style="grid-template-columns:repeat(${n},auto)">${def.flat().map(v=>`<input value="${v}">`).join('')}</div> ${extra}<div class=out style="margin-top:.4rem"></div>`;

const sel=(c,v)=>`<select class=${c}>${[1,2,3].map(x=>`<option ${x==v?'selected':''}>${x}`).join('')}</select>`;
const dt=(t,b)=>`<details class=card><summary><b>${t}</b></summary>${b}</details>`;const exc=(t,m)=>dt(t,mx(m,{x:1})+'<br>'+s2(m));
const E3=[[1,3,1],[2,1,4],[3,2,2]],E4=[[2,-1,1],[1,0,2],[-1,1,-3]];
const sf=n=>{let c=1;for(let i=2;i*i<=n;i++)while(n%(i*i)==0){n/=i*i;c*=i}return[c,n]};
const pe=t=>{t=String(t).replace(/\s/g,'');const m=t.match(/^([-−]?)(\d*)√(\d+)$/);if(m){const[k,r]=sf(+m[3]),c0=(m[1]?-1:1)*(m[2]===''?1:+m[2]);return{c:c0*k,r,c0,r0:+m[3],s:t}}const v=num(t);return isNaN(v)?null:{c:v,r:1,c0:v,r0:1,s:t}};
const mul=(A,B)=>{const[k,r]=sf(A.r*B.r);return{c:A.c*B.c*k,r}},tx=T=>rs(T.c,T.r);
function sd(E){const[a,b,c,d]=E,p=mul(a,d),q=mul(b,c),e=x=>x.r0==1?'('+f(x.c0)+')':`(${rs(x.c0,x.r0)})`;let fin;
if(p.r==q.r||!q.c||!p.c){fin=tx(p.r==q.r?{c:p.c-q.c,r:p.r}:!q.c?p:{c:-q.c,r:q.r})}else fin=tx(p)+(q.c>0?' − ':' + ')+tx({c:Math.abs(q.c),r:q.r});
return`${e(a)}${e(d)} − ${e(b)}${e(c)}<br>= ${tx(p)} − ${q.c<0?'('+tx(q)+')':tx(q)}<br>= <b>${fin}</b>`}
function surdCal(el){el.innerHTML=`<div class=row><div class=g style="grid-template-columns:repeat(2,auto)">${['√2','2√6','2','√3'].map(v=>`<input value="${v}" style="width:4.2rem">`).join('')}</div><button class=btn>√</button><small>点输入框，再按 √ 插入根号，如 2√6</small></div><div class=out style="margin-top:.4rem"></div>`;
let last=$('input',el);el.querySelectorAll('input').forEach(i=>i.onfocus=()=>last=i);
const upd=()=>{const E=[...el.querySelectorAll('input')].map(i=>pe(i.value));$('.out',el).innerHTML=E.some(x=>!x)?'请输入如 2√6 或整数':`<div class=row>${mx([[E[0].s,E[1].s],[E[2].s,E[3].s]],{cw:50,x:1})}</div>${sd(E)}`};
$('.btn',el).onclick=()=>{const p=last.selectionStart??last.value.length;last.value=last.value.slice(0,p)+'√'+last.value.slice(p);last.focus();upd()};el.oninput=upd;upd()}
const ex6=()=>{const A=[[-7,7,-5],[8,-1,2],[-2,1,'k']],B=[[-7,-2,8],[7,1,-1],[-5,'k',2]],C=[[-7,7,-5],[-2,1,'k'],[8,-1,2]];return`已知 ${mx(A)} = 5，求 ${mx(B)}。<br>${mx(B)} = ${mx(C)}（性质1：行列互换）<br>= −${mx(A)}（性质2：对调第2、3行）= <b>−5</b>`};
const ex7=()=>{const a=[[2,0,-2],[2,0,-1],[3,15,6]],b=[[1,0,-1],[2,0,-1],[3,15,6]],c=[[1,0,-1],[2,0,-1],[1,5,2]];return`证明 ${mx(a)} = 6${mx(c)}<br>${mx(a)} = 2${mx(b)}（性质4：第1行提出2）<br>= 2×3${mx(c)}（性质4：第3行提出3）= 6${mx(c)}<br>数值核对：${f(d3(a))} = 6×${f(d3(c))} ✔`};
const ex8=()=>{const A=[[5,5,-1],[2,3,-1],[1,0,3]],B=[[1,-1,1],[2,3,-1],[1,0,3]],C=[[4,6,-2],[2,3,-1],[1,0,3]],D=[[2,3,-1],[2,3,-1],[1,0,3]];return`证明 ${mx(A)} = ${mx(B)}<br>第1行：5=1+4，5=−1+6，−1=1+(−2)，由性质5：<br>${mx(A)} = ${mx(B)} + ${mx(C)}<br>= ${mx(B)} + 2${mx(D)}（性质4）<br>= ${mx(B)} + 0（性质3：两行相同）= ${mx(B)}<br>数值核对：${f(d3(A))} = ${f(d3(B))} + ${f(d3(C))} ✔`};
const rvx=()=>{const q=[['a','b','c'],[1,-1,2],['x','y','z']];return[exc('1(a)',[[3,8],[11,-4]]),exc('1(b)',[[2,-9],[-3,11]]),
dt('1(c)',mx([[1,'cos x'],['cos x',1]],{cw:56})+'<br>= (1)(1) − cos x·cos x = 1 − cos²x = <b>sin²x</b>'),
dt('1(d)',mx([['log₂4','2log₃9'],[-2,1]],{cw:62})+'<br>log₂4 = 2，2log₃9 = 4<br>= (2)(1) − (4)(−2) = 2 + 8 = <b>10</b>'),
dt('1(e)',mx([[3,6,2],[1,2,1],[5,10,8]])+`<br>第2列 = 2×第1列（对应成比例）→ 值为 <b>0</b>　核对：${f(d3([[3,6,2],[1,2,1],[5,10,8]]))}`),
dt('1(f)',sar([[4,2,5],[1,-3,2],[-2,5,-3]])+'<br>'+s3([[4,2,5],[1,-3,2],[-2,5,-3]])),
dt('2(a)',mx([['2a','−b'],['b','b']],{cw:40})+'<br>= (2a)(b) − (−b)(b) = 2ab + b² = <b>b(2a + b)</b>'),
dt('2(b)',mx([['√2','2√6'],[2,'√3']],{cw:50,x:1})+'<br>'+sd(['√2','2√6','2','√3'].map(pe))),
dt('2(c)',mx([['√10','√5'],[-1,'√2']],{cw:50,x:1})+'<br>'+sd(['√10','√5','-1','√2'].map(pe))),
dt('3 已知 '+'值为3',`(a) ${mx([[1,-1,2],['a','b','c'],['x','y','z']])} = −${mx(q)} = <b>−3</b>（性质2：对调1、2行）<br>(b) ${mx([['a','b','c'],[-5,5,-10],['x','y','z']])} = −5${mx(q)} = <b>−15</b>（性质4：第2行提出−5）<br>(c) 第2行 = (a,b,c) + (−2)×(1,−1,2)，由性质6变为 (a,b,c)；第1行提出2（性质4）：<br>= 2${mx([['x','y','z'],['a','b','c'],[1,-1,2]])}，行序 (x y z, a b c, 1 −1 2) 由原式经两次对调得到，值不变 → 2×3 = <b>6</b>`),
dt('4',mx([[1,0,1],['a','b','c'],[0,1,0]])+`<br>按第3行展开：= 1×(−1)<sup>3+2</sup>×${mx([[1,1],['a','c']],{sc:.8})} = −(c − a) = <b>a − c</b>`),
dt('5',mx([['ad','d','a'],['bd',0,'b'],['cd','d','c']],{cw:40})+'<br>第1列提出 d（性质4）= d·'+mx([['a','d','a'],['b',0,'b'],['c','d','c']])+'，第1、3列相同 → <b>0</b>（性质3）'),
dt('6',`已知 ${mx([[2,3,1],[1,1,-2],['a',2,1]])} = 9，求 ${mx([[3,2,1],[2,'a',1],[1,1,-2]])}<br>把原式各行的第1、2列对调（性质2，变号）；再对调第2、3行（性质2，变号）→ 得所求式。<br>两次变号，值不变：<b>9</b>`)]};

{id:'14.2',t:'14.2 行列式的性质',gs:['gp','gp','gp'],
intro:`<p>利用性质可以简化计算（以三阶为例）：</p><div style="line-height:1.9"><div><b>性质1</b>　行与列依次对调，值不变。</div><div><b>性质2</b>　对调任意两行（或列），值变号。</div><div><b>性质3</b>　若任意两行（或列）的对应元素相同，则值为 0。</div><div><b>性质4</b>　某一行（或列）的所有元素都乘以常数 k，所得行列式等于原行列式的 k 倍。</div><div><b>性质5</b>　某一行（或列）的元素都是两数之和，则可拆成两个行列式之和。</div><div><b>性质6</b>　某一行（或列）乘以常数 k 加到另一行（或列）的对应元素上，值不变。</div></div><p>想一想：两行（列）对应元素成比例，则值为 0。</p>`,

cal:el=>calc(el,3,[[1,0,2],[3,1,0],[2,2,2]],`<div class=row><select class=op><option value=T>转置(性质1)<option value=SR>对调两行(性质2)<option value=SC selected>对调两列(性质2)<option value=K>第r行×k(性质4)<option value=A>第r行＋k×第s行(性质6)<option value=P5>拆开第r行(性质5)</select> r${sel('r',2)} s${sel('s',3)} k<input class=k value=2 style="width:3rem"></div>`,(M,e)=>{const q=c=>$(c,e).value;return prop(M,q('.op'),q('.r')-1,q('.s')-1,num(q('.k'))||0)})},
