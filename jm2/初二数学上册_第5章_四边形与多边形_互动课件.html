<script>
// ---------- 题目数据（全部取自课本；是非题 / 数值题） ----------
const T=(q,a,e)=>({k:'t',q,a,e}), N=(q,a,e,u='°')=>({k:'n',q,a,e,u});
const BOX=(t,h)=>`<div class="thm"><b>${t}</b>${h}</div>`;
const fig=(P,poly,o={})=>{const V=[...poly].map(k=>P[k]),c=[V.reduce((a,p)=>a+p[0],0)/V.length,V.reduce((a,p)=>a+p[1],0)/V.length],ln=(a,b,w,d)=>`<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="${d?'#d99a00':'currentColor'}" stroke-width="${w}" ${d?'stroke-dasharray="4 3"':''}/>`;
 let h=`<polygon points="${V.map(p=>p.join(',')).join(' ')}" fill="rgba(15,118,110,.12)" stroke="currentColor" stroke-width="1.6"/>`;
 (o.l||[]).forEach(k=>h+=ln(P[k[0]],P[k[1]],1.5,1));(o.x||[]).forEach(k=>h+=ln(P[k[0]],P[k[1]],1.6,0));
 (o.r||[]).forEach(([v,a,b])=>{const p=P[v],u=[P[a][0]-p[0],P[a][1]-p[1]],w=[P[b][0]-p[0],P[b][1]-p[1]],du=Math.hypot(...u),dw=Math.hypot(...w),A=[p[0]+u[0]/du*9,p[1]+u[1]/du*9],B=[A[0]+w[0]/dw*9,A[1]+w[1]/dw*9],C=[p[0]+w[0]/dw*9,p[1]+w[1]/dw*9];h+=`<polyline points="${A} ${B} ${C}" fill="none" stroke="currentColor" stroke-width="1.2"/>`});
 (o.t||[]).forEach(([k,n])=>{const a=P[k[0]],b=P[k[1]],dx=b[0]-a[0],dy=b[1]-a[1],d=Math.hypot(dx,dy),ux=dx/d,uy=dy/d;for(let i=0;i<n;i++){const o2=(i-(n-1)/2)*4,mx=(a[0]+b[0])/2+ux*o2,my=(a[1]+b[1])/2+uy*o2;h+=ln([mx-uy*5,my+ux*5],[mx+uy*5,my-ux*5],1.4,0)}});
 Object.entries(P).filter(([k])=>/^[A-Z]$/.test(k)).forEach(([k,p])=>{let dx=p[0]-c[0],dy=p[1]-c[1],d=Math.hypot(dx,dy);if(d<8){dx=1;dy=-1;d=1.41}h+=`<circle cx="${p[0]}" cy="${p[1]}" r="1.8" fill="currentColor"/><text x="${p[0]+dx/d*11}" y="${p[1]+dy/d*11}" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="700" fill="currentColor">${k}</text>`});
 (o.v||[]).forEach(([x,y,t])=>h+=`<text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="central" font-size="10.5" fill="#0f766e">${t}</text>`);
 return `<svg class="fg" viewBox="0 0 220 130">${h}</svg>`};
const F={
e51:fig({A:[50,110],B:[190,110],C:[190,35],D:[68,79],'1':[8,110]},'ABCD',{x:[['1','A']],r:[['B','A','C']],v:[[26,98,'120°'],[76,102,'x'],[172,52,'70°'],[88,78,'y']]}),
e52a:fig({A:[70,100],B:[35,39],C:[155,39],D:[190,100]},'ABCD',{v:[[88,92,'120°']]}),
e52b:fig({P:[40,100],Q:[160,100],R:[190,30],S:[70,30]},'PQRS',{v:[[100,115,'2x+2'],[130,16,'3x−4']]}),
e52c:fig({A:[60,30],D:[190,30],C:[160,105],B:[30,105],O:[110,67.5]},'ABCD',{l:['AC','BD']}),
e52e:fig({P:[30,105],Q:[150,105],R:[190,35],S:[70,35]},'PQRS',{l:['SQ'],v:[[78,54,'68°'],[112,45,'53°'],[148,92,'68°'],[34,64,'7cm'],[186,72,'7cm']]}),
e52f:fig({A:[40,105],B:[150,105],C:[190,35],D:[80,35]},'ABCD',{v:[[64,93,'3x−9°'],[130,93,'120°'],[166,50,'2x+14°'],[100,48,'5x+5°']]}),
e53a:fig({A:[30,25],B:[30,105],C:[190,105],D:[190,25]},'ABCD',{l:['AC','BD'],r:[['D','A','C']]}),
e53b:fig({P:[30,105],Q:[190,105],R:[190,25],S:[30,25],O:[110,65]},'PQRS',{l:['PR','SQ'],v:[[110,47,'120°'],[14,66,'5cm']]}),
e53c:fig({B:[30,105],A:[190,105],C:[190,25],D:[30,25],M:[110,65]},'BAC',{l:['DC','DB','AD'],r:[['A','B','C']],t:[['BM',2],['MC',2],['AM',1],['MD',1]]}),
e54:fig({A:[62,65],D:[110,18],C:[158,65],B:[110,112],O:[110,65]},'ADCB',{l:['AC','BD'],r:[['O','A','D']],v:[[84,62,'52°'],[72,34,'6cm']]}),
e55:fig({A:[80,115],B:[180,115],C:[180,15],D:[80,15],E:[130,65],F:[30,65]},'ABCD',{l:['AC','BD'],x:['FA','FD'],v:[[48,66,'x'],[92,100,'z'],[108,100,'y']]}),
e56:fig({P:[30,65],Q:[100,115],R:[142,65],S:[100,15]},'PQRS',{l:['PR','SQ'],v:[[52,65,'70°'],[122,65,'100°']]}),
e57:fig({P:[30,105],Q:[190,105],R:[164,25],S:[56,25],T:[100,105]},'PQRS',{x:['ST'],t:[['PS',1],['QR',1]],v:[[54,96,'72°'],[64,46,'40°']]})};
const EX=(t,q,s,g='')=>`<details><summary>${t}</summary><div class="s">${g}<p>${q}</p><p>${s}</p></div></details>`;

const S=[
{id:'5.1',t:'四边形',
 n:`<p>由四条线段所围成的平面图形叫做<b>四边形</b>。线段称为边，边与边的交点称为顶点。</p>
 <p>命名必须按顶点顺序：四边形ABCD、BCDA、ADCB 都可以，但ACBD、BDCA 不可以。</p>
 <p>两条相邻的边所组成的角称为<b>内角</b>；不相邻的内角互为<b>对角</b>（∠A与∠C、∠B与∠D）；不相邻的边互为<b>对边</b>（AB与CD、BC与DA）。连接两个不相邻顶点的线段称为<b>对角线</b>（AC、BD）。</p>
 ${BOX('性质','四边形四个内角的和等于360°。<br>（对角线AC把四边形分成△ABC与△ADC，180°+180°=360°）')}
 <p>💭 思考题：一个四边形四个外角的和是多少？（5.9 会证明）</p>`,
 ex:[EX('例题1','求x及y。（图：x的邻补角为120°；其余三个内角为70°、90°及y）','x=180°−120°=60°；y=360°−70°−90°−x=200°−60°=140°。',F.e51)],
 q:[N('四边形的三个内角分别为110°、90°、80°，求第四个内角。（数据取自练习5.1第1题）',80,'360°−110°−90°−80°=80°')]},

{id:'5.2',t:'平行四边形',
 n:`<p>两组对边分别平行的四边形称为<b>平行四边形</b>。</p>
 <h3>性质</h3>
 ${BOX('性质①','平行四边形的对角相等。（同旁内角互补，∠B+∠A=180°，∠C+∠B=180°，∴∠C=∠A）')}
 ${BOX('性质②','平行四边形的对边相等。（作对角线AC，△ABC≅△CDA，ASA）')}
 ${BOX('性质③','平行四边形的对角线互相平分。（△ABE≅△CDE，ASA）')}
 <h3>判定</h3>
 ${BOX('判定','①两组对角分别相等的四边形是平行四边形。<br>②两组对边分别相等的四边形是平行四边形。<br>③两条对角线互相平分的四边形是平行四边形。<br>④一组对边平行且相等的四边形是平行四边形。')}
 <p>💭 思考题：证明这些判定定理。　若一组对边平行、另一组对边相等，一定是平行四边形吗？<br><i>（不一定，等腰梯形就是反例。）</i></p>`,
 ex:[EX('例题1','ABCD是平行四边形，∠A=120°，求∠B、∠C及∠D。','∠B=180°−120°=60°（AD∥BC）；∠C=∠A=120°；∠D=∠B=60°。',F.e52a),
 EX('例题2','PQRS是平行四边形，PQ=2x+2，RS=3x−4，求PQ。','PQ=RS：2x+2=3x−4，x=6，PQ=2(6)+2=14。',F.e52b),
 EX('例题3','ABCD是平行四边形，AC=16cm，BD=12cm，求OA及OB。','OA=½AC=8cm；OB=½BD=6cm（对角线互相平分）。',F.e52c),
 EX('例题4','判断是否为平行四边形：(a)AB=DC=11cm，AD=BC=10cm；(b)∠E=70°，∠F=109°；(c)OK=OM=4cm，OL=ON=7cm。','(a)是（两组对边分别相等）；(b)∠E+∠F=179°，不互补，EH与FG不平行，不是；(c)是（两条对角线互相平分）。'),
 EX('例题5','求∠P。（∠PSQ=∠SQR=68°，PS=QR=7cm，∠RSQ=53°）','∠PSQ=∠SQR，∴PS∥QR；又PS=QR，∴PQRS是平行四边形；∠P=∠R=180°−53°−68°=59°。',F.e52e),
 EX('例题6','(a)求x；(b)证明ABCD是平行四边形。（∠A=3x−9°，∠D=5x+5°，∠C=2x+14°，∠B=120°）','(a)(3x−9)+(5x+5)+(2x+14)+120=360，10x=230，x=23。(b)∠A=∠C=60°，∠B=∠D=120°，两组对角分别相等，∴ABCD是平行四边形。',F.e52f)],
 q:[T('平行四边形的对边平行。','T'),T('平行四边形的四个边都相等。','F','只有对边相等。'),T('平行四边形的对角相等。','T'),
 T('平行四边形的内角和等于180°。','F','内角和为360°。'),T('平行四边形的对角线互相平分。','T'),T('平行四边形是点对称图形。','T'),T('平行四边形是线对称图形。','F','一般的平行四边形不是线对称图形。'),
 N('PQRS是平行四边形，对角线相交于M，PM=4cm，QS=6cm，求QM。（练习5.2a第3题）',3,'QM=½QS=3cm','cm'),
 N('同上，求PR。',8,'PR=2×PM=8cm','cm')]},

{id:'5.3',t:'长方形',
 n:`<p>四个角都是直角的四边形叫做<b>长方形</b>。长方形是特殊的平行四边形，具有平行四边形所有的性质：对边平行、对边相等、对角线互相平分。</p>
 ${BOX('此外','长方形的两条对角线相等。<br>长方形的两条对角线互相平分成四条相等的线段。（OA=OB=OC=OD）')}
 ${BOX('判定','①一个角是直角的平行四边形是长方形。<br>②两条对角线相等的平行四边形是长方形。')}
 <p>📎 补充资料：四个角都相等的四边形，每个角都是直角，所以长方形也可以定义成四个角都相等的四边形。　💭 思考题：证明这些判定定理。</p>
 ${BOX('例题3的结论','直角三角形斜边上的中线等于斜边的一半。')}`,
 ex:[EX('例题1','ABCD是平行四边形，AC=(3x+2)cm，BD=(5x−12)cm，∠ADC=90°，求x。','一个角是直角的平行四边形是长方形，∴AC=BD：3x+2=5x−12，x=7。',F.e53a),
 EX('例题2','PQRS是长方形，对角线相交于O，PS=5cm，∠ROS=120°。求(a)∠OSP；(b)PR。','(a)OP=OS，∠OSP=∠OPS，且∠OSP+∠OPS=120°（外角），∴∠OSP=60°。(b)△OSP是等边三角形，OP=OS=PS=5cm，PR=2×OP=10cm。',F.e53b),
 EX('例题3','△ABC中∠A=90°，AM是BC边上的中线。证明AM=½BC。','延长AM至D使AM=DM，连DC、DB。ABDC的对角线互相平分，是平行四边形；又∠A=90°，是长方形。∴AD=BC，AM=½AD=½BC。',F.e53c)],
 q:[T('长方形的每个角都是直角。','T'),T('长方形的所有边都相等。','F'),T('长方形的两条对角线相等。','T'),T('长方形的两条对角线互相垂直。','F'),
 T('长方形的对角线平分其端点的角。','F'),T('长方形是线对称图形。','T'),T('长方形是点对称图形。','T'),
 N('ABCD是长方形，对角线AC与BD相交于O，OD=4cm，求AC。（随堂练习4第2题）',8,'OD=OB=4，BD=8=AC','cm'),
 N('△PQR中∠Q=90°，PR=15cm，M是PR的中点，求QM。（练习5.3第3题）',7.5,'直角三角形斜边上的中线等于斜边的一半','cm')]},

{id:'5.4',t:'菱形',
 n:`<p>四个边都相等的四边形称为<b>菱形</b>。菱形是特殊的平行四边形，具有平行四边形所有的性质：对边平行、对角相等、对角线互相平分。</p>
 ${BOX('此外','菱形的两条对角线互相垂直。<br>菱形的每条对角线平分其端点的角。')}
 <p>（AO=CO，BO是等腰△ABC底边AC上的中线，所以BO⊥AC且BO平分∠ABC。）</p>
 ${BOX('判定','①一组邻边相等的平行四边形是菱形。<br>②两条对角线互相垂直的平行四边形是菱形。<br>③一条对角线平分它的其中一个端点的角的平行四边形是菱形。')}
 <p>💭 思考题：证明这些判定定理。</p>`,

{id:'5.9',t:'多边形',
 n:`<p>由三条或三条以上的线段围成的平面图形叫<b>多边形</b>；被n条边围成的叫<b>n边形</b>。</p>
 <p>顶点、内角、<b>外角</b>（一边与相邻边的反向延长线所组成的角）、<b>对角线</b>（连接不相邻两顶点的线段）。</p>
 <p><b>凸多边形</b>：每个内角都小于180°（每条边的无限延长线都不穿过多边形）。<b>凹多边形</b>：有一个或多个内角大于180°。</p>
 <p><b>正多边形</b>：每个角相等且每个边相等。📎 两个条件缺一不可：长方形四角相等但四边不一定相等；菱形四边相等但四角不一定相等。</p>

const nr=document.getElementById('nr');
function drawPoly(){const n=+nr.value;document.getElementById('nv').textContent=n;
 const P=[...Array(n)].map((_,k)=>{const a=-Math.PI/2+2*Math.PI*k/n;return[110+85*Math.cos(a),110+85*Math.sin(a)]});
 let h='<polygon points="'+P.map(p=>p.join(',')).join(' ')+'" fill="none" stroke="currentColor" stroke-width="2"/>';
 for(let k=2;k<n-1;k++)h+=`<line x1="${P[0][0]}" y1="${P[0][1]}" x2="${P[k][0]}" y2="${P[k][1]}" stroke="#d99a00" stroke-dasharray="4 3"/>`;
 document.getElementById('pg').innerHTML=h+`<circle cx="${P[0][0]}" cy="${P[0][1]}" r="4" fill="#0f766e"/>`;
 const s=(n-2)*180;document.getElementById('pi').innerHTML=`由一顶点作对角线：<b>${n-3}</b> 条<br>分成三角形：<b>${n-2}</b> 个<br>内角和：<b>${s}°</b><br>外角和：<b>360°</b><br>正${n}边形：每个内角 <b>${+(s/n).toFixed(2)}°</b>，每个外角 <b>${+(360/n).toFixed(2)}°</b><br>对角线总数：<b>${n*(n-3)/2}</b> 条`}
nr.oninput=drawPoly;drawPoly();
