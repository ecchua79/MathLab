<script>

const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1)),P=a=>a[R(0,a.length-1)],sh=a=>{a=[...a];for(let i=a.length-1;i>0;i--){let j=R(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
const TR=[[3,4,5],[5,12,13],[8,15,17],[7,24,25],[20,21,29],[9,40,41]];
const trip=()=>{let t=P(TR),k=t[2]<20?R(1,3):1;return t.map(x=>x*k)};
function sq(N){if(N<=0)return null;let k=1;for(let i=2;i*i<=N;i++)if(N%(i*i)==0)k=i;let m=N/(k*k);return m==1?""+k:(k>1?k:"")+"√"+m}
const sv=Math.sqrt,rd=x=>Math.round(sv(x));
function mk(ans,ws,fb){const s=[""+ans];for(const w of sh(ws)){if(w==null||(typeof w=="number"&&!isFinite(w)))continue;const t=""+w;if(!s.includes(t))s.push(t)}
 for(let i=1;s.length<4&&fb!=null;i++)for(const v of[fb+i,fb-i]){const t=""+v;if(s.length<4&&!s.includes(t))s.push(t)}return sh(s.slice(0,4))}
function parse(s){s=s.replace(/\s/g,"").replace(/sqrt|根号/g,"√").replace("（","(").replace("）",")");let m=s.match(/^(-?\d*\.?\d*)√\(?(\d+(?:\.\d+)?)\)?$/);if(m){let k=m[1]===""?1:m[1]=="-"?-1:+m[1];return k*sv(+m[2])}return /^-?\d+(\.\d+)?$/.test(s)?+s:NaN}
/* ---------- 图形 ---------- */

const chain=(a,b,c2,yl="y")=>`<svg viewBox="0 0 200 160" class="fig"><path class="f" d="M20 150H120V80Z"/><path class="f" d="M20 150L120 80L80 23Z"/><path class="l" d="M108 150V138H120M111.8 85.7L106.1 77.5L114.3 71.8"/><text x="62" y="158">${b}</text><text x="124" y="118">${a}</text><text x="38" y="80">${c2}</text><text x="105" y="42">${yl}</text></svg>`;
function plot(pts,close,guide,brk){let xs=pts.map(p=>p[0]).concat(0),ys=pts.map(p=>p[1]).concat(0),x0=Math.min(...xs)-1,x1=Math.max(...xs)+1,y0=Math.min(...ys)-1,y1=Math.max(...ys)+1,s=Math.min(160/(x1-x0),95/(y1-y0)),X=x=>10+(x-x0)*s,Y=y=>110-(y-y0)*s;
 let g=`<svg viewBox="0 0 200 125" class="fig"><path class="d" d="M5 ${Y(0)}H195M${X(0)} 5V120"/>`;
 g+=`<path class="l" d="${pts.map((p,i)=>(i==0||i==brk?"M":"L")+X(p[0])+" "+Y(p[1])).join("")}${close?"Z":""}"/>`;
 if(guide&&pts.length==2)g+=`<path class="d" d="M${X(pts[0][0])} ${Y(pts[0][1])}L${X(pts[1][0])} ${Y(pts[0][1])}L${X(pts[1][0])} ${Y(pts[1][1])}"/>`;
 pts.forEach(p=>{let a=X(p[0]),b=Y(p[1]),e=a>90,t=b<16;g+=`<circle class="p" cx="${a}" cy="${b}" r="2.5"/><text x="${a+(e?-5:5)}" y="${t?b+13:b-5}"${e?' text-anchor="end"':""}>${p[2]}(${p[0]},${p[1]})</text>`});return g+"</svg>"}
const pt=(x,y)=>`(${x}, ${y})`;
/* ---------- 8.1 题型 ---------- */
const e2=(a,b)=>`${a}² + ${b}² = ${a*a} + ${b*b} = ${a*a+b*b}`;
const hypArgs=()=>{let t=trip(),a=t[0],b=t[1];if(Math.random()<.5){a=R(2,12);b=R(2,12);if(a==b)b++}return[a,b]};
const gHyp=()=>{let[a,b]=hypArgs(),N=a*a+b*b;return{q:`直角三角形两直角边为 ${a}、${b}，求斜边 c。`,svg:rt(a,b,"c=?"),ans:sq(N),ws:[N,a+b,sq(Math.abs(a*a-b*b)),sq(N+2*a*b)],fb:rd(N),exp:`c² = ${e2(a,b)}<br>c = √${N} = ${sq(N)}`}};
const gLeg=()=>{let a,c;if(Math.random()<.5){let t=trip();a=P([t[0],t[1]]);c=t[2]}else{c=R(6,15);a=R(2,c-1)}let N=c*c-a*a;return{q:`直角三角形斜边 c = ${c}，一条直角边 a = ${a}，求另一条直角边 b。`,svg:rt(a,"b=?","c="+c),ans:sq(N),ws:[sq(c*c+a*a),N,c-a,sq(c*c-a)],fb:rd(N),exp:`b² = c² − a² = ${c}² − ${a}² = ${c*c} − ${a*a} = ${N}<br>b = √${N} = ${sq(N)}`}};
const gRect=()=>{let[w,h]=hypArgs(),N=w*w+h*h;return{q:`长方形长 ${w} cm、宽 ${h} cm，求对角线的长。`,svg:rect(w,h,"?"),ans:sq(N),ws:[N,w+h,sq(Math.abs(w*w-h*h)),sq(N+w*h)],fb:rd(N),exp:`对角线² = ${e2(w,h)}<br>对角线 = √${N} = ${sq(N)} cm`}};
const gIso=()=>{let t=trip(),m=t[0],h=t[1],l=t[2];return{q:`等腰三角形底边长 ${2*m}，腰长 ${l}，求底边上的高。`,svg:iso(2*m,l,"h=?"),ans:h,ws:[sq(l*l-4*m*m),l-m,sq(l*l+m*m),l*l-m*m],fb:h,exp:`高平分底边：半底 = ${m}<br>h² = ${l}² − ${m}² = ${l*l-m*m}<br>h = ${h}`}};
const gLad=()=>{let t=trip(),d=P([t[0],t[1]]),L=t[2],h=sv(L*L-d*d);return{q:`长 ${L} m 的梯子靠墙，梯脚离墙 ${d} m，梯顶离地面多高？`,svg:lad(L,d,"h=?"),ans:Math.round(h),ws:[L-d,sq(L*L+d*d),L*L-d*d,sq(L*L-d)],fb:Math.round(h),exp:`h² = ${L}² − ${d}² = ${L*L-d*d}<br>h = ${Math.round(h)} m`}};
const gCub=()=>{let[l,w,h]=Math.random()<.7?P([[2,3,6],[1,4,8],[2,6,9],[4,4,7],[3,4,12],[6,6,7],[2,10,11]]):[R(2,9),R(2,9),R(2,9)],N=l*l+w*w+h*h,AC=l*l+w*w;return{q:`长方体长 ${l} cm、宽 ${w} cm、高 ${h} cm，求体对角线 AG 的长。`,svg:cub(l,w,h),ans:sq(N),ws:[sq(AC),sq(w*w+h*h),N,l+w+h],fb:rd(N),exp:`AC² = ${l}² + ${w}² = ${AC}<br>AG² = AC² + CG² = ${AC} + ${h}² = ${N}<br>AG = √${N} = ${sq(N)} cm`}};
const PT=[];for(let a=3;a<=60;a++)for(let b=a+1;b<=80;b++){let c=Math.round(sv(a*a+b*b));if(c*c==a*a+b*b&&c<=100)PT.push([a,b,c])}
const legs=k=>PT.flatMap(t=>t[0]==k?[[t[1],t[2]]]:t[1]==k?[[t[0],t[2]]]:[]);
function chainPair(){for(;;){let t=P(PT.filter(x=>x[2]<=60)),[a,b,c]=Math.random()<.5?t:[t[1],t[0],t[2]],L=legs(c);if(!L.length)continue;let[y,c2]=P(L);return[a,b,c,y,c2]}}
const gChain=()=>{let[a,b,c1,y,c2]=chainPair();return{q:`如图，先求第一个直角三角形的斜边，再求 y。`,svg:chain(a,b,c2),ans:y,ws:[sq(c2*c2-a*a),sq(c2*c2-b*b),c2-c1,sq(c2*c2+c1*c1)],fb:y,exp:`第一个三角形：斜边² = ${e2(a,b)}，斜边 = ${c1}<br>y² = ${c2}² − ${c1}² = ${c2*c2-c1*c1}<br>y = ${y}`}};
const fHyp=()=>{let a=R(2,9),b=R(2,9),N=a*a+b*b;return{q:`直角三角形两直角边为 ${a}、${b}，求斜边（可写 4√2 形式）。`,svg:rt(a,b,"c"),val:sv(N),disp:sq(N),exp:`c² = ${e2(a,b)}，c = √${N} = ${sq(N)}`}};
const fLeg=()=>{let c=R(7,15),a=R(2,c-1),N=c*c-a*a;return{q:`直角三角形斜边 ${c}，一条直角边 ${a}，求另一直角边（可写根式）。`,svg:rt(a,"?",c),val:sv(N),disp:sq(N),exp:`b² = ${c}² − ${a}² = ${N}，b = ${sq(N)}`}};
const fRh=()=>{let t=trip(),a=t[0],b=t[1],s=t[2];return{q:`菱形周长 ${4*s} cm，一条对角线长 ${2*a} cm，求菱形面积（cm²）。`,val:2*a*b,disp:2*a*b,exp:`边长 = ${s}，半对角线 = ${a}<br>另一半对角线 = √(${s}² − ${a}²) = ${b}，另一对角线 = ${2*b}<br>面积 = ½ × ${2*a} × ${2*b} = ${2*a*b}`}};
/* ---------- 8.2 题型 ---------- */
const isR=a=>{let s=[...a].sort((x,y)=>x-y);return s[0]*s[0]+s[1]*s[1]==s[2]*s[2]};
const gSet=()=>{let t=trip(),[a,b,c]=t;let ws=[[a,b,c+1],[a,b+1,c],[a+1,b,c],[a,b,c-1],[a+1,b+1,c+1]].filter(x=>!isR(x)&&x[2]>0).map(x=>x.join(", "));return{q:`下列哪一组数可作为直角三角形的三边长？`,ans:t.join(", "),ws,fb:null,exp:`${e2(a,b)}，而 ${c}² = ${c*c}，相等 ✓<br>其余各组的两较短边平方和都不等于最长边的平方。`}};
const gCls=()=>{let t=trip(),s;if(Math.random()<.12)s=[t[0],t[0]+R(0,2),t[0]+t[0]+R(0,2)];else{s=[...t];let r=P([-1,1,0,2]);s[R(0,2)]+=r;}s.sort((x,y)=>x-y);let a=s[0],b=s[1],c=s[2],A=a*a+b*b,C=c*c,o=["直角三角形","锐角三角形","钝角三角形","不能构成三角形"],ans=a+b<=c?o[3]:A==C?o[0]:A>C?o[1]:o[2];return{q:`三角形三边长为 ${sh(s).join(", ")}，这是什么三角形？`,ans,ws:o.filter(x=>x!=ans),fb:null,exp:a+b<=c?`较短两边之和 ${a}+${b} = ${a+b} ≤ ${c}，不能构成三角形`:`最长边 ${c}：${a}² + ${b}² = ${A}，${c}² = ${C}<br>${A==C?"相等 → 直角":A>C?"平方和 > 最长边平方 → 锐角":"平方和 < 最长边平方 → 钝角"}三角形`}};
const gAng=()=>{let L=sh(["a","b","c"]),[x,y,z]=L;return{q:`在 △ABC 中，${x}² + ${y}² = ${z}²（a、b、c 分别是 ∠A、∠B、∠C 的对边），哪个角是直角？`,ans:"∠"+z.toUpperCase(),ws:["∠"+x.toUpperCase(),"∠"+y.toUpperCase(),"没有直角"],fb:null,exp:`两边平方和等于 ${z}²，故 ${z} 是斜边，其对角 ∠${z.toUpperCase()} = 90°`}};
const gSur=()=>{let x=R(1,7),y=R(1,7);if(x==y)y++;let N=x*x+y*y,f=c=>`${x}, ${y}, ${c}`;return{q:`下列哪一组可作为直角三角形的三边长？`,ans:f(sq(N)),ws:[f(sq(N+1)),f(sq(N-1)),f(x+y),f(sq(N+x))],fb:null,exp:`${e2(x,y)}，所以第三边 = √${N} = ${sq(N)}（边长不一定是整数）`}};
const gPro=()=>{let m=R(1,3),n=R(m+1,4),k=R(1,3),p=k*m*m,q=k*n*n,h=k*m*n,r=Math.random()<.55;if(!r)h+=P([-2,-1,1,2]);if(h<1)h=1;let l=h*h-p*q,ans=l==0?"是直角（90°）":l>0?"锐角（小于 90°）":"钝角（大于 90°）",o=["是直角（90°）","锐角（小于 90°）","钝角（大于 90°）","无法判断"];
 return{q:`如图，AD ⊥ BC，BD = ${p}，DC = ${q}，AD = ${h}，判断 ∠BAC。`,svg:`<svg viewBox="0 0 170 124" class="fig"><path class="f" d="M15 95H155L75 15Z"/><path class="d" d="M75 15V95"/><path class="l" d="M65 95V85H75"/><text x="35" y="108">${p}</text><text x="108" y="108">${q}</text><text x="79" y="58">${h}</text><text x="70" y="11">A</text><text x="8" y="119">B</text><text x="72" y="119">D</text><text x="154" y="119">C</text></svg>`,ans,ws:o.filter(x=>x!=ans),fb:null,exp:`AB² = ${h}² + ${p}² = ${h*h+p*p}，AC² = ${h}² + ${q}² = ${h*h+q*q}<br>AB² + AC² = ${2*h*h+p*p+q*q}，BC² = (${p}+${q})² = ${(p+q)**2}<br>${l==0?"相等":l>0?"AB²+AC² 较大":"AB²+AC² 较小"} → ∠BAC ${ans}`}};
const fX=()=>{let t=trip();return{q:`三边为 ${t[0]}、${t[1]}、x 的三角形是直角三角形，且 x 为最长边，求 x。`,val:t[2],disp:t[2],exp:`x² = ${e2(t[0],t[1])}，x = ${t[2]}`}};
const fAr=()=>{let t=trip();return{q:`直角三角形斜边 ${t[2]}，一条直角边 ${t[0]}，求它的面积。`,val:t[0]*t[1]/2,disp:t[0]*t[1]/2,exp:`另一直角边 = √(${t[2]}² − ${t[0]}²) = ${t[1]}<br>面积 = ½ × ${t[0]} × ${t[1]} = ${t[0]*t[1]/2}`}};
/* ---------- 8.3 题型 ---------- */
const sg=()=>P([-1,1]);
const gD1=()=>{let x1=R(-6,5),y1=R(-6,5),dx,dy;if(Math.random()<.5){let t=trip();dx=sg()*t[0];dy=sg()*t[1]}else{dx=sg()*R(1,8);dy=sg()*R(1,8)}let x2=x1+dx,y2=y1+dy,N=dx*dx+dy*dy;
 return{q:`求 A${pt(x1,y1)} 与 B${pt(x2,y2)} 两点的距离。`,svg:plot([[x1,y1,"A"],[x2,y2,"B"]],0,1),ans:sq(N),ws:[N,sq((x1+x2)**2+(y1+y2)**2),Math.abs(dx)+Math.abs(dy),sq(dx*dx+(y1+y2)**2)],fb:rd(N),exp:`Δx = ${x2} − ${x1<0?"("+x1+")":x1} = ${dx}，Δy = ${y2} − ${y1<0?"("+y1+")":y1} = ${dy}<br>d = √(${dx}² + ${dy}²) = √${N} = ${sq(N)}`}};
