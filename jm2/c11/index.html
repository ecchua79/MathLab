/* ===== core: helpers / grading / question builder (no DOM) ===== */
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1)),pick=a=>a[R(0,a.length-1)],

 case'pt':{const a=nums(cl(s));return a.length===2&&Math.abs(a[0]-o.fa[0])<1e-6&&Math.abs(a[1]-o.fa[1])<1e-6}
 case'text':return /无/.test(s)}return false}

function mk(gens,n,fill=false){const out=[],seen=new Set(),gl=shuffle(gens);let t=0,i=0;

 const bs=o.opts.map(t=>{const b=el('<button class=opt></button>');b.textContent=D(t);b._t=t;$('.opts',c).append(b);return b});

  const x=$('.ex',c);x.hidden=false;x.innerHTML=(ok?'✅ 正确！':'❌ 不对，正确答案是 <b>'+D(o.ans)+'</b>')+'<br>'+D(o.exp);onDone(ok)});return c}
function quizUI(host,gens){host.innerHTML='<h3>📝 随堂习题（5 题）</h3><div class=sc></div><div class=qs></div><div class=fl></div><button class=btn>🔄 重新出题</button>';

const fn=n=>String(Math.round(n*1e4)/1e4).replace('-','−'),pn=n=>n<0?`(${fn(n)})`:fn(n);

const rt=a=>{const u=[];a.forEach(([n,d=1])=>{const v=n/d;if(!u.some(w=>Math.abs(w[0]/w[1]-v)<1e-9))u.push([n,d])});return u.sort((p,q)=>p[0]/p[1]-q[0]/q[1]).map(([n,d])=>'x = '+fr(n,d)).join(' 或 ')},

sol=(nb,Dd,den)=>{if(den<0){nb=-nb;den=-den}let s=1,t=Dd;for(let k=Math.floor(Math.sqrt(Dd));k>1;k--)if(Dd%(k*k)===0){s=k;t=Dd/(k*k);break}
 const k=g(g(nb,s),den);nb/=k;s/=k;den/=k;const num=(nb?nb+' ± ':'± ')+(s>1?s:'')+'√'+t;return'x = '+(den>1?'('+num+')/'+den:num)},
xr=r=>r==='0'?'x':r[0]==='-'?`(x + ${r.slice(1)})`:`(x - ${r})`;
const q1=()=>{const a=R(2,5),b=R(2,9),c=R(2,9),ok=pick([`${a}x^2 + ${b}x = ${c}`,`${c} - ${a}x^2 = 0`,`x^2 - ${b}x = 0`]);
 return{q:'下列各式中，哪一个是一元二次方程式？',ans:ok,wrongs:[`x^2 + ${b}xy + y^2 = 0`,`x^3 - x - 1 = 0`,`x^2 + ${b}x = x^2 + ${c}`,`x^2 + ${b}x + ${c}`],
 exp:`一元二次方程式须：只含一个未知数、最高次方为 2、是等式。含 xy 有两个未知数；x³ 是三次；x² 两边消去后变成一次方程式；最后一个没有等号，只是代数式。`}};
const q2=()=>{const a=R(2,5),b=nz(-9,9),c=nz(-9,9),w=pick(['b','c']),ans=w==='b'?-b:-c;
 return{kind:'num',fa:ans,q:`把 ${a}x^2 = ${S([[b,'x'],[c,'']])} 化为一般式 ax² + bx + c = 0 后，${w} = ？`,ans:''+ans,wrongs:[''+(-ans),''+(w==='b'?c:b),''+(w==='b'?b:c),''+(-(w==='b'?c:b))],
 exp:`一般式的右边必须是 0：把右边的 ${S([[b,'x'],[c,'']])} 移到左边，每一项都要变号，得 ${S([[a,'x^2'],[-b,'x'],[-c,'']])} = 0，所以 b = ${-b}，c = ${-c}。`}};
const w1=()=>{const r=nz(-9,9),s=nz(-9,9);if(r===s||r+s===0)return w1();const B=-(r+s),C=r*s,eq=R(0,1)?S([[1,'x^2'],[C,'']])+' = '+S([[-B,'x']]):S([[1,'x^2'],[B,'x'],[C,'']])+' = 0',pr=[];
 for(let u=1;u<=Math.abs(C);u++)if(C%u===0)for(const sg of[1,-1]){const a=sg*u;if(a+C/a!==r+s)pr.push([a,C/a])}
 const[u,v]=pr.length?pick(pr):[r+1,s+1];
 return{kind:'roots',fa:[r,s],q:`解方程式 ${eq}`,ans:ri(r,s),wrongs:[ri(-r,-s),ri(u,v),ri(r,-s),ri(-r,s)],
 exp:`化成一般式 ${S([[1,'x^2'],[B,'x'],[C,'']])} = 0，积 ${C}、和 ${B} 的两数是 ${-r} 与 ${-s}，故 ${X(-r)}${X(-s)} = 0，x = ${r} 或 x = ${s}。`}};
const w2=()=>{const p=R(1,4),r=R(1,4),q=nz(-6,6),s=nz(-6,6);if(p*r===1||g(p,q)>1||g(r,s)>1)return w2();
 return{kind:'roots',fa:[-q/p,-s/r],q:`解方程式 ${S([[p*r,'x^2'],[p*s+q*r,'x'],[q*s,'']])} = 0`,ans:rt([[-q,p],[-s,r]]),wrongs:[rt([[q,p],[s,r]]),rt([[-p,q],[-r,s]]),rt([[-q,1],[-s,1]]),rt([[-q,r],[-s,p]])],
 exp:`交叉相乘分解：${P([[p,'x'],[q,'']])}${P([[r,'x'],[s,'']])} = 0，令每个因式为 0：${p}x + ${q} = 0 ⇒ x = ${fr(-q,p)}；${r}x + ${s} = 0 ⇒ x = ${fr(-s,r)}。`}};
const w3=()=>{const k=R(2,5),m=nz(-9,9);return{kind:'roots',fa:[0,m],q:`解方程式 ${k}x^2 = ${S([[k*m,'x']])}`,ans:ri(0,m),wrongs:[ri(m),ri(0,-m),ri(m,-m),ri(0)],

const w4=()=>{const a=nz(-5,5),b=nz(-5,5),k=nz(-4,4),r=a+k,s=b-k,c=k*(a-b+k);if(!c||r===s)return w4();
 return{kind:'roots',fa:[r,s],q:`解方程式 ${X(-a)}${X(-b)} = ${c}`,ans:ri(r,s),wrongs:[ri(a+c,b+c),ri(-r,-s),ri(r,-s),ri(a,b)],
 exp:`右边不是 0，不能令每个因式等于 ${c}！先展开：x² - ${a+b}x + ${a*b-c} = 0（注意符号），再因式分解 ${X(-r)}${X(-s)} = 0 ⇒ x = ${r} 或 x = ${s}。`}};
const k1=()=>{const h=nz(-6,6),t=R(2,8);return{kind:'roots',fa:[h+t,h-t],q:`解方程式 ${X(-h)}^2 = ${t*t}`,ans:ri(h+t,h-t),wrongs:[ri(h+t),ri(t,-t),ri(-h+t,-h-t),ri(h+t*t,h-t*t)],
 exp:`两边开平方：x ${h>0?'-':'+'} ${Math.abs(h)} = ±${t}，所以 x = ${h+t} 或 x = ${h-t}。别忘了正负两个值！`}};
const k2=()=>{const n=R(2,7),m=R(1,9);if(g(n,m)>1)return k2();return{kind:'roots',fa:[m/n,-m/n],q:`解方程式 ${n*n}x^2 = ${m*m}`,ans:rt([[m,n],[-m,n]]),wrongs:[rt([[m*m,n*n],[-m*m,n*n]]),rt([[n,m],[-n,m]]),rt([[m,n*n],[-m,n*n]]),rt([[m,n]])],

const k3=()=>{const t=R(2,9);return{kind:'text',q:`解方程式 x^2 + ${t*t} = 0`,ans:'无实数解',wrongs:[ri(t,-t),ri(t*t,-t*t),ri(-t),ri(t)],exp:`x² = ${-t*t}，但任何实数的平方都不会是负数，所以原方程式无实数解。（作答题请写“无解”）`}};
const k4=()=>{const h=nz(-5,5),k=pick([2,3,5,6,7,10]);return{q:`解方程式 ${X(-h)}^2 = ${k}`,ans:`x = ${h} ± √${k}`,wrongs:[`x = ${-h} ± √${k}`,`x = ${h} ± ${k}`,`x = ${h} + √${k}`,`x = ±√${k+h}`],

const p1=()=>{const b=pick([3,4,5,6,7,8,9,10,12,14])*pick([1,-1]);return{kind:'num',fa:b*b/4,q:`用适当的数填空：${S([[1,'x^2'],[b,'x']])} + □ = (x + □)^2。第一个 □ 应填的数是？`,ans:fr(b*b,4),wrongs:[fr(b,2),fr(b*b,1),fr(2*b,1),fr(b*b,2)],

const p2=()=>{const h=nz(-7,7),c=nz(-15,15),Rr=h*h-c;if(Rr<=0)return p2();return{kind:'num',fa:Rr,q:`把 ${S([[1,'x^2'],[2*h,'x'],[c,'']])} = 0 配方后得 (x ${h>0?'+':'-'} ${Math.abs(h)})^2 = □，方框应填？`,ans:''+Rr,wrongs:[''+(-c),''+(h*h+c),''+(4*h*h-c),''+(Rr+h*h)],

 return{q:`用配方法解 ${S([[1,'x^2'],[2*h,'x'],[c,'']])} = 0`,ans:`x = ${-h} ± √${Rr}`,wrongs:[`x = ${h} ± √${Rr}`,`x = ${-h} ± √${3*h*h+Rr}`,`x = ${-h} ± ${Rr}`,rad(h*h+c)&&`x = ${-h} ± ${rad(h*h+c)}`,rad(-c)&&`x = ${-h} ± ${rad(-c)}`].filter(Boolean),

const m1=()=>{const a=nz(-4,4),b=nz(-9,9),c=nz(-9,9),Dl=b*b-4*a*c;return{kind:'num',fa:Dl,q:`方程式 ${S([[a,'x^2'],[b,'x'],[c,'']])} = 0 的判别式 b^2 - 4ac 等于？`,ans:''+Dl,wrongs:[''+(b*b+4*a*c),''+(-b*b-4*a*c),''+(4*a*c-b*b),''+(b*b-2*a*c),''+(b-4*a*c)],
