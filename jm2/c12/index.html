const $=s=>document.querySelector(s),rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a,pick=a=>a[rnd(0,a.length-1)];

const pickN=(a,n)=>shuf(a).slice(0,n),gcd=(a,b)=>b?gcd(b,a%b):Math.abs(a),lcm=(a,b)=>a*b/gcd(a,b);

o+=`<span class="fr"><span>${R(s.slice(i+1,bar))}</span><span>${R(s.slice(bar+1,j-1))}</span></span>`;i=j}else o+=s[i++]}return o}

()=>{const a=rnd(2,6);return F(`化简 {x+${a}|x} × {x²|x²−${a*a}}`,`{x|x−${a}}`,[`{x²|x−${a}}`,`{x+${a}|x−${a}}`,`{x|x+${a}}`],'先把 x²−a² 分解成 (x+a)(x−a),再约分。',{f:x=>x/(x-a)})},

()=>{let p,q;do{p=rnd(2,9);q=rnd(2,9)}while(p==q||gcd(p,q)>1);return F(`化简 {{${p}|x}|{${q}|x²}}`,`{${p}x|${q}}`,[`{${p*q}|x³}`,`{${p}|${q}x}`,`{${p}x²|${q}}`],'繁分式 = 分子 ÷ 分母,除以分式要乘以倒数:{p|x}×{x²|q}。',{f:x=>p*x/q})},
()=>{const a=rnd(2,6);return F(`化简 {1+{${a}|x}|1−{${a}|x}}`,`{x+${a}|x−${a}}`,[`{${1+a}|${1-a}}`,`{x−${a}|x+${a}}`,'1'],'分子分母同乘 x:{x+a|x−a}。不能把 x 当作 1。',{f:x=>(x+a)/(x-a)})},
()=>{const a=rnd(2,6);return F(`化简 {{${a}|x}−{${a}|y}|{${a}|x}+{${a}|y}}`,`{y−x|x+y}`,[`{x−y|x+y}`,`{${a}(y−x)|x+y}`,`{y−x|xy}`],'分子分母同乘 xy/a(或先通分):常数 a 会约掉。',{f:(x,y)=>(y-x)/(x+y)})}],

()=>{const a=rnd(2,6);return F(`解方程 {x²|x−${a}} = {${a*a}|x−${a}}`,`x=−${a}`,[`x=${a}`,`x=±${a}`,'无解'],'去分母得 x²=a²,x=±a;但 x=a 使分母为 0,是增根,要舍去。',{n:-a,pre:1})},

const T=['学习目标','12.1 分式的概念与基本性质','12.2 分式的四则运算','12.3 繁分式','12.4 分式方程式','12.5 应用问题','章末测试'];
const N=[0,
`<p><b>分式:</b>若 A、B 是多项式且 B≠0,则 {A|B} 叫做分式。分母等于 0 时,分式没有意义。</p><p><b>基本性质:</b>分子与分母同时乘以或除以同一个不等于零的多项式,分式的值不变:{A|B}={A×M|B×M}={A÷M|B÷M}(M≠0)。</p><p><b>约分:</b>先因式分解,再约去分子与分母的公因式,化成最简分式。</p><p><b>通分:</b>把分母不同的分式化成相同分母,公分母取各分母的最低公倍式(L.C.M.)。</p><details><summary>例题:化简 {x²−9|x²+3x}</summary><p>{x²−9|x²+3x}={(x+3)(x−3)|x(x+3)}={x−3|x}</p></details>`,
`<p><b>同分母加减:</b>分母不变,分子相加减:{A|C}±{B|C}={A±B|C}。减去的分子要加括号。</p><p><b>异分母加减:</b>先通分,再加减,最后约分。</p><p><b>乘法:</b>{A|B}×{C|D}={AC|BD},可先因式分解约分。</p><p><b>除法:</b>除以一个分式,等于乘以它的倒数:{A|B}÷{C|D}={A|B}×{D|C}。</p><details><summary>例题:化简 {1|x−2} − {1|x+2}</summary><p>={x+2|(x−2)(x+2)}−{x−2|(x−2)(x+2)}={4|x²−4}</p></details>`,
`<p><b>繁分式:</b>分子或分母里又含有分式的分式。</p><p><b>化简方法:</b>① 分子、分母各自化成一个分式,再用“除以分式=乘以倒数”;② 分子、分母同乘各小分式分母的 L.C.M.。</p><details><summary>例题:化简 {1+{1|x}|1−{1|x}}</summary><p>分子分母同乘 x:{x+1|x−1}</p></details>`,
`<p><b>解法步骤:</b>① 两边同乘各分母的 L.C.M.,去分母;② 解整式方程;③ <b>检验</b>:代回原方程,使分母为 0 的根是增根,必须舍去。</p><details><summary>例题:解 {2|x−1} = {3|x}</summary><p>去分母:2x=3(x−1),得 x=3。代回检验,分母不为 0,所以 x=3。</p></details>`,
`<p><b>步骤:</b>设未知数 → 列分式方程 → 解方程并检验 → 作答。</p><p><b>工作问题:</b>把工作量看作 1。甲 a 天、乙 b 天、合作 t 天:{1|a}+{1|b}={1|t}。</p><p><b>行程问题:</b>时间={路程|速度};顺流速度=静水速度+水流速度,逆流速度=静水速度−水流速度。</p><details><summary>例题:甲 6 天、乙 3 天完成一项工作,合作几天?</summary><p>{1|6}+{1|3}={1|t},即 {1|2}={1|t},t=2 天。</p></details>`];
function mk(g,seen){for(let t=0;t<60;t++){const o=g(),a=[o.c,...o.w];if(new Set(a).size==a.length&&!seen.has(o.q)){seen.add(o.q);return o}}}
function batch(gens,k,seen){const od=shuf(gens),out=[];for(let i=0;i<k;i++){let o;for(let j=0;j<od.length&&!o;j++)o=mk(od[(i+j)%od.length],seen);if(o)out.push(o)}return out}
function ev(o,txt){let s=txt.trim().replace(/（/g,'(').replace(/）/g,')').replace(/[−–—]/g,'-').replace(/[×·]/g,'*').replace(/÷/g,'/').replace(/²/g,'^2').replace(/³/g,'^3').replace(/\s+/g,'');
if(o.n!==undefined)s=s.replace(/^x=/,'');if(!/^[0-9xy+\-*\/().^]+$/.test(s))return false;

try{if(o.n!==undefined){const v=fn(0,0);return Math.abs(v-o.n)<1e-6}
let ok=0;for(const[x,y]of[[2.3,1.7],[3.1,-2.2],[-1.9,.6],[5.2,4.1],[-4.4,-3.3]]){const u=fn(x,y),w=o.f(x,y);if(!isFinite(w))continue;if(!isFinite(u)||Math.abs(u-w)>1e-6*(1+Math.abs(w)))return false;ok++}return ok>=3}catch(e){return false}}
function mcq(o,k,cb){const d=document.createElement('div');d.className='card';d.innerHTML=`<p><b>${k}.</b> ${R(o.q)}</p><div class="ops"></div>`;const bx=d.lastChild;
shuf([o.c,...o.w]).forEach((t,j)=>{const b=document.createElement('button');b.className='op';b.dataset.t=t;b.innerHTML=`<i>${'ABCD'[j]}</i><span>${R(t)}</span>`;
