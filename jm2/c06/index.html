{id:'6.1',t:'周长',n:`<p>周长＝封闭平面图形<b>边界的总长度</b>：先找出所有边界，再求和。</p><ul><li>正方形：4×边长</li><li>长方形：2×(长＋宽)</li><li>正 n 边形：n×边长</li></ul><p class=tip>⚠️ 两个图形拼合时，贴合的边不再是边界；从长方形锡片里切掉菱形，周长反而<b>增加</b>。</p>`,

{id:'6.2a',t:'正方形·长方形',n:`<p>面积＝图形的大小。边长 1 cm 的正方形面积为 1 cm²。</p><ul><li>正方形面积 ＝ (边长)²</li><li>长方形面积 ＝ 长×宽</li></ul><p class=tip>⚠️ 周长和面积是两回事：长增加 20%，长方形面积增加 20%，但正方形边长增加 20%，面积增加 <b>44%</b>。</p>`,

f:[['上底',4,1,10],['下底',9,2,14],['高',4,1,8]],fn:([a,B,h])=>({p:[[(B-a)/2,0],[(B+a)/2,0],[+B,h],[0,h]].map(([x,y])=>[x,h-y]),t:`梯形面积 = ½×(${a}+${B})×${h} = <b>${nf((+a+ +B)*h/2)}</b>`})},
{id:'6.3',t:'面积单位换算',n:`<ul><li>1 cm² = 100 mm²</li><li>1 m² = 10000 cm²</li><li>1 公项 = 10000 m²</li><li>1 km² = 1000000 m² = 100 公项</li></ul><p class=tip>⚠️ 长度换算是 ×10、×100，面积要<b>平方</b>：×100、×10000。</p>`,
f:[['面积 (m²)',9,1,25]],fn:([x])=>({p:[[0,0],[1,0],[1,1],[0,1]],t:`${x} m² = <b>${x*1e4}</b> cm² = <b>${nf(x/1e4)}</b> 公项 = <b>${nf(x/1e6)}</b> km²`})}
];
// ===== 界面 =====
const $=s=>document.querySelector(s),M=$('#m');let cur=0;
const root=document.documentElement;let fs=15;
try{fs=+localStorage.getItem('fs69')||15;const t=localStorage.getItem('th69');if(t)root.dataset.theme=t}catch(e){}
const setFs=d=>{fs=Math.max(12,Math.min(22,fs+d));root.style.setProperty('--fs',fs+'px');try{localStorage.setItem('fs69',fs)}catch(e){}};setFs(0);
$('#fm').onclick=()=>setFs(-1);$('#fp').onclick=()=>setFs(1);
$('#th').onclick=()=>{const d=root.dataset.theme?root.dataset.theme=='dark':matchMedia('(prefers-color-scheme:dark)').matches;root.dataset.theme=d?'light':'dark';try{localStorage.setItem('th69',root.dataset.theme)}catch(e){}};
const names=['首页',...S.map(s=>s.id+' '+s.t),'总测验'];
$('#nav').innerHTML=names.map((n,i)=>`<button data-i=${i}>${n}</button>`).join('');
$('#nav').onclick=e=>{if(e.target.dataset.i)go(+e.target.dataset.i)};
function go(i){cur=i;document.querySelectorAll('nav button').forEach((b,j)=>b.classList.toggle('on',i==j));scrollTo(0,0);
 if(i==0)return home();if(i==names.length-1)return final();sec(S[i-1],i-1)}
function home(){M.innerHTML=`<div class=card><h2>第6章 周长与面积</h2><p><b>学习目标</b>：能计算正方形、长方形、三角形、平行四边形、梯形、菱形、风筝形的周长与面积；能应用等高三角形的面积比公式。</p><p>每节：📖 重点 → 🔧 互动演示 → ✏️ 5题选择（答对3题以上解锁2题作答）。章末有随机总测验，题目与选项每次都不同。</p></div><div class=g>${names.slice(1).map((n,i)=>`<button class=pri onclick=go(${i+1})>${n}</button>`).join('')}</div>`}
function sec(s,k){M.innerHTML=`<h2>${s.id} ${s.t}</h2><div class=card><h3>📖 重点</h3>${s.n}</div><div class=card><h3>🔧 互动演示</h3><svg viewBox="0 0 240 150"><polygon></svg><div class=f></div><p class=res></p></div><div id=qz></div>`;
 const v=s.f.map(x=>x[1]),f=M.querySelector('.f'),pg=M.querySelector('polygon');
 const draw=()=>{const{p,t}=s.fn(v),xs=p.map(a=>a[0]),ys=p.map(a=>a[1]),x0=Math.min(...xs),y0=Math.min(...ys),w=Math.max(...xs)-x0||1,h=Math.max(...ys)-y0||1,sc=Math.min(200/w,120/h);
  pg.setAttribute('points',p.map(([x,y])=>`${20+(x-x0)*sc+(200-w*sc)/2},${15+(y-y0)*sc+(120-h*sc)/2}`).join(' '));M.querySelector('.res').innerHTML=t};
 s.f.forEach((x,i)=>{const d=document.createElement('label');d.innerHTML=`${x[0]}：<b>${v[i]}</b><input type=range min=${x[2]} max=${x[3]} value=${v[i]}>`;d.querySelector('input').oninput=e=>{v[i]=+e.target.value;d.querySelector('b').textContent=v[i];draw()};f.append(d)});draw();
 quiz($('#qz'),G[k],5,'✏️ 小测：5题选择',true)}
function final(){M.innerHTML=`<h2>🏆 总测验</h2><div id=qz></div>`;quiz($('#qz'),G.flat(),10,'全章随机测验：10题',false)}
function quiz(el,gens,n,title,fill){let score=0,done=0;const pool=sh(gens),qs=[...Array(n)].map((_,i)=>mk(pool[i%pool.length]));
 el.innerHTML=`<div class=card><h3>${title}</h3><div class=sc>已答 0/${n}　答对 0</div></div>`;const box=el.firstChild,sc=box.querySelector('.sc');
 qs.forEach((q,i)=>{const c=document.createElement('div');c.className='card';c.innerHTML=`<b>${i+1}.</b> ${q.q}（单位：${q.u}）${q.o.map(o=>`<button class=op data-v="${o}">${o} ${q.u}</button>`).join('')}<div class=ex></div>`;
  c.onclick=e=>{const b=e.target.closest('.op');if(!b||c.dataset.l)return;c.dataset.l=1;const ok=b.dataset.v==q.a;c.querySelectorAll('.op').forEach(x=>{if(x.dataset.v==q.a)x.classList.add('ok')});if(!ok)b.classList.add('no');
   c.querySelector('.ex').innerHTML=(ok?'✅ 正确！':'❌ 错了。')+q.e;done++;score+=ok;sc.textContent=`已答 ${done}/${n}　答对 ${score}`;if(done==n)end()};el.append(c)});
 function end(){const d=document.createElement('div');d.className='card';let h=`<h3>成绩：${score}/${n}</h3>`;
  if(fill&&score>=3)h+=`<p>🎉 解锁作答题！请自己输入答案（只填数字）。</p><div id=fl></div>`;else if(fill)h+=`<p>答对 3 题以上才能解锁作答题，再试一组吧！</p>`;else h+=`<p>${score>=9?'太棒了！':score>=6?'不错，继续加油！':'多看重点再来挑战！'}</p>`;
  d.innerHTML=h+`<button class=pri>🔄 换一组新题</button>`;d.querySelector('button').onclick=()=>quiz(el,gens,n,title,fill);el.append(d);d.scrollIntoView({behavior:'smooth'});
  if(fill&&score>=3){const fl=d.querySelector('#fl');let fd=0,fs2=0;for(let i=0;i<2;i++){const q=mk(pick(gens)),c=document.createElement('div');c.innerHTML=`<p><b>作答${i+1}.</b> ${q.q}（单位：${q.u}）</p><input type=text inputmode=decimal> <button>提交</button><div class=ex></div>`;
   c.querySelector('button').onclick=e=>{if(c.dataset.l)return;const v=Number(c.querySelector('input').value.trim());if(c.querySelector('input').value.trim()==''||isNaN(v))return;c.dataset.l=1;const ok=Math.abs(v-+q.a)<1e-6*Math.max(1,+q.a);c.querySelector('.ex').innerHTML=(ok?'✅ 正确！':`❌ 答案是 ${q.a} ${q.u}。`)+q.e;fd++;fs2+=ok;if(fd==2)fl.append(Object.assign(document.createElement('p'),{innerHTML:`<b>作答题：${fs2}/2</b>`}))};fl.append(c)}}}}
go(0);
</script></body></html>
