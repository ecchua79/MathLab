[()=>{let L=4*R(3,8);return[`Rt△PQR 中 ∠P=90°，∠Q=30°，QR=${L} cm，PS⊥QR 于 S。`,[['PR 是多少 cm？',L/2,`30° 角所对的直角边等于斜边的一半：${L}÷2=${L/2} cm。`],['∠RPS 是多少度？',30,`∠R=90°−30°=60°；在 △PSR 中 ∠RPS=90°−60°=30°。`],['RS 是多少 cm？',L/4,`Rt△PSR 中 ∠RPS=30°，它的对边 RS=PR÷2=${L/2}÷2=${L/4} cm。`],['QS 是多少 cm？',3*L/4,`QS=QR−RS=${L}−${L/4}=${3*L/4} cm。`]]]}]];

/* ---------- 三角形绘图与互动工具 ---------- */
function tri(A,B,C){const r=Math.PI/180,a=Math.sin(A*r),cc=Math.sin(C*r),ax=cc*Math.cos(B*r),ay=cc*Math.sin(B*r),mn=Math.min(0,ax),w=Math.max(a,ax)-mn,s=Math.min(230/w,105/ay),o=20-mn*s,p=(x,y)=>[o+x*s,125-y*s],[bx,by]=p(0,0),[cx,cy]=p(a,0),[tx,ty]=p(ax,ay);
return`<svg viewBox="0 0 270 145" width="270"><polygon points="${bx},${by} ${cx},${cy} ${tx},${ty}"/><text x="${tx}" y="${ty-6}">A</text><text x="${bx-12}" y="${by+4}">B</text><text x="${cx+4}" y="${cy+4}">C</text></svg>`}
