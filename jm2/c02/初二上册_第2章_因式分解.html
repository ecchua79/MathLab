<script>
/* ===== core: helpers / grading / question builder (no DOM) ===== */
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1)),pick=a=>a[R(0,a.length-1)],
shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=R(0,i);[a[i],a[j]]=[a[j],a[i]]}return a},
g=(a,b)=>b?g(b,a%b):Math.abs(a),nz=(a,b)=>{let v;do v=R(a,b);while(!v);return v},
SUP='⁰¹²³⁴⁵⁶⁷⁸⁹',
D=s=>String(s).replace(/\^(\d)/g,(m,d)=>SUP[d]).replace(/-/g,'−').replace(/\*/g,'·'),
S=t=>{let o='';t.forEach(([c,m])=>{if(!c)return;const a=Math.abs(c),n=(a===1&&m)?'':a;o+=(o?(c<0?' - ':' + '):(c<0?'-':''))+n+m});return o||'0'},
P=t=>'('+S(t)+')',
fr=(n,d=1)=>{if(d<0){n=-n;d=-d}const k=g(n,d)||1;n/=k;d/=k;return d===1?''+n:n+'/'+d},

function pw(s){let i;while((i=s.indexOf('^'))>=0){const e=s.slice(i+1).match(/^\d+/)[0];let j=i-1,b;
 if(s[j]===')'){let d=0;for(;j>=0;j--){if(s[j]===')')d++;if(s[j]==='('&&--d===0)break}b=s.slice(j,i)}
 else{while(j>=0&&/[a-z0-9.]/.test(s[j]))j--;j++;b=s.slice(j,i)}
 s=s.slice(0,j)+'Math.pow('+b+','+e+')'+s.slice(i+1+e.length)}return s}
function ev(s,vals){s=NORM(s);if(!/^[0-9a-z+\-*/^().]*$/.test(s))return NaN;
 s=pw(s.replace(/(\d|[a-z]|\))(?=[a-z(])/g,'$1*'));const ks=Object.keys(vals);
 try{return Function(...ks,'"use strict";return '+s)(...ks.map(k=>vals[k]))}catch(e){return NaN}}
const lets=(...x)=>[...new Set((x.map(NORM).join('')).match(/[a-z]/g)||[])],
vv=ls=>Object.fromEntries(ls.map(l=>[l,1.3+Math.random()*5.7])),
close=(x,y)=>isFinite(x)&&isFinite(y)&&Math.abs(x-y)<=1e-6*Math.max(1,Math.abs(x),Math.abs(y));
function veq(a,b){const ls=lets(a,b);for(let t=0;t<4;t++){const v=vv(ls);if(!close(ev(a,v),ev(b,v)))return false}return true}
function grp(s){s=NORM(s);const o=[];let d=0,st=0;for(let i=0;i<s.length;i++){if(s[i]==='('){if(!d)st=i;d++}else if(s[i]===')'){d--;if(!d){const m=s.slice(i+1).match(/^\^(\d)/),n=m?+m[1]:1;for(let k=0;k<n;k++)o.push(s.slice(st+1,i))}}}return o}
function gsame(A,B){const a=grp(A),b=grp(B);if(a.length!==b.length)return false;const ls=lets(A,B),pts=[0,1,2].map(()=>vv(ls)),
 f=gs=>gs.map(c=>{const v=pts.map(p=>ev(c,p));return v.map(x=>x/v[0])}),fa=f(a),fb=f(b),used=new Set();
 for(const x of fa){const j=fb.findIndex((y,i)=>!used.has(i)&&x.every((v,k)=>close(v,y[k])));if(j<0)return false;used.add(j)}return true}
const prim=c=>{const cs=NORM(c).replace(/\([^)]*\)/g,'1').split(/(?=[+-])/).map(t=>{const m=t.replace(/^[+-]/,'').match(/^\d+/);return m?+m[0]:1});return cs.reduce(g)<=1};
function exprOK(s,a){s=NORM(s);if(!s)return false;if(!/\(/.test(s)&&/^\([^()]*\)$/.test(NORM(a)))s='('+s+')';
 return veq(s,a)&&gsame(s,a)&&grp(s).every(prim)}
const nums=s=>(s.match(/-?\d+(\.\d+)?(\/-?\d+)?/g)||[]).map(t=>{const[a,b]=t.split('/');return b?+a/+b:+a}),
cl=s=>NORM(s).replace(/[a-z₁₂]/g,'');
function grade(o,s){switch(o.kind){
 case'expr':return exprOK(s,o.ans);
 case'num':{const v=nums(cl(s));return v.length>0&&Math.abs(v[0]-o.fa)<1e-6}
 case'roots':{const a=[...new Set(nums(cl(s)).map(v=>+v.toFixed(6)))].sort((x,y)=>x-y),b=[...new Set(o.fa.map(v=>+v.toFixed(6)))].sort((x,y)=>x-y);return a.length===b.length&&a.every((v,i)=>Math.abs(v-b[i])<1e-6)}
 case'pt':{const a=nums(cl(s));return a.length===2&&Math.abs(a[0]-o.fa[0])<1e-6&&Math.abs(a[1]-o.fa[1])<1e-6}
 case'text':return /无/.test(s)}return false}
function prep(o){if(!o.q)o.q='因式分解：'+o.ex;const seen=new Set([NORM(o.ans)]),w=[];
 for(const x of o.wrongs){const k=NORM(x);if(seen.has(k))continue;if(o.kind==='expr'&&exprOK(x,o.ans))continue;seen.add(k);w.push(x)}
 if(w.length<3)return null;o.opts=shuffle([o.ans,...shuffle(w).slice(0,3)]);return o}
function mk(gens,n,fill=false){const out=[],seen=new Set(),gl=shuffle(gens);let t=0,i=0;
 while(out.length<n&&t++<400){const f=gl[i++%gl.length];let o;try{o=f()}catch(e){continue}if(!o||(fill&&!o.kind))continue;o=prep(o);if(!o||seen.has(o.q))continue;seen.add(o.q);out.push(o)}return out}

/* ===== ui ===== */
const $=(s,r=document)=>r.querySelector(s),el=h=>{const d=document.createElement('div');d.innerHTML=h.trim();return d.firstElementChild},
store={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
function setTheme(t){document.documentElement.dataset.theme=t;store.set('m_th',t);$('#thm').textContent=t==='dark'?'☀️ 浅色':'🌙 深色'}
let fs=+store.get('m_fs')||15;
function setFs(v){fs=Math.min(22,Math.max(12,v));document.documentElement.style.fontSize=fs+'px';store.set('m_fs',fs);$('#fsv').textContent=fs}
function fillCard(o){const c=el(`<div class=q><div class=qt>✏️ ${D(o.q)}${o.ex?'<small>（须分解到不能再分解为止）</small>':''}</div><div class=row><input class=in placeholder="输入你的答案（可用 ^ 表示次方）"><button class=btn>提交</button></div><div class=ex hidden></div></div>`);
 const inp=$('input',c),b=$('button',c);b.onclick=()=>{if(c.dataset.d||!inp.value.trim())return;c.dataset.d=1;inp.disabled=b.disabled=true;
  const ok=grade(o,inp.value),x=$('.ex',c);x.hidden=false;c.classList.add(ok?'ok':'bad');
  x.innerHTML=(ok?'✅ 正确！':'❌ 不对。参考答案：<b>'+D(o.ans)+'</b>')+'<br>'+D(o.exp)};
 inp.onkeydown=e=>{if(e.key==='Enter')b.click()};return c}
function qCard(o,i,onDone){const c=el(`<div class=q><div class=qt>${i}. ${D(o.q)}${o.ex?'<small>（须分解到不能再分解为止）</small>':''}</div><div class=opts></div><div class=ex hidden></div></div>`);
 const bs=o.opts.map(t=>{const b=el('<button class=opt></button>');b.textContent=D(t);b._t=t;$('.opts',c).append(b);return b});
 bs.forEach(b=>b.onclick=()=>{if(c.dataset.d)return;c.dataset.d=1;const ok=b._t===o.ans;bs.forEach(x=>x.classList.add(x._t===o.ans?'ok':(x===b?'bad':'dim')));
  const x=$('.ex',c);x.hidden=false;x.innerHTML=(ok?'✅ 正确！':'❌ 不对，正确答案是 <b>'+D(o.ans)+'</b>')+'<br>'+D(o.exp);onDone(ok)});return c}
function quizUI(host,gens){host.innerHTML='<h3>📝 随堂习题（5 题）</h3><div class=sc></div><div class=qs></div><div class=fl></div><button class=btn>🔄 重新出题</button>';
 const bar=$('.sc',host),box=$('.qs',host),fl=$('.fl',host);let done,score;
 function start(){const qs=mk(gens,5);done=score=0;fl.innerHTML='';box.innerHTML='';bar.textContent='已答 0/5 · 答对 0';
  qs.forEach((o,i)=>box.append(qCard(o,i+1,ok=>{done++;if(ok)score++;bar.textContent=`已答 ${done}/5 · 答对 ${score}`;
   if(done===5){if(score>=3){fl.innerHTML='<h3>🔓 作答题已解锁（自己输入答案）</h3>';mk(gens,2,true).forEach(o=>fl.append(fillCard(o)))}
   else fl.innerHTML=`<div class=lock>🔒 答对 3 题或以上才能解锁作答题（你答对 ${score}/5）。点“重新出题”再试一次！</div>`}})))}
 $('.btn',host).onclick=start;start()}
function demoUI(host,gens){host.innerHTML='<button class=btn>🎲 随机例题演示</button><div class=ex2 hidden></div>';
 $('.btn',host).onclick=()=>{const o=mk(gens,1)[0],x=$('.ex2',host);x.hidden=false;x.innerHTML=`<b>例：</b>${D(o.q)}<br><b>答案：</b>${D(o.ans)}<br><b>解：</b>${D(o.exp)}`}}
function reviewUI(host,secs){host.innerHTML='<h3>🏁 章末综合测试（10 题，随机抽自各节）</h3><div class=sc></div><div class=qs></div><div class=fl></div><button class=btn>🔄 重新出题</button>';
 const bar=$('.sc',host),box=$('.qs',host),fl=$('.fl',host);let done,score;
 function start(){done=score=0;box.innerHTML=fl.innerHTML='';bar.textContent='已答 0/10 · 答对 0';const ss=shuffle(secs),qs=[],seen=new Set();let t=0;
  while(qs.length<10&&t++<500){const s=ss[qs.length%ss.length],o=mk(s.gens,1)[0];if(o&&!seen.has(o.q)){seen.add(o.q);qs.push(o)}}
  qs.forEach((o,i)=>box.append(qCard(o,i+1,ok=>{done++;if(ok)score++;bar.textContent=`已答 ${done}/10 · 答对 ${score}`;
   if(done===10)fl.innerHTML=`<div class=lock>总分 ${score}/10 ${score>=9?'🏆 太棒了！':score>=6?'👍 不错，再巩固错题！':'💪 回去再看各节例题，然后重新测试。'}</div>`})))}
 $('.btn',host).onclick=start;start()}
function boot(CH){document.title=CH.title;$('#ttl').textContent=CH.title;$('#sub').textContent=CH.sub;
 const nav=$('#nav'),main=$('#main'),secs=[];
 CH.secs.forEach((s,i)=>{const sec=el(`<section hidden><h2>${s.t}</h2>${s.html?'<div class=box>'+s.html+'</div>':''}<div class=demo></div><div class=quiz></div></section>`);
  if(s.gens)demoUI($('.demo',sec),s.gens);else $('.demo',sec).remove();
  [].concat(s.tool||[]).forEach(f=>{const d=el('<div class=tool></div>');sec.insertBefore(d,$('.quiz',sec));f(d)});
  if(s.review)reviewUI($('.quiz',sec),CH.secs.filter(x=>x.gens));else quizUI($('.quiz',sec),s.gens);
  const b=el('<button class=tab></button>');b.textContent=s.n;b.onclick=()=>{secs.forEach(x=>{x.sec.hidden=x.b!==b;x.b.classList.toggle('on',x.b===b)});scrollTo(0,0)};
  nav.append(b);main.append(sec);secs.push({sec,b})});
 secs[0].b.click();
 $('#thm').onclick=()=>setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');
 $('#fsm').onclick=()=>setFs(fs-1);$('#fsp').onclick=()=>setFs(fs+1);
 setTheme(store.get('m_th')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'));setFs(fs)}

/* ported from 参考页：逐步解题计算器核心 */
const fn=n=>String(Math.round(n*1e4)/1e4).replace('-','−'),pn=n=>n<0?`(${fn(n)})`:fn(n);
const cof=(v,t,f)=>v?(v<0?(f?'−':' − '):(f?'':' + '))+((Math.abs(v)==1&&t)?'':fn(Math.abs(v)))+t:'';
const TT=(a,b,c)=>cof(a,'x²',1)+cof(b,'x')+cof(c,'')+' = 0',lin=(p,q)=>(p==1?'x':p==-1?'−x':fn(p)+'x')+(q?(q>0?' + ':' − ')+fn(Math.abs(q)):'');
const STP=(t,b,c='')=>`<div class="stp ${c}"><b>${t}</b><div>${b}</div></div>`,eq0=(x,y)=>Math.abs(x-y)<1e-9;
const fv=x=>{const q=toQ(x);return q&&q.d>1?FQ(q):fn(x)},fin=(x1,x2)=>STP('✅ 最终求解结果',`<span class="big">${eq0(x1,x2)?'x₁ = x₂ = '+fv(x1):'x₁ = '+fv(x1)+'，x₂ = '+fv(x2)}</span>`,'good');
const nor=w=>STP('❌ 无实数解',w,'bad');
function gfp(ac){const A=Math.abs(ac),r=[],sn=new Set();for(let i=1;i<=Math.sqrt(A);i++)if(A%i==0){const j=A/i;(ac>0?[[i,j],[-i,-j]]:[[i,-j],[-i,j]]).forEach(p=>{const q=p[0]<=p[1]?p:[p[1],p[0]];if(!sn.has(q+'')){sn.add(q+'');r.push(q)}})}return r}
function fcm(a,b,c){for(const[p1,p2]of gfp(a))for(const[q1,q2]of gfp(c)){if(p1*q2+p2*q1==b)return[p1,q1,p2,q2];if(p1*q1+p2*q2==b)return[p1,q2,p2,q1]}return null}
const gc=(x,y)=>y?gc(y,x%y):Math.abs(x),RQ=(n,d=1)=>{if(d<0){n=-n;d=-d}const g=gc(n,d)||1;return{n:n/g,d:d/g}};
const qa=(x,y)=>RQ(x.n*y.d+y.n*x.d,x.d*y.d),qm=(x,y)=>RQ(x.n*y.n,x.d*y.d),qd=(x,y)=>RQ(x.n*y.d,x.d*y.n),qn=x=>RQ(-x.n,x.d);
const toQ=x=>{if(Number.isInteger(x))return RQ(x);for(let d=2;d<=1000;d++){const n=Math.round(x*d);if(Math.abs(x*d-n)<1e-9)return RQ(n,d)}return null};
const FQ=(x,ab)=>{const n=ab?Math.abs(x.n):x.n,m=n<0?'−':'';return x.d==1?m+Math.abs(n):`${m}<span class="fr"><i>${Math.abs(n)}</i><i>${x.d}</i></span>`};
const cq=(v,t,f)=>v.n?(v.n<0?(f?'−':' − '):(f?'':' + '))+((Math.abs(v.n)==1&&v.d==1&&t)?'':FQ(v,1))+t:'';

const h1=()=>{const d=pick([2,3,4,6]),u=pick([1,2,3,5]),v=pick([1,2,3,5]),i=R(1,4),j=R(1,4),k=R(1,4),l=R(1,4);if(u===v||g(u,v)>1||i===k||j===l)return h1();

{n:'2.1a 抽取公因式',t:'2.1a 抽取公因式法',gens:GA,tool:[areaTool('f'),facTool([[1,5,6,'x²+5x+6'],[1,-7,-18,'x²−7x−18'],[2,7,3,'2x²+7x+3'],[6,-11,-10,'6x²−11x−10'],[1,0,-9,'平方差 x²−9'],[4,0,-25,'平方差 4x²−25'],[1,6,9,'完全平方 x²+6x+9'],[4,-12,9,'完全平方 4x²−12x+9'],[2,32,128,'先提公因式 2x²+32x+128'],[1,3,0,'x²+3x'],[1,2,5,'无法分解 x²+2x+5']])],html:'<p><b>因式分解</b>：把一个多项式写成几个多项式的乘积，须分解到每个因式都不能再分解为止。</p><p>若每一项都含有相同的因式，就把它抽出来：<b>ax + 2ay = a(x + 2y)</b>。步骤：① 系数取最大公约数 ② 字母取最低次方 ③ 抽出后检验（展开应得回原式）。</p><p>⚠ <b>a - b = -(b - a)</b>：例 4(b-a) + y(a-b) = 4(b-a) - y(b-a) = (b-a)(4-y)。</p>'},
{n:'2.1b 平方差',t:'2.1b 平方差公式',gens:GB,tool:[areaTool('d'),facTool([[1,5,6,'x²+5x+6'],[1,-7,-18,'x²−7x−18'],[2,7,3,'2x²+7x+3'],[6,-11,-10,'6x²−11x−10'],[1,0,-9,'平方差 x²−9'],[4,0,-25,'平方差 4x²−25'],[1,6,9,'完全平方 x²+6x+9'],[4,-12,9,'完全平方 4x²−12x+9'],[2,32,128,'先提公因式 2x²+32x+128'],[1,3,0,'x²+3x'],[1,2,5,'无法分解 x²+2x+5']])],html:'<p><b>a² - b² = (a + b)(a - b)</b></p><p>例：9x² - 25y² = (3x)² - (5y)² = (3x+5y)(3x-5y)。有公因式时<b>先提公因式</b>：2a² - 18b² = 2(a²-9b²) = 2(a+3b)(a-3b)。</p><p>计算技巧：13.5² - 6.5² = (13.5+6.5)(13.5-6.5) = 140。</p>'},
{n:'2.1c 完全平方',t:'2.1c 完全平方公式',gens:GC,tool:[areaTool('s'),facTool([[1,5,6,'x²+5x+6'],[1,-7,-18,'x²−7x−18'],[2,7,3,'2x²+7x+3'],[6,-11,-10,'6x²−11x−10'],[1,0,-9,'平方差 x²−9'],[4,0,-25,'平方差 4x²−25'],[1,6,9,'完全平方 x²+6x+9'],[4,-12,9,'完全平方 4x²−12x+9'],[2,32,128,'先提公因式 2x²+32x+128'],[1,3,0,'x²+3x'],[1,2,5,'无法分解 x²+2x+5']])],html:'<p><b>a² + 2ab + b² = (a + b)²</b>，<b>a² - 2ab + b² = (a - b)²</b></p><p>判断：首尾两项是平方，中间项是首尾底数乘积的 2 倍。首项为负先提出 -1：6a - 9a² - 1 = -(3a - 1)²。</p><p>💭 思考：(2 - x)² 也可写成 (x - 2)²，因为 (-A)² = A²。</p>'},
{n:'2.1d 交叉相乘 a=1',t:'2.1d 交叉相乘法（首项系数为 1）',gens:GD,tool:[facTool([[1,5,6,'x²+5x+6'],[1,-7,-18,'x²−7x−18'],[2,7,3,'2x²+7x+3'],[6,-11,-10,'6x²−11x−10'],[1,0,-9,'平方差 x²−9'],[4,0,-25,'平方差 4x²−25'],[1,6,9,'完全平方 x²+6x+9'],[4,-12,9,'完全平方 4x²−12x+9'],[2,32,128,'先提公因式 2x²+32x+128'],[1,3,0,'x²+3x'],[1,2,5,'无法分解 x²+2x+5']])],html:'<p><b>x² + (a+b)x + ab = (x+a)(x+b)</b>：找两个数，<b>积 = 常数项，和 = 一次项系数</b>。</p><p>例：x² + 5x + 6 → 6 = 2×3 且 2+3 = 5 ⇒ (x+2)(x+3)；x² - 7x - 18 = (x+2)(x-9)。</p>'},
