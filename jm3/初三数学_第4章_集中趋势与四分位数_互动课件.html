quart:i=>{let e=ex_(i),n=e.length;if(n<4)throw'至少需要 4 个数据';let h=n>>1,[a,b,c]=quart(e),L=e.slice(0,h).map(F).join('，'),U=e.slice(n-h).map(F).join('，');
