return`<svg width="${2*(l+w)*k+20}" height="${(h+2*w)*k+20}">${g}</svg><br>侧面展开长方形：长=2(${f(l)}+${f(w)})=<b>${f(2*(l+w))} cm</b>，宽=<b>${f(h)} cm</b>，面积=${f(2*(l+w)*h)} cm²<br>两个底面：2×${f(l*w)}=${f(2*l*w)} cm²<br>展开图总面积＝表面积＝<b>${f(2*(l+w)*h+2*l*w)} cm²</b>`}},
{t:'6.4 棱柱',th:`<ul><li>两底面平行且全等，侧面都是平行四边形的多面体。侧棱⊥底面称<b>直棱柱</b>；底面是正多边形的直棱柱称<b>正棱柱</b>。</li><li class="fm">直棱柱：V＝底面积×高　S＝2×底面积＋底面周长×高</li></ul>`,
ex:[['例题1','底面直角边6、8，高7：底面积=½×6×8=24，V=24×7=<b>168 cm³</b>。'],['例题2 游泳池','截面梯形：½(1.5+3)×50=112.5 m²，V=112.5×10=1125 m³=<b>1 125 000 升</b>。'],['例题3','直角边9、12，斜边15，高10：S=2×54+36×10=<b>468 cm²</b>。']],
fg:([n,a,h])=>prism(n,a,h),nt:([n,a,h])=>prNet(n,a,h),cf:[['n','底面：正n边形，n=',4,[3,4,5,6]],['a','底边长 a (cm)',6],['h','棱柱高 h (cm)',10]],run:([n,a,h])=>{const t=Math.tan(Math.PI/n),A=n*a*a/(4*t),C=n*a,ap=a/(2*t);return`正${n}棱柱：底面是边长${f(a)}的正${n}边形（边心距≈${f(ap)}）<br>底面积≈<b>${f(A)} cm²</b>，底面周长=${n}×${f(a)}=<b>${f(C)} cm</b><br>体积 V=底面积×高=${f(A)}×${f(h)}=<b>${f(A*h)} cm³</b><br>侧面积=周长×高=${f(C)}×${f(h)}=${f(C*h)} cm²<br>表面积 S=2×${f(A)}+${f(C*h)}=<b>${f(2*A+C*h)} cm²</b>`}},
{t:'6.5 直圆柱',th:`<div class="fm">V=πr²h　侧面积=2πrh　S=2πr²+2πrh</div><p>侧面展开是长方形：长＝底圆周长2πr，宽＝高h。</p>`,
ex:[['例题1','r=2，h=3：V=π×2²×3=<b>12π cm³</b>。'],['例题2','V=112π，h=7：r²=16，r=<b>4 cm</b>。'],['例题3 铁管','内半径10，外半径11，长300：V=π(11²−10²)×300=22/7×21×300=<b>19800 cm³</b>。'],['例题5 无盖铁桶','r=7，h=15：154+660=<b>814 cm²</b>。']],pi:1,fg:([r,h])=>cyl(r,h),nt:([r,h])=>cylNet(r,h),
cf:[['r','底圆半径 r (cm)',7],['h','高 h (cm)',15]],run:([r,h],m)=>`底面积=π×${f(r)}²=${m(r*r)}<br>体积 V=πr²h=<b>${m(r*r*h)} cm³</b>（${f(Math.PI*r*r*h/1000)} 升）<br>侧面积=2πrh=<b>${m(2*r*h)} cm²</b><br>表面积 S=2πr²+2πrh=<b>${m(2*r*r+2*r*h)} cm²</b><br>无盖：πr²+2πrh=<b>${m(r*r+2*r*h)} cm²</b>`},
{t:'6.6 棱锥',th:`<div class="fm">V＝${FR(1,3)}×底面积×高　S＝底面积＋各侧面三角形面积之和</div><p>正棱锥的侧面是全等三角形，斜高 s=√(h²+(底边/2)²)。同底同高的棱锥体积是棱柱的${FR(1,3)}。</p>`,
ex:[['例题1','底面10×10，高12：V=⅓×100×12=400 cm³=<b>0.4 升</b>。'],['例题3','底面8×6，侧棱13：AC=10，OC=5，VO=√(13²−5²)=12；V=⅓×48×12=<b>192 cm³</b>。'],['例题4','底边10，高12：斜高=√(12²+5²)=13；S=100+4×½×10×13=<b>360 cm²</b>。']],
fg:([l,w,h])=>pyr(l,w,h),nt:([l,w,h])=>pyrNet(l,w,h),cf:[['l','底面长 l (cm)',10],['w','底面宽 w (cm)',10],['h','高 h (cm)',12]],run:([l,w,h])=>{const s1=sq(h*h+w*w/4),s2=sq(h*h+l*l/4);return`体积 V=⅓×${f(l)}×${f(w)}×${f(h)}=<b>${f(l*w*h/3)} cm³</b><br>斜高(对长为l的边)=√(${f(h)}²+${f(w/2)}²)=<b>${f(s1)}</b>；斜高(对长为w的边)=√(${f(h)}²+${f(l/2)}²)=<b>${f(s2)}</b><br>表面积 S=${f(l*w)}+${f(l)}×${f(s1)}+${f(w)}×${f(s2)}=<b>${f(l*w+l*s1+w*s2)} cm²</b>`}},
{t:'6.7 直圆锥',th:`<div class="fm">V=${FR(1,3)}πr²h　斜高 l=√(r²+h²)　侧面积=πrl　S=πr²+πrl</div><p>侧面展开是扇形：半径＝斜高l，弧长＝底圆周长2πr，圆心角θ=360°×r/l。</p>`,
ex:[['例题1','r=7，h=9（π=22/7）：V=⅓×22/7×49×9=<b>462 mL</b>。'],['例题3','r=5，斜高13：h=12，V=⅓π×25×12=<b>100π cm³</b>。'],['例题4','r=5，l=13：S=25π+65π=<b>90π cm²</b>。'],['例题5','r=7，h=24，l=25：S=22/7×(49+175)=<b>704 cm²</b>。']],pi:1,fg:([r,h])=>cone(r,h),nt:([r,h])=>coneNet(r,h),
cf:[['r','底圆半径 r (cm)',5],['h','高 h (cm)',12]],run:([r,h],m)=>{const l=sq(r*r+h*h);return`斜高 l=√(${f(r)}²+${f(h)}²)=<b>${f(l)} cm</b><br>体积 V=⅓πr²h=<b>${m(r*r*h/3)} cm³</b><br>侧面积=πrl=<b>${m(r*l)} cm²</b>，表面积 S=πr²+πrl=<b>${m(r*r+r*l)} cm²</b><br>侧面展开扇形圆心角 θ=360°×${f(r)}/${f(l)}=<b>${f(360*r/l)}°</b>`}},
{t:'6.8 球',th:`<div class="fm">V=${FR(4,3)}πr³　S=4πr²　半球表面积＝3πr²</div><p>半径比为 a:b 的两球，表面积比 a²:b²，体积比 a³:b³。</p>`,
ex:[['例题1','r=7：V=4/3×22/7×7³=4312/3≈<b>1437.3 cm³</b>。'],['例题2','球放入半径r、高2r的满水圆柱桶，取出后：剩水=2πr³−4/3πr³=2/3πr³，πr²h=2/3πr³ → 水深h=<b>2r/3</b>。'],['例题3','V=36π：r³=27，r=3，S=4π×9=<b>36π cm²</b>。'],['例题4','半球：½×4πr²+πr²=<b>3πr²</b>。']],pi:1,fg:([r])=>sph(r),
cf:[['r','半径 r (cm)',3]],run:([r],m)=>`体积 V=4/3πr³=4/3×π×${f(r)}³=<b>${m(4/3*r**3)} cm³</b><br>表面积 S=4πr²=<b>${m(4*r*r)} cm²</b><br>半球：体积=<b>${m(2/3*r**3)} cm³</b>，表面积=3πr²=<b>${m(3*r*r)} cm²</b>`}
];
const ST=['⑴','⑵'];
function frac(c,mode){if(mode=='π'){const k=Math.round(c*3);return Math.abs(k-c*3)<1e-9&&k%3?`${k}π/3`:f(c)+'π'}return f(c*(mode=='7'?22/7:3.14))}
function Quiz(el,mkM,mkF,nm,nf,gate,rev){let M,F,rt,dn,fd,fr,bad;
function start(){M=mkM();F=mkF();rt=dn=fd=fr=0;bad=[];el.innerHTML=`<h3>${rev?'总复习测验':'练习'}：${nm}题选择题</h3><div id="m"></div><div id="s"></div><div id="fl"></div><div id="z"></div>`;const m=el.querySelector('#m');
M.forEach((t,i)=>{const d=document.createElement('div');d.className='q';d.innerHTML=`<b>第${i+1}题</b>　${t.q}`+t.o.map((o,j)=>`<button class="o" data-j="${j}">${'ABCD'[j]}. ${t.txt(o.v)}</button>`).join('')+'<div class="r"></div>';
d.onclick=e=>{const b=e.target.closest('.o');if(!b||d.dataset.d)return;d.dataset.d=1;const ok=t.o[b.dataset.j].ok;d.querySelectorAll('.o').forEach((x,j)=>{x.disabled=true;if(t.o[j].ok)x.classList.add('ok')});if(!ok){b.classList.add('bad');bad.push(t.sec)}else rt++;d.querySelector('.r').innerHTML=(ok?'<span class="g">✔ 正确！</span>':'<span class="b">✘ 错误</span>，正确答案：'+t.txt(t.a))+`<br>解析：${t.e}`;if(++dn==nm)mcqDone()};m.append(d)})}
function mcqDone(){const s=el.querySelector('#s');if(rev||rt>=gate){s.innerHTML=`<p><b>选择题 ${rt}/${nm}</b>${rev?'':'　🎉 达标，开启作答题！'}</p>`;showF()}else s.innerHTML=`<p><b>选择题 ${rt}/${nm}</b>　需答对${gate}题以上才能开启作答题，点下方“换一组新题”再试一次。</p>`;el.querySelector('#z').innerHTML='<button id="nb">🔄 换一组新题</button>';el.querySelector('#nb').onclick=start}
function showF(){const x=el.querySelector('#fl');x.innerHTML=`<h3>作答题（自己输入答案）</h3>`;F.forEach((t,i)=>{const d=document.createElement('div');d.className='q';const pi=t.u.startsWith('π');d.innerHTML=`<b>${rev?'第'+(i+1)+'题':ST[i]}</b>　${t.q}${pi?'':'（只填数字，单位：'+t.u.trim()+'）'}<div class="cf"><input type="text" inputmode="decimal" placeholder="答案"><button>提交</button></div><div class="r"></div>`;d.querySelector('button').onclick=()=>{const inp=d.querySelector('input');if(d.dataset.d||!inp.value.trim())return;d.dataset.d=1;let v=inp.value.trim().replace(/[，,\s]/g,''),n=v.includes('/')?v.split('/')[0]/v.split('/')[1]:parseFloat(v);const ok=Math.abs(n-t.a)<0.015;inp.disabled=true;d.querySelector('button').disabled=true;if(ok)fr++;else bad.push(t.sec);d.querySelector('.r').innerHTML=(ok?'<span class="g">✔ 正确！</span>':'<span class="b">✘ 错误</span>，正确答案：'+t.txt(t.a))+`<br>解析：${t.e}`;if(++fd==nf)end()};x.append(d)})}
function end(){const z=el.querySelector('#z');if(!rev){z.insertAdjacentHTML('afterbegin',`<p><b>本节成绩：选择 ${rt}/${nm}，作答 ${fr}/${nf}</b>${rt+fr==nm+nf?' 🌟 全对！':''}</p>`);return}
const sc=rt*6+fr*8,g=sc>=90?['优秀','掌握非常扎实，继续保持！']:sc>=75?['良好','基础不错，留意失分的章节。']:sc>=60?['及格','还需巩固公式与易错点。']:['需加强','建议逐节重做各章练习，再来挑战。'];const w=[...new Set(bad)];z.insertAdjacentHTML('afterbegin',`<div class="out"><h2>总分 ${sc} / 100　${g[0]}</h2>选择题 ${rt}/${nm}（每题6分），作答题 ${fr}/${nf}（每题8分）<br>${g[1]}${w.length?'<br>建议复习：<b>'+w.join('、')+'</b>':'<br>全部答对，太棒了！'}</div>`)}
start()}
function render(i){document.querySelectorAll('nav button').forEach((b,j)=>b.classList.toggle('on',j==i));const m=document.getElementById('main');
if(i==8){m.innerHTML=`<div class="c"><h2>总复习</h2><p>公式速查：</p><div class="fm">立方体 S=6a² V=a³　长方体 S=2(lw+lh+wh) V=lwh<br>直棱柱 V=Sh　S=2S底+C底·h<br>圆柱 V=πr²h　S=2πr²+2πrh<br>棱锥 V=${FR(1,3)}Sh　圆锥 V=${FR(1,3)}πr²h　S=πr²+πrl　l=√(r²+h²)<br>球 V=${FR(4,3)}πr³　S=4πr²　单位：1 m³=10⁶ cm³，1 升=1000 cm³</div></div><div class="c" id="qz"></div>`;
Quiz(document.getElementById('qz'),()=>[...gen(pool().slice(0,6),6,false),...gen(HS,4,false)],()=>[...gen(pool(),3,true),...gen(HS,2,true)],10,5,0,1);return}

const run=()=>{const v=[...m.querySelectorAll('[data-k]')].map(x=>parseFloat(x.value)),o=document.getElementById('co');if(v.some(x=>!(x>0))){o.textContent='请输入大于0的数字。';return}const pm=document.getElementById('pm');o.innerHTML=s.run(v,c=>frac(c,pm?pm.value:'π'));document.getElementById('fg').innerHTML=s.fg?'<b>立体图</b><br>'+s.fg(v):'';document.getElementById('nt').innerHTML=s.nt?'<b>展开图</b><br>'+s.nt(v):''};
m.querySelectorAll('input,select').forEach(x=>x.oninput=run);document.getElementById('go').onclick=run;run();
