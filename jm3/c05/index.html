<script>
const R=(a,b)=>Math.floor(Math.random()*(b-a+1))+a,P=a=>a[R(0,a.length-1)],sh=a=>a.slice().sort(()=>Math.random()-.5),F=n=>String(+(+n).toFixed(2));
const $=s=>document.querySelector(s);
const NT='(?:\\([^()]*\\)|\\d+(?:\\.\\d+)?|[A-Za-z][A-Za-z0-9]*)²?',FR=new RegExp('('+NT+')\\s?/\\s?('+NT+')','g');
const RAD='<svg class="sg" viewBox="0 0 10 20" preserveAspectRatio="none"><path d="M0 13L2 11.5L5 19L10 0" fill="none" stroke="currentColor" stroke-width="1.5" vector-effect="non-scaling-stroke"/></svg>';
const un=t=>/^\(.*\)$/.test(t)?t.slice(1,-1):t;
function fx(h){h=h.split(/(<[^>]*>)/).map(x=>x[0]=='<'?x:x.replace(FR,(m,a,b)=>`<span class="fr"><span>${un(a)}</span><span>${un(b)}</span></span>`)).join('');
 return h.replace(/√\(([^()]*)\)/g,'<span class="rt">'+RAD+'<span>$1</span></span>').replace(/√([\w.\u4e00-\u9fa5]+)/g,'<span class="rt">'+RAD+'<span>$1</span></span>')}

let FS=17;try{FS=+localStorage.fs||17;document.documentElement.dataset.theme=localStorage.th||'dark'}catch(e){document.documentElement.dataset.theme='dark'}

function th(){const h=document.documentElement,v=h.dataset.theme=='dark'?'light':'dark';h.dataset.theme=v;try{localStorage.th=v}catch(e){}}
fs(FS?FS>17?1:0:0);document.documentElement.style.setProperty('--fs',FS+'px');
/* ---------- 题目引擎 ---------- */
const u='cm';
const G1=[
()=>{const A=P([15,30,45,60]),B=P([10,20,30]),H=R(4,9)*P([1,5]),a=A*H/B;return{q:`一座建筑物底部是边长${A}m的正方形。模型底部边长${B}cm，模型高${H}cm，求建筑物的实际高度(m)。`,a,u:'m',e:`实际高 ÷ ${H} = ${A}m ÷ ${B}cm ⇒ ${A}×${H}÷${B} = ${F(a)} m`}},
()=>{const m=P([1.5,2,2.5,3]),L=P([4,6,8,10]),W=P([2,4,6,8]),a=W*m;return{q:`长方形ABCD长${L}cm、宽${W}cm，与长方形PQRS相似。PQRS的长为${F(L*m)}cm，求其宽(cm)。`,a,u,e:`相似比 = ${F(L*m)}÷${L} = ${m}，宽 = ${W}×${m} = ${F(a)} cm`}},
()=>{const A=R(70,110),B=R(70,120),C=R(60,110),a=360-A-B-C;return{q:`四边形ABCD∽四边形EFGH，∠A=${A}°，∠B=${B}°，∠C=${C}°，求∠H(°)。`,a,u:'°',e:`∠H=∠D，四边形内角和360°：360−${A}−${B}−${C} = ${a}°`}},
()=>{const p=R(3,5),q=R(1,p-1),t=R(2,6);return{q:`两个相似图形的相似比为${p}:${q}，第一个图形的一边长${p*t}cm，求第二个图形的对应边长(cm)。`,a:q*t,u,e:`对应边成比例：${p*t}×${q}÷${p} = ${q*t} cm`}}];
const G2=[
()=>{const a=R(2,6),b=R(2,6),t=R(1,3);return{q:`△ABC中，DE∥BC，D在AB上，E在AC上，AD=${a}cm，DB=${b}cm，AC=${(a+b)*t}cm，求AE(cm)。`,a:a*t,u,e:`△ADE∽△ABC：AE/AC = AD/AB ⇒ AE = ${a}×${(a+b)*t}÷${a+b} = ${a*t} cm`}},
()=>{const a=R(2,6),b=R(2,6),t=R(1,3);return{q:`△ABC中，DE∥BC，AD=${a}cm，DB=${b}cm，BC=${(a+b)*t}cm，求DE(cm)。`,a:a*t,u,e:`DE/BC = AD/AB ⇒ DE = ${(a+b)*t}×${a}÷${a+b} = ${a*t} cm`}},
()=>{const h=R(1,4),s=P([2,3,4]),k=R(5,30);return{q:`木杆长${h}m，影长${s}m；同一时刻一座塔的影长${s*k}m，求塔高(m)。`,a:h*k,u:'m',e:`光线平行⇒△相似：设塔高H：H/${s*k} = ${h}/${s} ⇒ ${h}×${s*k}÷${s} = ${h*k} m`}},
()=>{const T=P([[3,4,5],[6,8,10],[9,12,15],[5,12,13],[15,20,25]]),[x,y,z]=T,w=R(0,2);const a=[x*y/z,x*x/z,y*y/z][w];return{q:`直角△ABC中，∠A=90°，AB=${x}cm，AC=${y}cm，AD⊥BC于D。求${['AD','BD','CD'][w]}(cm)(答案取至多2位小数)。`,a:+a.toFixed(2),u,e:`BC=${z}。△DBA∽△ABC∽△DAC：BD=AB²/BC，CD=AC²/BC，AD=(AB·AC)/BC ⇒ ${F(a)} cm`}},
()=>{const m=3*R(2,8);return{q:`G是△ABC的重心，中线AD=${m}cm，求AG(cm)。`,a:2*m/3,u,e:`重心把中线分成2:1，AG = 2/3×${m} = ${2*m/3} cm`}},
()=>{const a=R(2,5),b=R(2,5),t=R(1,3);return{q:`梯形ABCD中，AB∥DC，对角线AC、BD交于E，AB=${a*2}cm，CD=${b*2}cm，AC=${(a+b)*2*t}cm，求AE(cm)。`,a:a*2*t,u,e:`△EAB∽△ECD：AE/EC = AB/CD = ${a}:${b} ⇒ AE = ${(a+b)*2*t}×${a}÷${a+b} = ${a*2*t} cm`}}];
const G3=[
()=>{const q=R(2,4),p=q+R(1,3),S=q*q*R(1,4);return{q:`两个相似多边形边长之比为${p}:${q}，小的面积为${S}cm²，求大的面积(cm²)。`,a:S*p*p/q/q,u:'cm²',e:`面积比=相似比²：${S}×(${p}/${q})² = ${F(S*p*p/q/q)} cm²`}},
()=>{const a=R(2,5),b=R(1,4),t=R(1,5),w=R(0,1),A=a*a*t;return{q:`△ABC中，DE∥BC，AD=${a}cm，DB=${b}cm，△ADE面积=${A}cm²，求${w?'梯形BCED':'△ABC'}的面积(cm²)。`,a:w?(a+b)**2*t-A:(a+b)**2*t,u:'cm²',e:`△ABC面积=${A}×(${a+b}/${a})²=${(a+b)**2*t}${w?`，梯形=${(a+b)**2*t}−${A}=${(a+b)**2*t-A}`:''} cm²`}},
()=>{const x=P([10,20,30,50]),a=(1+x/100)**2*100-100;return{q:`正方形的边长增加${x}%，它的面积增加了百分之几？`,a:+a.toFixed(2),u:'%',e:`新面积=(1+${x}%)²=${F((1+x/100)**2)}倍 ⇒ 增加${F(a)}%`}},
()=>{const p=R(2,6),q=R(2,6),t=R(1,3);return{q:`△ABC中，AB=${p}cm，AC=${q}cm，BC=${(p+q)*t}cm，∠A的平分线交BC于D，求BD(cm)。`,a:p*t,u,e:`角平分线定理：BD/CD=AB/AC=${p}:${q} ⇒ BD=${(p+q)*t}×${p}÷${p+q}=${p*t} cm`}},
()=>{const q=R(2,5),p=q+R(1,3),t=R(1,3);return{q:`两个相似正六边形的面积之比为${p*p}:${q*q}，小的边长${q*t}cm，求大的边长(cm)。`,a:p*t,u,e:`边长比=√面积比=${p}:${q} ⇒ 大边=${q*t}×${p}÷${q}=${p*t} cm`}}];
const GH=[
()=>{const p=R(2,3),q=p+R(1,2),k=R(1,4);return{q:`梯形ABCD中，DC∥AB，对角线交于E。△CDE与△ABE的面积之比为${p*p}:${q*q}，且△CDE面积为${p*p*k}cm²，求梯形ABCD的面积(cm²)。`,a:(p+q)**2*k,u:'cm²',e:`DE:BE=${p}:${q}。△BCE=△ADE=${p*q*k}。总面积=${p*p*k}+${q*q*k}+2×${p*q*k}=${(p+q)**2*k} cm²`}},
()=>{const a=R(5,12)*2,b=R(2,8)*2;return{q:`AB∥MN∥DC，M在AD上且DM=AM，N在BC上，AB=${a}cm，CD=${b}cm，求MN(cm)。`,a:(a+b)/2,u,e:`连AC交MN于P：MP=½CD，PN=½AB ⇒ MN=(${a}+${b})/2=${(a+b)/2} cm`}},
()=>{const k=R(2,4);return{q:`△ABC中，DE∥BC，△ADE与梯形BCED的面积之比为${k*k}:${2*k+1}，求AE:EC的比值(AE÷EC)。`,a:k,u:'',e:`△ADE:△ABC=${k*k}:${(k+1)**2} ⇒ AE:AC=${k}:${k+1} ⇒ AE:EC=${k}:1，比值=${k}`}}];
const GALL=[...G1,...G2,...G3];
function opts(a){let c=[a+1,a-1,a*2,a/2,a+2,a*1.5,a+3,a-2,a*.8,a+5].map(x=>+x.toFixed(2)).filter(x=>x>0&&x!=a);return sh([a,...sh([...new Set(c)]).slice(0,3)])}
function quiz(el,gens,nm,nf,gate,fg){
 fg=fg||gens;el.innerHTML='';const used=new Set();let done=0,ok=0,fd=0,fk=0;
 const mk=g=>{let r,i=0;do r=P(g)();while(used.has(r.q)&&i++<30);used.add(r.q);return r};
 const wm=nf&&!gate?6:1,wf=nf&&!gate?8:1,post=document.createElement('div'),fill=document.createElement('div');
 for(let i=0;i<nm;i++){const g=mk(gens),c=document.createElement('div');c.className='card';
  c.innerHTML=`<b>选择题 ${i+1}.</b> ${fx(g.q)}<div class="opts">${opts(g.a).map(o=>`<button data-v="${o}">${F(o)} ${g.u}</button>`).join('')}</div><div class="exp" hidden></div>`;
  c.querySelectorAll('button').forEach(b=>b.onclick=()=>{c.querySelectorAll('button').forEach(x=>{x.disabled=true;if(+x.dataset.v==g.a)x.classList.add('ok')});
   const right=+b.dataset.v==g.a;if(!right)b.classList.add('bad');else ok++;done++;const x=c.querySelector('.exp');x.hidden=false;x.innerHTML=`<b class="${right?'good':'wrong'}">${right?'✔ 正确！':'✘ 错误，正确答案：'+F(g.a)+' '+g.u}</b><br>${fx(g.e)}`;if(done==nm)after()});
  el.appendChild(c)}
 el.appendChild(post);el.appendChild(fill);
 function again(){const b=document.createElement('button');b.textContent='🔄 换一批新题';b.onclick=()=>quiz(el,gens,nm,nf,gate,fg);return b}
 function after(){if(nf&&(!gate||ok>=gate)){post.innerHTML=`<div class="card">选择题答对 <b>${ok}/${nm}</b>${gate?' ，达标！请完成作答题 👇':'，请继续完成填充题 👇'}</div>`;showFill()}
  else if(nf){post.innerHTML=`<div class="card">选择题答对 <b class="wrong">${ok}/${nm}</b>，需答对${gate}题以上才能挑战作答题。回看上面的例题再试一次吧！</div>`;post.appendChild(again())}
  else end()}
 function showFill(){for(let i=0;i<nf;i++){const g=mk(fg),c=document.createElement('div');c.className='card';
  c.innerHTML=`<b>${gate?'作答题':'填充题'} ${i+1}.</b> ${fx(g.q)}<div style="margin-top:6px"><input type="number" step="any"> ${g.u} <button>提交</button></div><div class="exp" hidden></div>`;
  c.querySelector('button').onclick=function(){const inp=c.querySelector('input');if(inp.value==='')return;const right=Math.abs(+inp.value-g.a)<.011;inp.disabled=this.disabled=true;if(right)fk++;fd++;
   const x=c.querySelector('.exp');x.hidden=false;x.innerHTML=`<b class="${right?'good':'wrong'}">${right?'✔ 正确！':'✘ 错误，正确答案：'+F(g.a)+' '+g.u}</b><br>${fx(g.e)}`;if(fd==nf)end()};fill.appendChild(c)}}
 function end(){const d=document.createElement('div');d.className='card';
  if(wm>1){const s=ok*wm+fk*wf,m=s>=90?'🏆 优秀！掌握非常扎实':s>=75?'👍 良好，再巩固个别细节':s>=60?'🙂 及格，建议重做错题并回看各节例题':'💪 需加油，请逐节重新学习例题与计算器';
   d.innerHTML=`<h2>总评</h2>选择题 ${ok}/${nm}（${ok*wm}分）　填充题 ${fk}/${nf}（${fk*wf}分）<h2>总分：${s} / 100</h2>${m}`}
  else d.innerHTML=`<h2>本节完成</h2>选择题 ${ok}/${nm}，作答题 ${fk}/${nf}。点下方按钮可再来一批不同的题目。`;
  d.appendChild(document.createElement('br'));d.appendChild(again());post.appendChild(d)}
}
/* ---------- 计算器 ---------- */
const poly=(pts,c='sh')=>`<polygon class="${c}" points="${pts.map(p=>p.join(',')).join(' ')}"/>`,tx=(x,y,s,a='middle')=>`<text class="t" x="${x}" y="${y}" text-anchor="${a}">${s}</text>`;
function tri(ox,s,lb,ll){const w=100*s,h=80*s,y=125;return poly([[ox,y],[ox+w,y],[ox+w*.35,y-h]])+tx(ox+w/2,y+16,lb)+tx(ox+w*.17-6,y-h/2,ll,'end')}
const CALC=[
{t:'相似图形：求对应边',f:[['a','图1某边 a',6],['b','图2对应边 b',9],['x','图1另一边 x',8]],run:v=>{const k=v.b/v.a,y=v.x*v.b/v.a,m=Math.max(1,k);return{s:[`相似比 图1:图2 = ${F(v.a)} : ${F(v.b)} = 1 : <span class=hl>${F(k)}</span>`,`对应边成比例：x / y = a / b`,`y = x × b ÷ a = ${F(v.x)} × ${F(v.b)} ÷ ${F(v.a)} = <span class=hl>${F(y)}</span>`,`面积比 = 相似比² = 1 : <span class=hl>${F(k*k)}</span>`],g:`<svg viewBox="0 0 360 150">${tri(20,1/m,'a='+F(v.a),'x='+F(v.x))}${tri(190,k/m,'b='+F(v.b),'y='+F(y))}</svg>`}}},
{t:'DE∥BC：平行线截比例线段',f:[['ad','AD',4],['db','DB',5],['ac','AC',12],['bc','BC (可填0)',0]],run:v=>{const ab=v.ad+v.db,ae=v.ad*v.ac/ab,ec=v.ac-ae,de=v.bc>0?v.bc*v.ad/ab:0,t=v.ad/ab,A=[150,12],B=[30,130],C=[280,130],D=[A[0]+(B[0]-A[0])*t,A[1]+(B[1]-A[1])*t],E=[A[0]+(C[0]-A[0])*t,A[1]+(C[1]-A[1])*t];
 return{s:[`DE∥BC ⇒ △ADE∽△ABC（两组角对应相等）`,`AB = AD + DB = ${F(ab)}`,`AD/AB = AE/AC ⇒ AE = ${F(v.ad)}×${F(v.ac)}÷${F(ab)} = <span class=hl>${F(ae)}</span>`,`EC = AC − AE = <span class=hl>${F(ec)}</span>`,de?`DE = BC×AD÷AB = <span class=hl>${F(de)}</span>`:'(填入BC可求DE)'],
