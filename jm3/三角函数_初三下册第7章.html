function c71(e){let g=n=>{let v=+val(e,n);return v>0&&Number.isInteger(v)?v*v:0},O=g('o'),A=g('a'),H=g('h');if(!!O+!!A+!!H<2)return'请至少填入两条边（正整数），第三条留空。';let s='';
