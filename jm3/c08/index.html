<script>
const $=s=>document.querySelector(s);
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1)),P=a=>a[R(0,a.length-1)];
const SH=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=R(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
const rad=d=>d*Math.PI/180,deg=r=>r*180/Math.PI,f2=x=>+x.toFixed(2),fmt=x=>Number.isInteger(x)?x:+x.toFixed(2);
/* ============ 题目生成引擎 ============ */
const TR=[[3,4,5],[5,12,13],[8,15,17],[7,24,25],[20,21,29]];
const trip=()=>{const t=P(TR),k=t[2]<=17?P([1,1,2]):1,s=SH([t[0]*k,t[1]*k]);return[s[0],s[1],t[2]*k]};
const Q=(q,a,e,u)=>({q,a,e,u});
const PAR=[[13,24,10],[5,8,6],[10,16,12],[17,30,16],[25,48,14]];
const g1=[
()=>{const n=P([3,4,5,6,8,9,10,12]),a=360/n;return Q(`圆O上的点把圆 ${n} 等分，相邻两个分点与圆心连线所夹的圆心角是多少？`,a,`360°÷${n}＝${a}°（等弧对等圆心角）`,'°')},
()=>{const a=5*R(4,16);return Q(`⊙O中，弦AB＝弦BC，∠AOB＝${a}°，求∠AOC。`,2*a,`等弦对等圆心角：∠BOC＝∠AOB＝${a}°，∠AOC＝${a}°+${a}°＝${2*a}°`,'°')},
()=>{const k=R(3,15);return Q(`⊙O中，弦AB＝弦BC，弧BC长 ${k} cm，求弧AC的长。`,2*k,`等弦对等弧：弧AB＝弧BC＝${k} cm，弧AC＝${2*k} cm`,' cm')},
()=>{const n=P([3,4,5,6,9,10]),k=R(1,n-1),a=180*k/n;return Q(`AD是⊙O的直径，半圆被分成 ${n} 段相等的弧，点B是从A数起第 ${k} 个分点，求∠AOB。`,a,`每段弧对应 180°÷${n}＝${180/n}°，共 ${k} 段：${a}°`,'°')},
()=>{const m=R(3,12);return Q(`同圆中，∠AOB＝∠COD，OM⊥AB于M，ON⊥CD于N，OM＝${m} cm，求ON。`,m,`圆心角相等 ⇒ 弦相等 ⇒ 弦心距相等：ON＝OM＝${m} cm`,' cm')}];
const g2=[
()=>{const t=2*R(10,85);return Q(`O为圆心，弧BC所对的圆心角∠BOC＝${t}°，求同弧所对的圆周角∠BAC。`,t/2,`圆周角＝½圆心角＝½×${t}°＝${t/2}°`,'°')},
()=>{const a=R(15,85);return Q(`O为圆心，弧BC所对的圆周角∠BAC＝${a}°，求圆心角∠BOC（劣角）。`,2*a,`圆心角＝2×圆周角＝${2*a}°`,'°')},
()=>{const t=10*R(21,32);return Q(`O为圆心，优角∠BOC＝${t}°，点A在优弧BC上，求圆周角∠BAC。`,(360-t)/2,`劣角∠BOC＝360°−${t}°＝${360-t}°，圆周角＝½×${360-t}°＝${(360-t)/2}°`,'°')},
()=>{const a=R(20,70);return Q(`AB是⊙O的直径，C在圆上，∠CAB＝${a}°，求∠ABC。`,90-a,`半圆含直角：∠ACB＝90°，∠ABC＝90°−${a}°＝${90-a}°`,'°')},
()=>{const p=R(30,70),q=R(30,70);return Q(`A、B、C、D在同一圆上，C、D在弦AB同侧，∠ACB＝${p}°，∠DAB＝${q}°，求△ABD中的∠ABD。`,180-p-q,`同弧圆周角相等：∠ADB＝${p}°，∠ABD＝180°−${p}°−${q}°＝${180-p-q}°`,'°')},
()=>{const s=P([2,3,4]),bc=R(3,6),cd=R(3,8);return Q(`弦AD、BE相交于C，△ABC∽△EDC。AB＝${s*bc} cm，BC＝${bc} cm，DE＝${s*cd} cm，求CD。`,cd,`CD/BC＝DE/AB ⇒ CD＝${s*cd}÷${s*bc}×${bc}＝${cd} cm`,' cm')}];
const g3=[
()=>{const[h,d,r]=trip();return Q(`⊙O的半径为 ${r} cm，弦AB＝${2*h} cm，OM⊥AB于M，求弦心距OM。`,d,`AM＝½AB＝${h} cm，OM＝√(${r}²−${h}²)＝${d} cm`,' cm')},
()=>{const[h,d,r]=trip();return Q(`⊙O的半径为 ${r} cm，弦心距为 ${d} cm，求弦AB的长。`,2*h,`AM＝√(${r}²−${d}²)＝${h} cm，AB＝${2*h} cm`,' cm')},
()=>{const[h,d,r]=trip();return Q(`⊙O中，弦AB＝${2*h} cm，弦心距为 ${d} cm，求圆的半径。`,r,`AM＝${h} cm，r＝√(${h}²+${d}²)＝${r} cm`,' cm')},
()=>{const[r,a,c]=P(PAR),d1=Math.round(Math.sqrt(r*r-a*a/4)),d2=Math.round(Math.sqrt(r*r-c*c/4)),o=Math.random()<.4,v=o?d1+d2:Math.abs(d1-d2);return Q(`⊙O的半径为 ${r} cm，弦AB∥弦CD，AB＝${a} cm，CD＝${c} cm，两弦在圆心${o?'的两侧':'的同一侧'}，求AB与CD的距离。`,v,`圆心到两弦的距离分别是 ${d1} cm、${d2} cm，距离＝${o?d1+'+'+d2:d1+'与'+d2+'之差'}＝${v} cm`,' cm')},
()=>{const[h,d,r]=trip();return Q(`直径为 ${2*r} mm 的圆铁片，切去一块高为 ${r-d} mm 的弓形，求弦AB的长。`,2*h,`圆心到弦的距离＝${r}−${r-d}＝${d} mm，AB＝2√(${r}²−${d}²)＝${2*h} mm`,' mm')},
()=>{const k=R(1,2),p=R(1,3),q=R(p+1,4),a=k*p*p,b=k*q*q,r=(a+b)/2,oe=r-a,ae=k*p*q;return Q(`直径CD⊥弦AB于E，CE＝${a} cm，DE＝${b} cm，求AB的长。`,2*ae,`半径＝(${a}+${b})÷2＝${r}，OE＝${r}−${a}＝${oe}，AE＝√(${r}²−${oe}²)＝${ae}，AB＝${2*ae} cm`,' cm')}];
const g4=[
()=>{const a=R(55,120);return Q(`四边形ABCD内接于圆，∠B＝${a}°，求∠D。`,180-a,`圆内接四边形对角互补：∠D＝180°−${a}°＝${180-a}°`,'°')},
()=>{const a=R(60,120);return Q(`圆内接四边形ABCD，延长BC至E，∠BAD＝${a}°，求外角∠DCE。`,a,`圆内接四边形的外角等于它的内对角：∠DCE＝∠BAD＝${a}°`,'°')},
()=>{const t=2*R(35,80);return Q(`O为圆心，圆上A、B、C、D依次排列，劣角∠AOC＝${t}°，B在优弧AC上，求∠ADC。`,180-t/2,`∠ABC＝½×${t}°＝${t/2}°，对角互补：∠ADC＝${180-t/2}°`,'°')},
()=>{for(;;){const p=R(1,4),r=R(1,6),q=R(1,6);if(p!=r&&180%(p+r)==0&&q*180/(p+r)<180){const k=180/(p+r);return Q(`圆内接四边形ABCD中，∠A:∠B:∠C＝${p}:${q}:${r}，求∠D。`,180-q*k,`∠A+∠C＝180°，每份＝180°÷${p+r}＝${k}°，∠B＝${q*k}°，∠D＝${180-q*k}°`,'°')}}},
()=>{for(;;){const a=R(2,6),b=R(3,8),c=R(2,8),rt=(a+b)*b/c;if(Number.isInteger(rt)&&rt>c)return Q(`PQRS是圆内接四边形，QPT与RST是直线。QP＝${a}，PT＝${b}，ST＝${c}，求RS。`,rt-c,`△TPS∽△TRQ：RT/PT＝QT/ST ⇒ RT＝${a+b}×${b}÷${c}＝${rt}，RS＝${rt}−${c}＝${rt-c}`,'')}},
()=>{const p=R(30,60),q=R(30,60);return Q(`ABCD是圆内接四边形，∠ABD＝${p}°，∠ADB＝${q}°，求∠BCD。`,p+q,`∠BAD＝180°−${p}°−${q}°＝${180-p-q}°，∠BCD＝180°−${180-p-q}°＝${p+q}°`,'°')}];
const g5=[
()=>{const a=R(20,70);return Q(`AB是⊙O的切线，A为切点，∠AOB＝${a}°，求∠ABO。`,90-a,`切线⊥过切点的半径：∠OAB＝90°，∠ABO＝90°−${a}°＝${90-a}°`,'°')},
()=>{const[r,t,D]=trip();return Q(`⊙O的半径为 ${r} cm，圆外一点P，OP＝${D} cm，PT切⊙O于T，求切线长PT。`,t,`OT⊥PT，PT＝√(${D}²−${r}²)＝${t} cm`,' cm')},
()=>{const t=R(30,150);return Q(`PA、PB切⊙O于A、B，∠APB＝${t}°，求∠AOB。`,180-t,`四边形OAPB中∠OAP＝∠OBP＝90°，∠AOB＝360°−180°−${t}°＝${180-t}°`,'°')},
()=>{const t=2*R(20,80);return Q(`PA、PB切⊙O于A、B，∠AOB＝${t}°，求∠OPA。`,(180-t)/2,`∠APB＝180°−${t}°，OP平分∠APB：∠OPA＝${(180-t)/2}°`,'°')},
()=>{const[r,t]=trip();return Q(`PX、PY切⊙O于X、Y，PX＝${t} cm，OX＝${r} cm，求风筝形OXPY的面积。`,r*t,`面积＝2×½×${t}×${r}＝${r*t} cm²`,' cm²')},
()=>{const a=R(3,9),b=R(3,8),c=R(a+3,a+10);return Q(`△ABC的三边与圆相切，X在AB上、Y在BC上、Z在CA上为切点。AX＝${a} cm，BY＝${b} cm，CA＝${c} cm，求BC。`,b+c-a,`AZ＝AX＝${a}，CY＝CZ＝${c}−${a}＝${c-a}，BC＝${b}+${c-a}＝${b+c-a} cm`,' cm')},
()=>{const bc=R(5,12),ap=R(2,9),C=2*(ap+bc);return Q(`△ABC的周长为 ${C} cm，BC＝${bc} cm，三边与圆相切，P在AB上为切点，求AP。`,ap,`周长＝2AP+2BC ⇒ AP＝${C}÷2−${bc}＝${ap} cm`,' cm')}];
const g6=[
()=>{const a=R(25,80);return Q(`AB切⊙O于T，弦TQ，弦切角∠ATQ＝${a}°，求弦切角所夹的弧TQ所对的圆周角。`,a,`弦切角等于所夹弧所对的圆周角：${a}°`,'°')},
()=>{const t=2*R(15,85);return Q(`AB切⊙O于T，弦TQ，弦切角∠ATQ所夹的弧TQ的圆心角为 ${t}°，求∠ATQ。`,t/2,`弦切角＝½×弧的圆心角＝${t/2}°`,'°')},
()=>{const t=2*R(20,70);return Q(`PA、PB切⊙O于A、B，∠APB＝${t}°，求弦切角∠PAB。`,(180-t)/2,`PA＝PB（切线长定理），∠PAB＝(180°−${t}°)÷2＝${(180-t)/2}°`,'°')},
()=>{const a=R(30,70),b=R(30,70);return Q(`AB切⊙O于T，C、D在圆上，D在弦TC的另一侧（与弦切角所夹的弧相对），弦切角∠ATC＝${a}°，∠DTC＝${b}°，求∠TCD。`,180-a-b,`∠TDC＝∠ATC＝${a}°（弦切角定理），∠TCD＝180°−${a}°−${b}°＝${180-a-b}°`,'°')},
()=>{const t=R(40,80);return Q(`PA、PB切⊙O于A、B，点Q在优弧AB上，∠AQB＝${t}°，求∠APB。`,180-2*t,`∠AOB＝2×${t}°＝${2*t}°，∠APB＝180°−${2*t}°＝${180-2*t}°`,'°')},
()=>{const a=R(30,80);return Q(`AB切⊙O于T，弦TQ，弦切角∠ATQ＝${a}°，R是劣弧TQ上的点，求圆周角∠TRQ。`,180-a,`R在所夹弧上，∠TRQ对着优弧：½(360°−2×${a}°)＝${180-a}°`,'°')}];
const SEC=[g1,g2,g3,g4,g5,g6];
const H=[
()=>{const[h,d,r]=trip();return Q(`圆的弦AB＝${2*h} cm，弦AB的弦心距为 ${d} cm，求此圆的直径。`,2*r,`半径＝√(${h}²+${d}²)＝${r} cm，直径＝${2*r} cm`,' cm')},
()=>{const[a,b,c]=trip();return Q(`圆的直径AB＝${c} cm，弦AC＝${a} cm，求△ABC的面积。`,a*b/2,`∠ACB＝90°，BC＝√(${c}²−${a}²)＝${b} cm，面积＝½×${a}×${b}＝${a*b/2} cm²`,' cm²')},
()=>{const[r,e,t]=P([[3,2,4],[8,2,6],[15,2,8],[5,8,12],[12,8,16]]);return Q(`PA切⊙O于A，直线PO交圆于B（B在P与O之间），PA＝${t} cm，PB＝${e} cm，求半径。`,r,`设半径r：OP＝r+${e}，(r+${e})²＝r²+${t}²，解得 r＝${r} cm`,' cm')},

{id:'8.2',n:'圆周角',calc:C2,g:g2,pts:'<b>圆周角</b>：顶点在圆上，两边都是圆的弦。<div class="key"><b>圆周角定理</b>：一条弧所对的圆周角＝它所对圆心角的一半。（证明分圆心在角的一边上、内部、外部三种情况）</div><div class="key"><b>推论①</b> 半圆（直径）所对的圆周角是直角；90°的圆周角所对的弦是直径。<br><b>推论②</b> 同弧或等弧所对的圆周角相等；同圆中相等的圆周角所对的弧也相等。<br>⚠ 同弦所对的圆周角不一定相等（点在弦的两侧时互补）。</div>',
 ex:[['例题1 圆周角＝½圆心角','O为圆心，求x：(a)圆心角50° (b)70° (c)200° (d)优角280°','(a) x＝½×50°＝<b>25°</b><br>(b) x＝½×70°＝<b>35°</b><br>(c) x＝½×200°＝<b>100°</b><br>(d) 劣角∠BOC＝360°−280°＝80°，x＝½×80°＝<b>40°</b>'],
 ['例题2 圆心角＝2×圆周角','O为圆心，求x：(a)圆周角50° (b)40° (c)130° (d)35°','(a) x＝50°×2＝<b>100°</b><br>(b) x＝40°×2＝<b>80°</b><br>(c) 优角∠BOC＝130°×2＝260°，x＝360°−260°＝<b>100°</b><br>(d) 劣角∠BOC＝35°×2＝70°，x＝360°−70°＝<b>290°</b>'],
 ['例题3 同弧与半圆','O为圆心，求x：(a)∠ABD＝35° (b)AB是直径，∠A＝32°','(a) x＝∠ABD＝<b>35°</b>（同弧所对的圆周角相等）<br>(b) ∠ACB＝90°（半圆含直角），x＝90°−32°＝<b>58°</b>'],
 ['例题4(a) 综合','O为圆心，AC是直径，∠BCA＝25°，求圆心角x及圆周角y。','x＝25°×2＝<b>50°</b><br>∠ABC＝90°，y＝90°−25°＝<b>65°</b>'],

 ['例题6 圆周角与相似','弦AE、BD交于C。(a)证明△ABC∽△EDC；(b)AB＝8，BC＝6，AC＝5，DE＝12，求CD、CE。','(a) ∠ABE＝∠ADE，∠BAD＝∠BED（同弧）⇒ 两组角对应相等 ⇒ △ABC∽△EDC<br>(b) CD/BC＝DE/AB ⇒ CD＝12/8×6＝<b>9 cm</b><br>CE/AC＝DE/AB ⇒ CE＝12/8×5＝<b>7.5 cm</b>']]},
{id:'8.3',n:'垂径定理',calc:C3,g:g3,pts:'<div class="key"><b>垂径定理</b>：圆内垂直于弦的直径，平分这条弦，并平分弦所对的圆心角与弧。<br>逆定理：平分非直径的弦的直径，垂直于这条弦。</div>常用模型：半径 r、弦的一半 AM、弦心距 OM 构成直角三角形：<b>r²＝AM²＋OM²</b>。<br><span class="mut">思考：为什么被平分的弦不能是直径？（任意两条直径都互相平分，却不一定垂直。）</span>',
 ex:[['例题1 求弦心距','⊙O半径13 cm，AB＝10 cm，OM⊥AB，求OM。','AM＝½AB＝5 cm，OA＝13 cm<br>OM＝√(13²−5²)＝<b>12 cm</b>'],
 ['例题2 弦心距','⊙O半径5 cm，弦AB＝8 cm，求弦AB的弦心距。','M为AB中点，AM＝4 cm，OM⊥AB<br>弦心距OM＝√(5²−4²)＝<b>3 cm</b>'],
 ['例题3 平行弦的距离','半径13 cm，AB∥CD，AB＝24 cm，CD＝10 cm，求AB与CD之间的距离。','AM＝12，OM＝√(13²−12²)＝5 cm<br>CN＝5，ON＝√(13²−5²)＝12 cm<br>MN＝ON−OM＝12−5＝<b>7 cm</b>（两弦在圆心同侧；若在异侧则相加）'],
 ['例题4 求弦长','OM⊥AB，ON⊥CD，AB＝8，OM＝4，ON＝2，求CD。','AM＝4，OA＝√(4²+4²)＝√32 cm<br>CN＝√((√32)²−2²)＝√28＝2√7<br>CD＝2×CN＝<b>4√7 cm</b>']]},
{id:'8.4',n:'圆内接四边形',calc:C4,g:g4,pts:'四个顶点都在同一个圆上的四边形，叫<b>圆内接四边形</b>。<div class="key"><b>定理</b>：圆内接四边形的对角互补（∠A＋∠C＝180°，∠B＋∠D＝180°）。<br>逆定理：对角互补的四边形是圆内接四边形。<br><b>推论</b>：圆内接四边形的外角＝它的内对角。</div>',
 ex:[['例题1 求角','(a)∠A＝65°、∠B＝80°，求∠C＝x、∠D＝y (b)劣角∠AOC＝140°，B在优弧、D在劣弧上，求x＝∠B、y＝∠D (c)∠BAD＝75°，延长BC至E，求外角x＝∠DCE及圆心角y＝∠BOD','(a) x＝180°−65°＝<b>115°</b>；y＝180°−80°＝<b>100°</b>（对角互补）<br>(b) 圆周角＝½×140°＝70°；y＝180°−70°＝<b>110°</b><br>(c) x＝<b>75°</b>（外角＝内对角）；y＝75°×2＝<b>150°</b>'],
 ['例题2 相似三角形','PQRS是圆内接四边形，QPT、RST是直线。(a)证明△TPS∽△TRQ；(b)QP＝3，PT＝5，ST＝4，求RS。','(a) ∠T公共；∠TPS＝∠TRQ（外角＝内对角）⇒ △TPS∽△TRQ<br>(b) RT/PT＝QT/ST ⇒ RT＝8×5÷4＝10，RS＝10−4＝<b>6</b>'],
 ['例题3 证明DB＝DC','ABCD是圆内接四边形，AD平分∠CAE，证明DB＝DC。','∠EAD＝∠DCB（外角＝内对角）；∠DAC＝∠DBC（同弧）<br>AD平分∠CAE ⇒ ∠EAD＝∠DAC ⇒ ∠DCB＝∠DBC<br>等角对等边：DB＝DC ∎']]},
{id:'8.5',n:'直线与圆',calc:C5,g:g5,pts:'圆心到直线的距离 d 与半径 r：<b>d＞r</b> 相离；<b>d＝r</b> 相切（唯一公共点叫切点，直线叫切线）；<b>d＜r</b> 相交（直线叫割线）。<div class="key"><b>切线性质</b>：圆的切线⊥过切点的半径。<b>切线判定</b>：经过半径外端且垂直于该半径的直线是圆的切线。</div><div class="key"><b>切线长定理</b>：圆外一点到圆的两条切线长相等；该点与圆心的连线平分两切线的夹角。</div>圆外切三角形：设切点把各边分成的线段，同一顶点引出的切线长相等，周长＝2×(三段不同的切线长之和)。',
 ex:[['例题1 切线⊥半径','ABC切⊙O于B，求x：(a)弦切角∠CBD＝35°，x＝∠OBD (b)圆周角∠BED＝25°，O、D、C在一条直线上，x＝∠OCB','(a) ∠ABO＝90°，x＝90°−35°＝<b>55°</b><br>(b) ∠BOD＝25°×2＝50°，∠ABO＝90° ⇒ x＝90°−50°＝<b>40°</b>'],
 ['例题2 勾股定理','ABC是切线，B为切点，OA＝10，AB＝6，OC＝17，求半径OB及BC。','OB⊥AC（B为切点）<br>OB＝√(10²−6²)＝<b>8 cm</b>；BC＝√(17²−8²)＝<b>15 cm</b>'],
 ['例题3 切线长','PR、QR是切线，PR＝5，∠POR＝65°，求∠ROQ、∠ORP、QR。','∠ROQ＝∠POR＝<b>65°</b>；∠ORP＝90°−65°＝<b>25°</b>；QR＝PR＝<b>5 cm</b>（切线长定理）'],
 ['例题5 风筝形','PX、PY是切线，PX＝20，OX＝15，求OP、风筝形OXPY面积、XY。','OP＝√(20²+15²)＝<b>25 cm</b>；面积＝2×½×20×15＝<b>300 cm²</b><br>½·OP·XY＝300 ⇒ XY＝<b>24 cm</b>'],

{id:'8.6',n:'弦切角',calc:C6,g:g6,pts:'<b>弦切角</b>：切线与过切点的弦所夹的角。<div class="key"><b>弦切角定理</b>：弦切角＝切线与弦所夹的弧所对的圆周角（等于该弧圆心角的一半）。</div>注意：所夹的弧必须与弦切角在弦的同一侧。证明分弦切角是直角、锐角、钝角三种情况（作直径、利用半圆含直角）。',
