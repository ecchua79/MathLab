function grp(d,cont,w,lo){let a1=Math.min(...d),z1=Math.max(...d);if(d.some(v=>v%1))cont=true;if(lo==null||isNaN(lo))lo=Math.floor(a1/w)*w;let g=[];for(let l=lo;l<=z1;l=r2(l+w)){let u=cont?r2(l+w):r2(l+w-1);g.push({l,u,f:d.filter(v=>cont?v>=l&&v<u:v>=l&&v<=u).length,m:(l+u)/2,b:cont?[l,u]:[l-.5,u+.5]})}

()=>{let d=[["对总体中每个对象都进行调查","全面调查"],["对总体的某个子集进行调查，再推测总体","抽样调查"],["由全体研究对象所构成的集合","总体"],["被选取出来进行调查的子集","样本"]],x=pick(d);return mc(`「${x[0]}」称为？`,x[1],d.map(v=>v[1]),'')},

{t:'3.1',n:'统计学的基本概念',h:`<div class=card><h3>📘 核心概念</h3><p><b>统计学</b>：研究如何收集、整理、分析数据并得出结论的科学。</p><p><b>总体</b>：由全体研究对象所构成的集合。<b>样本</b>：从总体中选取的子集。</p><p><b>全面调查</b>：对总体中每个对象都调查（耗人力财力时间，有时不可行，如逐个测试灯泡寿命）。<b>抽样调查</b>：只调查样本，再推测总体；样本的代表性决定估计的准确度。</p></div>
