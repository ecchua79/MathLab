<script>
const $=s=>document.querySelector(s);
const R=(a,b)=>Math.floor(Math.random()*(b-a+1))+a,P=a=>a[R(0,a.length-1)];
const SH=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){let j=R(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
const nz=()=>{let v=0;while(!v)v=R(-6,6);return v};
const f=n=>{n=Math.round(n*1e6)/1e6;if(Number.isInteger(n))return(n<0?'−':'')+Math.abs(n);for(let q=2;q<=12;q++){let p=n*q;if(Math.abs(p-Math.round(p))<1e-6)return(p<0?'−':'')+Math.abs(Math.round(p))+'/'+q}return(n<0?'−':'')+Math.abs(n).toFixed(2)};
const g=n=>n<0?`(${f(n)})`:f(n);
const pt=(p,l='')=>`${l}(${f(p[0])}, ${f(p[1])})`;
const fr=(a,b)=>`<span class=fr><i>${a}</i><span>${b}</span></span>`;
const vec=(a,b)=>`<span class=vec><i>${f(a)}</i><i>${f(b)}</i></span>`;
const rt=s=>{s=''+s;const w=[...s].reduce((t,c)=>t+(/[0-9]/.test(c)?9.2:/[()²]/.test(c)?6.5:/[−+=]/.test(c)?10.5:9.5),4);return`<svg class=rt width="${w+14}" height="24" viewBox="0 0 ${w+14} 24"><path d="M1 14 L4 12 L7 20 L12 3 H${w+13}" fill="none" stroke="currentColor" stroke-width="1.6"/><text x="14" y="19" font-size="16" fill="currentColor">${s}</text></svg>`};
const sq=n=>{if(!n)return'0';let a=1,b=n;for(let i=2;i*i<=b;i++)while(b%(i*i)==0){b/=i*i;a*=i}return b==1?''+a:(a>1?a:'')+rt(b)};
const sqf=n=>Number.isInteger(n)?sq(n):rt(f(n));
const pn=s=>{s=(''+s).replace(/[−–]/g,'-').trim();let m=s.match(/^(-?\d+(?:\.\d+)?)\/(\d+)$/);return m?m[1]/m[2]:parseFloat(s)};
const pp=s=>{const r=[],re=/(-?\d+(?:\.\d+)?(?:\/\d+)?)\s*[,，]\s*(-?\d+(?:\.\d+)?(?:\/\d+)?)/g;s=s.replace(/[−–]/g,'-');let m;while(m=re.exec(s))r.push([pn(m[1]),pn(m[2])]);return r};
const norm=t=>{t=((t%360)+360)%360;return t>180?t-360:t};
/* ---------- transformations ---------- */
const RN={x:'x 轴',y:'y 轴',yx:'直线 y = x',ynx:'直线 y = −x',xk:'直线 x = k',yk:'直线 y = k'};
function ap(s,p){let[x,y]=p;
 if(s.t=='ref'){const k=s.k;return{x:[x,-y],y:[-x,y],yx:[y,x],ynx:[-y,-x],xk:[2*k-x,y],yk:[x,2*k-y]}[s.m]}
 if(s.t=='tr')return[x+s.a,y+s.b];
 if(s.t=='rot'){let[cx,cy]=s.c,dx=x-cx,dy=y-cy,t=((s.th%360)+360)%360,r=t==90?[-dy,dx]:t==180?[-dx,-dy]:t==270?[dy,-dx]:[dx,dy];return[cx+r[0],cy+r[1]]}
 return[s.c[0]+s.k*(x-s.c[0]),s.c[1]+s.k*(y-s.c[1])]}
function nm(s){if(s.t=='ref')return'对'+(s.m=='xk'?'直线 x = '+f(s.k):s.m=='yk'?'直线 y = '+f(s.k):RN[s.m])+'反射';
 if(s.t=='tr')return'平移 '+vec(s.a,s.b);
 if(s.t=='rot')return'绕 '+pt(s.c)+' '+(s.th>0?'逆':'顺')+'时针旋转 '+Math.abs(s.th)+'°';
 return'以 '+pt(s.c)+' 为中心，放大因数 k = '+f(s.k)+' 放大'}
function rule(s){if(s.t=='ref')return{x:'(x, y) → (x, −y)',y:'(x, y) → (−x, y)',yx:'(x, y) → (y, x)',ynx:'(x, y) → (−y, −x)',xk:`(x, y) → (${f(2*s.k)} − x, y)`,yk:`(x, y) → (x, ${f(2*s.k)} − y)`}[s.m];
 if(s.t=='tr')return`(x, y) → (x + ${g(s.a)}, y + ${g(s.b)})`;
 const z=!s.c[0]&&!s.c[1];
 if(s.t=='rot'){const t=((s.th%360)+360)%360;return z?'(x, y) → '+(t==90?'(−y, x)':t==180?'(−x, −y)':'(y, −x)'):'P′ = 中心 + 旋转(P − 中心)'}
 return z?`(x, y) → (${f(s.k)}x, ${f(s.k)}y)`:'P′ = 中心 + k·(P − 中心)'}
function dt(s,p,q){const[x,y]=p;
 if(s.t=='ref'&&s.m=='xk')return`2×${g(s.k)}−${g(x)} = ${f(q[0])}`;
 if(s.t=='ref'&&s.m=='yk')return`2×${g(s.k)}−${g(y)} = ${f(q[1])}`;
 if(s.t=='tr')return`(${f(x)}+${g(s.a)}, ${f(y)}+${g(s.b)})`;
 if(s.t=='rot'||s.t=='dil'){const c=s.c;return`相对中心 (${f(x-c[0])}, ${f(y-c[1])}) → (${f(q[0]-c[0])}, ${f(q[1]-c[1])}) → 加回中心`}
 return''}
/* ---------- SVG helpers ---------- */
const MK='<marker id="aa" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#a33ad1"/></marker>';
function plot(ps,dr,W=380,H=320){
 const xs=ps.map(p=>p[0]).concat(0),ys=ps.map(p=>p[1]).concat(0);
 const x0=Math.floor(Math.min(...xs))-1,x1=Math.ceil(Math.max(...xs))+1,y0=Math.floor(Math.min(...ys))-1,y1=Math.ceil(Math.max(...ys))+1;
 const m=22,u=Math.min((W-2*m)/(x1-x0),(H-2*m)/(y1-y0)),ox=(W-u*(x1-x0))/2,oy=(H-u*(y1-y0))/2;
 const X=x=>ox+(x-x0)*u,Y=y=>H-oy-(y-y0)*u,st=Math.max(1,Math.ceil(Math.max(x1-x0,y1-y0)/12));let s='';
 for(let x=x0;x<=x1;x++)s+=`<line x1="${X(x)}" y1="${Y(y0)}" x2="${X(x)}" y2="${Y(y1)}" stroke="var(--grid)"/>`+(x%st==0&&x?`<text x="${X(x)}" y="${Y(0)+13}" font-size="10" text-anchor="middle">${x}</text>`:'');
 for(let y=y0;y<=y1;y++)s+=`<line x1="${X(x0)}" y1="${Y(y)}" x2="${X(x1)}" y2="${Y(y)}" stroke="var(--grid)"/>`+(y%st==0&&y?`<text x="${X(0)-4}" y="${Y(y)+4}" font-size="10" text-anchor="end">${y}</text>`:'');
 s+=`<line x1="${X(x0)}" y1="${Y(0)}" x2="${X(x1)}" y2="${Y(0)}" stroke="currentColor"/><line x1="${X(0)}" y1="${Y(y0)}" x2="${X(0)}" y2="${Y(y1)}" stroke="currentColor"/><text x="${X(x1)-8}" y="${Y(0)-5}" font-size="12" font-style="italic">x</text><text x="${X(0)+6}" y="${Y(y1)+10}" font-size="12" font-style="italic">y</text>`;
 return`<svg class="pl" viewBox="0 0 ${W} ${H}" fill="currentColor">${s}${dr(X,Y,u)}</svg>`}
const dot=(X,Y,p,l,c)=>`<circle cx="${X(p[0])}" cy="${Y(p[1])}" r="3.6" fill="${c}"/><text x="${X(p[0])+5}" y="${Y(p[1])-5}" font-size="13" font-weight="600" fill="${c}">${l}</text>`;
const poly=(X,Y,ps,c,o)=>ps.length<2?'':`<${ps.length>2?'polygon':'polyline'} points="${ps.map(p=>X(p[0])+','+Y(p[1])).join(' ')}" fill="${ps.length>2?c:'none'}" fill-opacity="${o}" stroke="${c}" stroke-width="2"/>`;
const ln=(X,Y,p,q,c,m,s)=>`<line x1="${X(p[0])}" y1="${Y(p[1])}" x2="${X(q[0])}" y2="${Y(q[1])}" stroke="${c}" stroke-width="${s?2:1.4}" ${s?'':'stroke-dasharray="5,4"'} ${m?'marker-end="url(#aa)"':''}/>`;
function arcR(cx,cy,a0,d,r,l,col,ar){const n=Math.max(6,Math.abs(d)/4|0),q=[];for(let i=0;i<=n;i++){const a=(a0+d*i/n)*Math.PI/180;q.push((cx+r*Math.cos(a)).toFixed(1)+','+(cy-r*Math.sin(a)).toFixed(1))}
 const m=(a0+d/2)*Math.PI/180;return`<polyline points="${q.join(' ')}" fill="none" stroke="${col}" stroke-width="2" ${ar?'marker-end="url(#aa)"':''}/><text x="${cx+(r+15)*Math.cos(m)}" y="${cy-(r+15)*Math.sin(m)+4}" font-size="12" text-anchor="middle" font-weight="600" fill="${col}">${l}</text>`}
const arc=(X,Y,c,a0,d,r,l,col)=>arcR(X(c[0]),Y(c[1]),a0,d,r,l,col,1);
function aFig(t,lab){const c=[100,82],a0=20,L=72,pr=a=>[c[0]+L*Math.cos(a*Math.PI/180),c[1]-L*Math.sin(a*Math.PI/180)],A=pr(a0),B=pr(a0+t);
 const ray=(p,d)=>`<line x1="${c[0]}" y1="${c[1]}" x2="${p[0]}" y2="${p[1]}" stroke="currentColor" ${d?'stroke-dasharray="5,4"':''}/>`;
 return`<svg class="af" viewBox="0 0 200 170" fill="currentColor"><defs>${MK}</defs>${ray(A)}${ray(B,1)}${arcR(c[0],c[1],a0,t,30,lab,'#d9480f',1)}<circle cx="${c[0]}" cy="${c[1]}" r="3"/><text x="${c[0]-12}" y="${c[1]+14}" font-size="13">O</text><text x="${A[0]+4}" y="${A[1]-4}" font-size="13">A</text><text x="${B[0]+4}" y="${B[1]+(t<0?12:-4)}" font-size="13">A′</text></svg>`}
function tf(a,dir){const h=92,s=h*Math.tan(a/2*Math.PI/180),A=[130,14],B=[130-s,14+h],C=[130+s,14+h];
 return`<svg class="af" style="max-width:270px" viewBox="0 0 260 150" fill="currentColor"><defs>${MK}</defs><polygon points="${A} ${B} ${C}" fill="none" stroke="currentColor"/><text x="138" y="14" font-size="13">A</text><text x="${B[0]-14}" y="${B[1]+12}" font-size="13">B</text><text x="${C[0]+4}" y="${C[1]+12}" font-size="13">C</text>${arcR(A[0],A[1],-90-a/2,a,26,a+'°','#d9480f',0)}${dir>0?arcR(A[0],A[1],-90-a/2,a,54,'θ=?','#0b7285',1):arcR(A[0],A[1],-90+a/2,-a,54,'θ=?','#0b7285',1)}</svg>`}
/* ---------- run steps ---------- */
function run(st,pts){const L='ABCDEFGH',sg=[pts];let cur=pts,h='';
 st.forEach((s,i)=>{const nx=cur.map(p=>ap(s,p));sg.push(nx);
  h+=`<div class=stp><b>第 ${i+1} 步：${nm(s)}</b><br>规则：${rule(s)}<br>`+cur.map((p,j)=>`${L[j]}${"′".repeat(i)}${pt(p)} → ${L[j]}${"′".repeat(i+1)}${pt(nx[j])} <small>${dt(s,p,nx[j])}</small>`).join('<br>')+'</div>';cur=nx});
 return anim(st,pts)+h+plotRun(st,sg)}
function plotRun(st,sg){const all=[].concat(...sg);st.forEach(s=>s.c&&all.push(s.c));
 return plot(all,(X,Y)=>{let o=`<defs>${MK}</defs>`;
  st.forEach(s=>{if(s.t=='ref'){const B=80,l={x:[[-B,0],[B,0]],y:[[0,-B],[0,B]],yx:[[-B,-B],[B,B]],ynx:[[-B,B],[B,-B]],xk:[[s.k,-B],[s.k,B]],yk:[[-B,s.k],[B,s.k]]}[s.m];o+=ln(X,Y,l[0],l[1],'#a33ad1',0,1)}});
  sg.forEach((ps,i)=>o+=poly(X,Y,ps,i==0?'var(--a)':i==sg.length-1?'var(--b)':'var(--mut)',.15));
  st.forEach((s,i)=>{const A=sg[i],B=sg[i+1];
   if(s.t=='ref'||s.t=='tr')A.forEach((p,j)=>o+=ln(X,Y,p,B[j],'#a33ad1',s.t=='tr'));
   if(s.t=='dil')A.forEach((p,j)=>{const far=Math.hypot(p[0]-s.c[0],p[1]-s.c[1])>Math.hypot(B[j][0]-s.c[0],B[j][1]-s.c[1])?p:B[j];o+=ln(X,Y,s.c,far,'#a33ad1')});
   if(s.t=='rot')A.forEach((p,j)=>{o+=ln(X,Y,s.c,p,'#a33ad1')+ln(X,Y,s.c,B[j],'#a33ad1');if(j<2&&(p[0]!=s.c[0]||p[1]!=s.c[1]))o+=arc(X,Y,s.c,Math.atan2(p[1]-s.c[1],p[0]-s.c[0])*180/Math.PI,s.th,24+15*j,s.th+'°',j?'#0b7285':'#d9480f')});
   if(s.c)o+=dot(X,Y,s.c,'中心','#a33ad1')});
  sg.forEach((ps,i)=>ps.forEach((p,j)=>o+=dot(X,Y,p,'ABCDEFGH'[j]+"′".repeat(i),i?'var(--b)':'var(--a)')));
  return o})}
/* ---------- solvers for presets ---------- */
function vs(p,q){const a=q[0]-p[0],b=q[1]-p[1];
 return anim([{t:'tr',a,b}],[p])+`<div class=stp>P${pt(p)} → P′${pt(q)}<br>PP′ = (x′−x, y′−y) = (${f(q[0])}−${g(p[0])}, ${f(q[1])}−${g(p[1])}) = ${vec(a,b)}<br>即向${a>=0?'右':'左'}移 ${f(Math.abs(a))} 个单位，再向${b>=0?'上':'下'}移 ${f(Math.abs(b))} 个单位；移动距离 |PP′| = ${rt(`${g(a)}²+${g(b)}²`)} = ${sqf(a*a+b*b)}</div>`+
 plot([p,q],(X,Y)=>`<defs>${MK}</defs>`+ln(X,Y,p,[q[0],p[1]],'var(--mut)')+ln(X,Y,[q[0],p[1]],q,'var(--mut)')+ln(X,Y,p,q,'#a33ad1',1,1)+dot(X,Y,p,'P','var(--a)')+dot(X,Y,q,'P′','var(--b)'))}
function fr3(A,A2,B,B2){const e=(P,Q)=>[Q[0]-P[0],Q[1]-P[1],(Q[0]**2+Q[1]**2-P[0]**2-P[1]**2)/2],e1=e(A,A2),e2=e(B,B2),d=e1[0]*e2[1]-e2[0]*e1[1];
 const L=e=>`${f(e[0])}x ${e[1]<0?'−':'+'} ${f(Math.abs(e[1]))}y = ${f(e[2])}`;
 let h=`<div class=stp>AA′ 的垂直平分线：${L(e1)}<br>BB′ 的垂直平分线：${L(e2)}</div>`;
 if(Math.abs(d)<1e-9)return h+'<div class=stp>两条垂直平分线平行或重合，无法唯一确定旋转中心。</div>';
 const O=[(e1[2]*e2[1]-e2[2]*e1[1])/d,(e1[0]*e2[2]-e2[0]*e1[2])/d],ang=p=>Math.atan2(p[1]-O[1],p[0]-O[0])*180/Math.PI;
 let t=ang(A2)-ang(A);t=((t+540)%360)-180;if(t==-180)t=180;t=Math.round(t*10)/10;
 let t2=ang(B2)-ang(B);t2=((t2+540)%360)-180;if(t2==-180)t2=180;t2=Math.round(t2*10)/10;
 const dd=(P,Q)=>(P[0]-Q[0])**2+(P[1]-Q[1])**2,warn=Math.abs(dd(A,B)-dd(A2,B2))>1e-6?'<br><b class=r>注意：AB ≠ A′B′，这不是旋转！</b>':'';
