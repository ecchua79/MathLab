<script>
const $=s=>document.querySelector(s),R_=n=>Math.floor(Math.random()*n),pk=a=>a[R_(a.length)],gcd=(a,b)=>b?gcd(b,a%b):Math.abs(a),sn=n=>(n<0?'−':'')+Math.abs(n);
const sq=n=>{let t=1;for(let i=2;i*i<=n;i++)while(n%(i*i)==0){n/=i*i;t*=i}return[t,n]};
const NM=['sin','cos','tan','cosec','sec','cot'],Q=n=>'第'+'一二三四'[n-1]+'象限';
const cx=document.createElement('canvas').getContext('2d');cx.font='16px system-ui,"PingFang SC","Microsoft YaHei",sans-serif';
const rt=s=>{const w=Math.ceil(cx.measureText(String(s)).width)+5,W=w+13;return `<svg class=rt width=${W/16}em height=1.625em viewBox="0 0 ${W} 26"><path d="M1 15l3-2 3.5 9 5.5-19H${W}" fill=none stroke=currentColor stroke-width=1.4 stroke-linejoin=round /><text x=15.5 y=21>${s}</text></svg>`};
const fr=(n,d)=>`<span class=fr><i>${n}</i><b>${d}</b></span>`;
const ex=(p,q)=>{if(!p[0])return'0';let[t,m]=sq(p[1]*q[1]),k=p[0]*t,d=q[0]*q[1],g=gcd(k,d);k/=g;d/=g;const n=m>1?(k>1?k:'')+rt(m):k;return d>1?fr(n,d):n};
const mk=n=>[Math.abs(n),1,Math.sign(n)],dv=a=>a[2]*a[0]*Math.sqrt(a[1]),rad=(X,Y)=>{const[t,m]=sq(X[0]**2*X[1]+Y[0]**2*Y[1]);return[t,m,1]};
const six=(X,Y,r)=>[[Y,r],[X,r],[Y,X],[r,Y],[r,X],[X,Y]].map(([a,b])=>b[0]==0?'<span class=mu>不存在</span>':a[0]==0?'0':(a[2]*b[2]<0?'−':'')+ex(a,b));
const qd=a=>{const n=((a%360)+360)%360;return n%90==0?0:Math.floor(n/90)+1};
const P2=(r,d)=>[r*Math.cos(d*Math.PI/180),-r*Math.sin(d*Math.PI/180)].map(v=>v.toFixed(1));
const arc=(a0,a1,r0,r1)=>{let s='',n=Math.max(2,Math.ceil(Math.abs(a1-a0)/4));for(let i=0;i<=n;i++)s+=(i?'L':'M')+P2(r0+(r1-r0)*i/n,a0+(a1-a0)*i/n).join(' ');return s};
function dg(ang,o={}){const n=((ang%360)+360)%360;let S=`<line x1=-120 y1=0 x2=120 y2=0 class=ax /><line x1=0 y1=118 x2=0 y2=-118 class=ax /><text x=108 y=-5 class=t>x</text><text x=6 y=-106 class=t>y</text><text x=-12 y=12 class=t>O</text>`;
 const[tx,ty]=P2(100,ang);
 if(o.p){const[px,py]=P2(90,ang).map(Number);if(n%180)S+=`<line x1=${px} y1=${py} x2=${px} y2=0 class=ds />`;
  if(n%90){const dx=px>0?-7:7,dy=py<0?-7:7;S+=`<path d="M${px+dx} 0v${dy}h${-dx}" class=ds />`}
  S+=`<circle cx=${px} cy=${py} r=4 fill=var(--ac) /><text x=${px+(px>=0?6:-6)} y=${py+(py>0?14:-7)} style="text-anchor:${px>=0?'start':'end'}">${o.pl||''}</text>`}
 S+=`<line x1=0 y1=0 x2=${tx} y2=${ty} stroke=var(--ac) stroke-width=2.5 /><path d="${arc(0,ang,16,16+Math.min(Math.abs(ang)/360,3)*4.5)}" class=a1 />`;
 S+=`<text x=-120 y=-106 class=l1>${o.n||'α'} = ${o.s||ang+'°'}</text>`;
 if(n%90){const[rs,re]=n<90?[0,n]:n<180?[n,180]:n<270?[180,n]:[n,360],[lx,ly]=P2(54,(rs+re)/2);
  S+=`<path d="${arc(rs,re,40,40)}" class=a2 /><text x=${lx} y=${ly} class=l2>θ</text><text x=-120 y=-90 class=l2>相伴锐角 θ = ${re-rs}°</text>`}
 return `<svg class=dg viewBox="-125 -125 250 250">${S}</svg>`}
function gr(i,m){const sx=.56,sy=36,X=d=>(d*sx).toFixed(1),Y=v=>(-v*sy).toFixed(1),f=[Math.sin,Math.cos,Math.tan][i];
 let S=`<line x1=-200 y1=0 x2=200 y2=0 class=ax /><line x1=0 y1=100 x2=0 y2=-100 class=ax /><text x=-5 y=${Y(1)} class=gy>1</text><text x=-5 y=${Y(-1)} class=gy>−1</text>`;
 for(let k=-4;k<=4;k++)if(k){const x=X(k*90),a=Math.abs(k),s=k<0?'−':'';S+=`<line x1=${x} y1=-3 x2=${x} y2=3 class=ax />`+(k%2?`<text x=${x} y=14 class=gt>${s}${a>1?a:''}π</text><line x1=${x-9} y1=17 x2=${x+9} y2=17 class=ax /><text x=${x} y=29 class=gt>2</text>`:`<text x=${x} y=14 class=gt>${s}${a/2>1?a/2:''}π</text>`)}
 const seg=(a,b)=>{let d='',pen=0;for(let t=a;t<=b;t+=3){const v=f(t*Math.PI/180);if(Math.abs(v)>2.6){pen=0;continue}d+=(pen?'L':'M')+X(t)+' '+Y(v);pen=1}return d};
 if(i==2)S+=[-270,-90,90,270].map(c=>`<line x1=${X(c)} y1=-100 x2=${X(c)} y2=100 class=ds />`).join('');
 S+=`<path d="${i<2?seg(-360,360):[[-360,-273],[-267,-93],[-87,87],[93,267],[273,360]].map(([a,b])=>seg(a,b)).join('')}" class=cv />`;
 if(m!=null){const v=f(m*Math.PI/180);if(Math.abs(v)<=2.6)S+=`<circle cx=${X(m)} cy=${Y(v)} r=5 fill=var(--ac) />`}
 return `<svg class=gr viewBox="-200 -100 400 200">${S}</svg>`}
const lab=a=>a[0]==0?'0':(a[2]<0?'−':'')+(a[1]>1?(a[0]>1?a[0]:'')+rt(a[1]):a[0]),labt=a=>a[0]==0?'0':(a[2]<0?'−':'')+(a[1]>1?(a[0]>1?a[0]:'')+'√'+a[1]:a[0]);
function res6(X,Y,Rr){const v=six(X,Y,Rr),d=[['y','r'],['x','r'],['y','x'],['r','y'],['r','x'],['x','y']],g={x:lab(X),y:lab(Y),r:lab(Rr)};
 return `<div class=six>`+NM.map((n,i)=>`<div>${n}α = ${fr(d[i][0],d[i][1])} = ${fr(g[d[i][0]],g[d[i][1]])} = <b>${v[i]}</b></div>`).join('')+`</div><div class=cen>${dg(Math.atan2(dv(Y),dv(X))*180/Math.PI,{p:1,pl:`P(${labt(X)}, ${labt(Y)})`})}</div>`}
const pt=(x,y)=>{if(!x&&!y)return'原点不能作为终边上的点（r＞0）';const X=mk(x),Y=mk(y),Rr=rad(X,Y),s=x*x+y*y;
 return `<p>r = ${rt(`(${sn(x)})²+(${sn(y)})²`)} = ${rt(s)}${Rr[0]>1||Rr[1]==1?` = ${Rr[0]>1&&Rr[1]>1?Rr[0]:Rr[1]==1?Rr[0]:''}${Rr[1]>1?rt(Rr[1]):''}`:''}</p>`+res6(X,Y,Rr)};
function sol(i,p,q,Qd){if(!q||!p)return'分子、分母都不能为 0';const S=[[1,2],[1,4],[1,3]][i%3],a=Math.abs(p),b=Math.abs(q),m=[['y','r'],['x','r'],['y','x'],['r','y'],['r','x'],['x','y']][i],K={};K[m[0]]=a;K[m[1]]=b;
 if(Math.sign(p*q)!=(S.includes(Qd)?1:-1))return'⚠ 函数值的正负与所选象限不符（请用 ASTC 口诀检查）';
 const sx=Qd==1||Qd==4?1:-1,sy=Qd<3?1:-1,n=K.r==null?K.x**2+K.y**2:K.x==null?K.r**2-K.y**2:K.r**2-K.x**2;
 if(n<=0)return'⚠ 这个比值不可能出现（例如 |sin α| 不能大于 1）';const[t,mm]=sq(n);
 const X=K.x==null?[t,mm,sx]:[K.x,1,sx],Y=K.y==null?[t,mm,sy]:[K.y,1,sy],Rr=K.r==null?[t,mm,1]:[K.r,1,1];
 return `<p>${NM[i]}α = ${(p*q<0?'−':'')+fr(a,b)}，α 在${Q(Qd)}：x ${sx>0?'＞':'＜'} 0，y ${sy>0?'＞':'＜'} 0。取 ${m[0]} = ${a}，${m[1]} = ${b}，再用勾股定理求第三边：${rt(n)}${mm==1?' = '+t:t>1?' = '+t+rt(mm):''}</p>`+res6(X,Y,Rr)}
function ang3(i,a){const n=((a%360)+360)%360,q=qd(a),vs=(X,Y,r)=>`<div class=six>`+six(X,Y,r).map((v,j)=>`<div>${NM[j]} ${a}° = <b>${v}</b></div>`).join('')+'</div>';
 if(!q){const c=Math.round(Math.cos(n*Math.PI/180)),s=Math.round(Math.sin(n*Math.PI/180));return `<p>${a}° 的终边在坐标轴上，不属于任何象限。</p>`+vs(mk(c),mk(s),[1,1,1])+dg(a)}
 const rf=n<90?n:n<180?180-n:n<270?n-180:360-n,pos=[[1,2],[1,4],[1,3]][i%3].includes(q);
 let h=`<p>${a}° 的终边在${Q(q)}，相伴锐角 θ = ${rf}°。${NM[i]} 在${Q(q)}为${pos?'正':'负'}值，∴ <b>${NM[i]} ${a}° = ${pos?'':'−'}${NM[i]} ${rf}°</b></p>`;
 if([30,45,60].includes(rf)){const B={30:[[1,3],[1,1],[2,1]],45:[[1,1],[1,1],[1,2]],60:[[1,1],[1,3],[2,1]]}[rf];h+=vs([...B[0],q==1||q==4?1:-1],[...B[1],q<3?1:-1],[...B[2],1])}
 else{const f=[Math.sin,Math.cos,Math.tan,x=>1/Math.sin(x),x=>1/Math.cos(x),x=>1/Math.tan(x)][i];h+=`<p>${NM[i]} ${a}° ≈ <b>${f(a*Math.PI/180).toFixed(4)}</b>（计算器）</p>`}
 return h+`<div class=cen>${dg(a)}</div>`}
const opt=a=>a.map((t,i)=>`<option value=${i}>${t}</option>`).join('');
/* ---- calculators ---- */
const C={
 1(){const a=+$('#a1').value;if(isNaN(a))return;const k=Math.floor(a/360),n=a-360*k,q=qd(a);$('#o1').innerHTML=`<p>${a}° = 360°×(${k}) + ${n}°，终边与 ${n}° 相同。</p><p>${q?`终边在<b>${Q(q)}</b>，所以是${Q(q)}角。`:'终边落在坐标轴上，<b>不属于任何象限</b>。'}</p><div class=cen>${dg(a)}</div>`},
 2(){$('#o2').innerHTML=pt(+$('#x2').value,+$('#y2').value)},
 3(){const a=+$('#a3').value;if(!isNaN(a))$('#o3').innerHTML=ang3(+$('#f3').value,a)},
 4(){$('#o4').innerHTML=sol(+$('#g4').value,+$('#p4').value,+$('#q4').value,+$('#Q4').value)},
 5(){const i=+$('#f5').value,a=+$('#a5').value;if(isNaN(a))return;const k=((a%180)+180)%180,v=i==2&&k==90?null:[Math.sin,Math.cos,Math.tan][i](a*Math.PI/180);
  $('#o5').innerHTML=`<p>${['sin','cos','tan'][i]} ${a}° = <b>${v==null?'不存在（图像在此有渐近线）':v.toFixed(4)}</b>；最小正周期 ${i==2?'180°（π）':'360°（2π）'}。</p><div class=g2>${dg(a,{p:1,pl:'(cos, sin)'})}${gr(i,a%360)}</div>`}};
const calc=(t,h,id)=>`<div class=calc><h3 style="margin-top:0">🧮 ${t}</h3>${h}<div id=o${id}></div></div>`;
const inp=(id,v,l)=>`<label>${l} <input id=${id} type=number value=${v}></label> `,B=n=>`<button class=btn onclick="C[${n}]()">计算</button>`;
const FN=opt(NM),QS=opt(['第一象限','第二象限','第三象限','第四象限']).replace(/value=(\d)/g,(m,d)=>'value='+(+d+1));
/* ---- tab content ---- */
const astc=`<svg class=dg viewBox="-125 -125 250 250"><line x1=-120 y1=0 x2=120 y2=0 class=ax /><line x1=0 y1=120 x2=0 y2=-120 class=ax /><text x=40 y=-50 class=l1 font-size=14>A 全正</text><text x=-85 y=-50 class=l2>S 仅 sin 正</text><text x=-85 y=60 class=l2>T 仅 tan 正</text><text x=40 y=60 class=l1>C 仅 cos 正</text><text x=100 y=-5 class=t>x</text><text x=6 y=-108 class=t>y</text></svg>`;
const gen=(i,a)=>`<div>${ang3(i,a)}</div>`;
const TABS=[
['7.1 象限',()=>`<div class=card>平面被 x 轴、y 轴分成 I、II、III、IV 四个象限（逆时针）。角的顶点在原点，始边固定在正 x 轴，按<b>终边所在象限</b>决定角的象限。终边落在坐标轴上的角（0°、90°、180°、270°、360°…）<b>不属于任何象限</b>。</div>
<h3>例题 1　绘出下列各角并判别象限</h3><div class=card><div class=g4><div>${dg(35)}(a) 35° 属第一象限</div><div>${dg(-140)}(b) −140° 属第三象限</div><div>${dg(680)}(c) 680° = 360°+320°，属第四象限</div><div>${dg(150,{s:'5π/6'})}(d) 5π/6 = 150°，属第二象限</div></div></div>`+calc('象限计算器（任意整数角度）',inp('a1',680,'角度')+'° '+B(1),1)],
['7.2 定义',()=>`<div class=card>在角 α 的终边上任取一点 P(x, y)，令 OP = r，r = ${rt('x²+y²')} ＞ 0（x、y 可正、可负、可为零）：<div class=six><div>sin α = ${fr('y','r')}</div><div>cosec α = ${fr('r','y')}</div><div>cos α = ${fr('x','r')}</div><div>sec α = ${fr('r','x')}</div><div>tan α = ${fr('y','x')}</div><div>cot α = ${fr('x','y')}</div></div>
<p class=mu>注意：终边在 x 轴上时 y = 0，cot、cosec 不存在；终边在 y 轴上时 x = 0，tan、sec 不存在。</p></div><h3>例题 1　P(−3, 4) 是角 α 终边上一点，求六个三角函数值</h3><div class=card>${pt(-3,4)}</div>`+calc('任意点 P(x, y) 的六个三角函数',inp('x2',-3,'x')+inp('y2',4,'y')+B(2),2)],
['7.3 求值',()=>`<h3>各象限的正负（ASTC）</h3><div class=card><div class=cen>${astc}</div><p>A（All）全正；S：只有 sin（及 cosec）为正；T：只有 tan（及 cot）为正；C：只有 cos（及 sec）为正。</p>
<table><tr><th></th><th>0°</th><th>90°</th><th>180°</th><th>270°</th></tr>${[0,1,2].map(i=>`<tr><td>${NM[i]} θ</td>`+[0,90,180,270].map(n=>`<td>${six(mk(Math.round(Math.cos(n*Math.PI/180))),mk(Math.round(Math.sin(n*Math.PI/180))),[1,1,1])[i].replace('不存在','没有定义')}</td>`).join('')+'</tr>').join('')}</table></div>
<h3>相伴锐角</h3><div class=card>象限角 α 的终边与 x 轴所夹的锐角 θ 叫相伴锐角。f(α) = ±f(θ)，正负由 α 所在象限决定。（图中绿色弧 = 相伴锐角，红色弧 = α 本身，半径不同以便区分。）</div>
