/* ---------- 测验组件 ---------- */
function quiz(box,cfg){
 box.innerHTML='';const st={r:0,n:0,f:0,w:{}},mq=cfg.mc(),fq=cfg.fl(),H=document.createElement('div'),Res=document.createElement('div'),Fh=document.createElement('div');box.append(H,Res,Fh);
 const opts=q=>{let o=[...new Set([q.a,...q.d])],n=+q.a,i=1;while(o.length<4&&isFinite(n)&&q.a.trim()!==''){const c=String(n+(i%2?1:-1)*Math.ceil(i/2));if(!o.includes(c))o.push(c);i++}return shuf(o)};
 H.innerHTML=`<h3>📝 选择题（${mq.length} 题）</h3>`;
 mq.forEach((q,i)=>{const c=document.createElement('div');c.className='qc';c.innerHTML=`<div>第 ${i+1} 题　${q.q}</div><div class="ops"></div><div class="fb"></div>`;const ops=$('.ops',c);
  opts(q).forEach(o=>{const b=document.createElement('button');b.className='op';b.innerHTML=o;b.onclick=()=>{ops.querySelectorAll('button').forEach(x=>{x.disabled=1;x.style.cursor='default'});const ok=o==q.a;b.classList.add(ok?'ok':'bad');if(!ok)ops.querySelectorAll('button').forEach(x=>{if(x.innerHTML==q.a)x.classList.add('ok')});$('.fb',c).innerHTML=(ok?'<span class="good">✔ 正确！</span>':'<span class="bad">✘ 错误，正确答案已标示。</span>')+sol(q);if(ok)st.r++;else if(q.tag!=null)st.w[q.tag]=1;if(++st.n==mq.length)after()};ops.append(b)});H.append(c)});
 function after(){const need=cfg.need;
  if(cfg.rev){Res.innerHTML=`<div class="sc">选择题：答对 ${st.r}/${mq.length}。请继续完成下面的 ${fq.length} 道填充题。</div>`;fills()}
  else if(st.r>=need){Res.innerHTML=`<div class="sc">答对 ${st.r}/${mq.length} 题 🎉 通关！请完成 ${fq.length} 道填充题。</div>`;fills()}
  else Res.innerHTML=`<div class="sc">答对 ${st.r}/${mq.length} 题，需答对 ${need} 题以上才能挑战填充题。<br><button class="bt" id="rt">🔄 重新出题</button></div>`,$('#rt',Res).onclick=()=>quiz(box,cfg)}
 function fills(){Fh.innerHTML=`<h3>✏️ 填充题（${fq.length} 题）</h3>`;let fd=0,fr=0;
  fq.forEach((q,i)=>{const c=document.createElement('div');c.className='qc';c.innerHTML=`<div>第 ${i+1} 题　${q.q}</div><div style="margin-top:.4rem"><input inputmode="decimal" placeholder="答案"> <button class="bt">确认</button> <span class="fb"></span></div>`;const inp=$('input',c),bt=$('button',c);
   const go=()=>{const v=parseFloat(inp.value.replace(/[−–]/g,'-'));if(isNaN(v))return;inp.disabled=bt.disabled=1;const ok=Math.abs(v-q.a)<1e-6;$('.fb',c).innerHTML=(ok?'<span class="good">✔ 正确！</span>':`<span class="bad">✘ 错误，答案是 ${M(q.a)}</span>`)+sol(q);if(ok)fr++;else if(q.tag!=null)st.w[q.tag]=1;if(++fd==fq.length)fin(fr)};bt.onclick=go;inp.onkeydown=e=>{if(e.key=='Enter')go()};Fh.append(c)})}

  if(!cfg.rev){Fh.insertAdjacentHTML('beforeend',`<div class="sc">本节完成：选择题 ${st.r}/${mq.length}，填充题 ${fr}/${fq.length}。<button class="bt" id="rt2">🔄 再来一组</button></div>`);$('#rt2',Fh).onclick=()=>quiz(box,cfg);return}
  const p=Math.round(tot/all*100),w=Object.keys(st.w).map(i=>`<span class="tag">${S[i].t}</span>`).join('');
  Fh.insertAdjacentHTML('beforeend',`<div class="sc" style="font-size:1.1rem">总分：${tot}/${all}（${p}%）<br>${p>=85?'🌟 优秀！函数概念掌握得很扎实。':p>=65?'👍 良好，再巩固错题即可。':p>=45?'📘 及格边缘，建议回到各小节重做练习。':'💪 加油！先把每节的例题和计算器看一遍。'}${w?`<br>建议复习：${w}`:''}<br><button class="bt" id="rt3">🔄 重新测验</button></div>`);$('#rt3',Fh).onclick=()=>quiz(box,cfg)}}

 if(!built[i]){built[i]=1;const s=S[i],sec=$('#s'+i);if(s.review)quiz($('.quiz',sec),revCfg());else{$('.ex-w',sec).innerHTML=s.ex().join('');calcInit($('.calc',sec),s.calc);quiz($('.quiz',sec),{need:3,mc:()=>shuf(s.m).slice(0,5).map(g=>g()),fl:()=>shuf(s.fl).slice(0,2).map(g=>g())})}}
