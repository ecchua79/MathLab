<script>
const $=s=>document.querySelector(s),R=(a,b)=>Math.floor(Math.random()*(b-a+1))+a,pk=a=>a[R(0,a.length-1)],rp=(a,b)=>{let v=0;while(!v)v=R(a,b);return v};
const sh=a=>{a=[...a];for(let i=a.length-1;i>0;i--){let j=R(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
const gcd=(a,b)=>b?gcd(b,a%b):Math.abs(a),N=x=>String(x).replace(/-/g,'−'),rn=x=>+x.toFixed(6);
const fr=(n,d=1)=>{if(d<0){n=-n;d=-d}let g=gcd(n,d)||1;return{n:n/g,d:d/g}};
const fa=(a,b)=>fr(a.n*b.d+b.n*a.d,a.d*b.d),fs=(a,b)=>fr(a.n*b.d-b.n*a.d,a.d*b.d),fm=(a,b)=>fr(a.n*b.n,a.d*b.d),fd=(a,b)=>fr(a.n*b.d,a.d*b.n),fv=f=>f.n/f.d;

const ff=s=>{let k=10**((s.split('.')[1]||'').length);return fr(Math.round(parseFloat(s)*k),k)};
const pf=s=>{let m=s.replace('−','-').match(/^(-?\d+(?:\.\d+)?)(?:\/(-?\d+(?:\.\d+)?))?$/);if(!m)return null;let b=m[2]?ff(m[2]):fr(1);return b.n?fd(ff(m[1]),b):null};
const sq=n=>{let o=1,i=n;for(let k=2;k*k<=i;k++)while(i%(k*k)==0){i/=k*k;o*=k}return[o,i]};
const rs=n=>{let[o,i]=sq(n);return i==1?''+o:(o>1?o:'')+`√{${i}}`};
const rr=(c,i)=>{let t=(c.n==1?'':c.n)+`√{${i}}`;return c.d==1?t:F(t,c.d)};
const M=s=>s.replace(/⟦([^¦⟧]*)¦([^⟧]*)⟧/g,(_,a,b)=>F(a,b)).replace(/√\{([^}]*)\}/g,'<svg class="rd"><text>$1</text><path/></svg>');
function fixR(){document.querySelectorAll('svg.rd').forEach(s=>{let f=parseFloat(getComputedStyle(s).fontSize),t=s.firstChild,p=s.lastChild;if(+s.dataset.f==f)return;t.setAttribute('font-size',f);t.setAttribute('x',.62*f);t.setAttribute('y',1.12*f);let w=t.getComputedTextLength();if(!w)return;s.dataset.f=f;let W=.62*f+w+.1*f;s.setAttribute('width',W);s.setAttribute('height',1.3*f);s.style.verticalAlign=-.18*f+'px';p.setAttribute('stroke-width',.075*f);p.setAttribute('d',`M${.05*f} ${.74*f}L${.17*f} ${.68*f}L${.33*f} ${1.2*f}L${.55*f} ${.2*f}H${W}`)})}
new MutationObserver(()=>{fixR();initAn()}).observe(document.body,{childList:true,subtree:true});
const eq=(a,b,c)=>{let s='';[[a,'x'],[b,'y'],[c,'']].forEach(([k,v])=>{if(!k)return;let m=Math.abs(k),t=(m==1&&v)?v:m+v;s+=s?(k<0?' − ':' + ')+t:(k<0?'−':'')+t});return s+' = 0'};
const pr=(x,y)=>`(${N(x)}, ${N(y)})`,prf=(x,y)=>`(${fT(x)}, ${fT(y)})`,t2=v=>N(+(+v).toFixed(2)),lb=(n,x,y)=>`${n}(${t2(x)}, ${t2(y)})`,dg=t=>+t.toFixed(1);
const qd=(x,y)=>!x||!y?'坐标轴上（不属于任何象限）':x>0&&y>0?'第一象限':x<0&&y>0?'第二象限':x<0?'第三象限':'第四象限';
/* ---------- 作图：等比例坐标系，含弧线(角)与直角记号 ---------- */
function plot(o){let X0=[0],Y0=[0];[...(o.p||[]),...(o.b||[]),...(o.g||[])].forEach(p=>{X0.push(p[0]);Y0.push(p[1])});
let x0=Math.min(...X0)-1.5,x1=Math.max(...X0)+1.5,y0=Math.min(...Y0)-1.5,y1=Math.max(...Y0)+1.5,W=360,H=290,s=Math.min((W-20)/(x1-x0),(H-20)/(y1-y0));
const X=x=>10+(x-x0)*s,Y=y=>H-10-(y-y0)*s,C=['c0','c1','c2','c3'];let h='',st=Math.max(1,Math.ceil(Math.max(x1-x0,y1-y0)/10));
for(let i=Math.ceil(x0/st)*st;i<=x1;i+=st)h+=`<path class="gl" d="M${X(i)} 0V${H}"/>`+(i?`<text class="tx" x="${X(i)}" y="${Y(0)+12}" text-anchor="middle">${N(i)}</text>`:'');
for(let i=Math.ceil(y0/st)*st;i<=y1;i+=st)h+=`<path class="gl" d="M0 ${Y(i)}H${W}"/>`+(i?`<text class="tx" x="${X(0)-4}" y="${Y(i)+4}" text-anchor="end">${N(i)}</text>`:'');
h+=`<path class="ax" d="M0 ${Y(0)}H${W}M${X(0)} 0V${H}"/><text class="tx" x="${X(0)-9}" y="${Y(0)+13}">O</text><text class="tx" x="${W-10}" y="${Y(0)-5}">x</text><text class="tx" x="${X(0)+5}" y="10">y</text>`;
if(o.g)h+=`<polygon points="${o.g.map(p=>X(p[0])+','+Y(p[1])).join(' ')}"/>`;
(o.l||[]).forEach(([a,b,c,k,d])=>{let p,q;if(b){p=[x0,(-c-a*x0)/b];q=[x1,(-c-a*x1)/b]}else{p=[-c/a,y0];q=[-c/a,y1]}h+=`<path class="${C[k]}" ${d?'stroke-dasharray="6 4"':''} stroke-width="2" d="M${X(p[0])} ${Y(p[1])}L${X(q[0])} ${Y(q[1])}"/>`});
(o.s||[]).forEach(([a,b,c,d,k,z])=>h+=`<path class="${C[k||0]}" ${z?'stroke-dasharray="5 4"':''} stroke-width="2" d="M${X(a)} ${Y(b)}L${X(c)} ${Y(d)}"/>`);
(o.a||[]).forEach(([cx,cy,r,a1,a2,tx,k])=>{let A=a1*Math.PI/180,B=a2*Math.PI/180,M2=(A+B)/2,px=X(cx),py=Y(cy);h+=`<path class="${C[k]}" stroke-width="2" d="M${px+r*Math.cos(A)} ${py-r*Math.sin(A)}A${r} ${r} 0 ${a2-a1>180?1:0} 0 ${px+r*Math.cos(B)} ${py-r*Math.sin(B)}"/><text class="tx" x="${px+(r+16)*Math.cos(M2)}" y="${py-(r+16)*Math.sin(M2)+4}" text-anchor="middle">${tx}</text>`});
(o.q||[]).forEach(([x,y,ux,uy,vx,vy])=>{let l1=Math.hypot(ux,uy),l2=Math.hypot(vx,vy),a=[ux/l1*10,-uy/l1*10],b=[vx/l2*10,-vy/l2*10],px=X(x),py=Y(y);h+=`<path class="c0" stroke-width="1.5" d="M${px+a[0]} ${py+a[1]}L${px+a[0]+b[0]} ${py+a[1]+b[1]}L${px+b[0]} ${py+b[1]}"/>`});
(o.t||[]).forEach(([x,y,tx,dy])=>h+=`<text class="tx" style="font-weight:700;fill:var(--ac);font-size:14px" x="${X(x)}" y="${Y(y)+(dy||-8)}" text-anchor="middle">${tx}</text>`);
(o.p||[]).forEach(([x,y,n,k])=>h+=`<circle class="q${k||1}" cx="${X(x)}" cy="${Y(y)}" r="4"/>`+(n?`<text class="tx" x="${X(x)+7}" y="${Y(y)-7}">${n}</text>`:''));
return`<svg class="plot" viewBox="0 0 ${W} ${H}">${h}</svg>`}

const fig12=()=>{const T=(x,y,s)=>`<text class="tx" style="font-size:13px" x="${x}" y="${y}" text-anchor="middle">${s}</text>`,
Dt=(x,y,n,k)=>`<circle class="q${k}" cx="${x}" cy="${y}" r="4.5"/>`+T(x,y+18,n),Ln=(a,b,y)=>`<path class="c0" stroke-width="2" d="M${a} ${y}H${b}"/>`,
Br=(a,b,y,s,up)=>{let d=up?-1:1;return`<path class="c1" stroke-width="1.8" d="M${a} ${y}v${8*d}H${b}v${-8*d}"/>`+T((a+b)/2,y+d*8+(up?-5:16),s)};let h='';
h+=T(180,18,'① 内分：P 在线段 AB 之内　AP : PB = m : n')+Ln(40,320,60)+Br(40,208,50,'m',1)+Br(208,320,50,'n',1)+Dt(40,60,'A',1)+Dt(208,60,'P',3)+Dt(320,60,'B',1);
h+=T(180,108,'② 外分：Q 在线段 AB 的延长线上　AQ : QB = m : n（m > n）')+Ln(40,320,150)+Br(40,320,140,'m',1)+Br(208,320,160,'n',0)+Dt(40,150,'A',1)+Dt(208,150,'B',1)+Dt(320,150,'Q',3);
h+=T(180,208,'③ 中点：m = n = 1，AM = MB')+Ln(40,320,250)+Br(40,180,240,'m = 1',1)+Br(180,320,240,'n = 1',1)+Dt(40,250,'A',1)+Dt(180,250,'M',3)+Dt(320,250,'B',1);
return`<div class="card"><b>图示：m、n 的意思</b><svg class="plot" viewBox="0 0 360 285">${h}</svg>m 对应靠近 A 的那一段（AP 或 AQ），n 对应靠近 B 的那一段（PB 或 QB）。</div>`};
const fig13=()=>{let A=[1,2],B=[5,3],C=[3,6],foot=(p,n)=>[p[0],0,n,2],ds=p=>[p[0],p[1],p[0],0,2,1];
let f1=plot({g:[A,B,C],p:[[...A,'A',1],[...B,'B',1],[...C,'C',1],foot(A,'F'),foot(C,'E'),foot(B,'D')],s:[ds(A),ds(B),ds(C)]}),
Q=[[1,1],[6,2],[5,5],[1,4]],f2=plot({g:Q,p:Q.map((p,i)=>[...p,'ABCD'[i],1]),s:[[1,1,5,5,2,1]]});
return`<div class="card"><b>图示 ①：为什么公式长这样？</b>${f1}△ABC 的面积 = 梯形 AFEC + 梯形 CEDB − 梯形 AFDB（左、右两块加起来，减去底下大块）。把梯形面积（上底＋下底）× 高 × ⟦1¦2⟧ 展开，就得到「向下箭头乘积和 − 向上箭头乘积和」再乘 ⟦1¦2⟧。<br><b>图示 ②：多边形拆成三角形</b>${f2}四边形 ABCD = △ABC + △ACD；任何多边形都能这样拆，鞋带公式等于一次算完所有三角形。</div>`};
const anim=pts=>`<div class="an" data-p='${JSON.stringify(pts.map(p=>[fv(p[0]),fv(p[1])]))}' data-s="0" data-play="1"><b>动画：向下 / 向上相乘</b><div class="vw"></div><div class="cp"></div><div><button data-a="p">⏸ 暂停</button><button data-a="b">⏪ 上一步</button><button data-a="n">⏭ 下一步</button><button data-a="r">🔄 重播</button></div></div>`;
function drawAn(el){let P=JSON.parse(el.dataset.p),k=P.length,s=+el.dataset.s,Q=P.concat([P[0]]),X=i=>46+i*62,y0=44,y1=116,W=X(k)+40,svg='',cap;
const ar=(x1,y1_,x2,y2,c,w,d)=>{let a=Math.atan2(y2-y1_,x2-x1),hx=x2-9*Math.cos(a),hy=y2-9*Math.sin(a);return`<g class="${c}"><path d="M${x1} ${y1_}L${hx} ${hy}" stroke-width="${w}" ${d?'stroke-dasharray="6 4"':''}/><polygon stroke="none" points="${x2},${y2} ${hx+4*Math.sin(a)},${hy-4*Math.cos(a)} ${hx-4*Math.sin(a)},${hy+4*Math.cos(a)}"/></g>`};
Q.forEach((p,i)=>svg+=`<text class="tx" x="${X(i)}" y="${y0+5}" text-anchor="middle" style="font-size:16px">${t2(p[0])}</text><text class="tx" x="${X(i)}" y="${y1+5}" text-anchor="middle" style="font-size:16px">${t2(p[1])}</text><text class="tx" x="${X(i)}" y="${y1+30}" text-anchor="middle" style="font-size:12px;opacity:.7">${'ABCDE'[i%k]}${i==k?'(重复)':''}</text>`);
svg+=`<text class="tx" x="8" y="${y0+5}" style="font-size:12px;opacity:.7">x</text><text class="tx" x="8" y="${y1+5}" style="font-size:12px;opacity:.7">y</text>`;
let S1=0,S2=0;for(let j=1;j<=Math.min(s,k);j++){let q=Q[j-1][0]*Q[j][1];S1+=q;svg+=ar(X(j-1)+16,y0+8,X(j)-16,y1-8,'c1',j==s?3.6:2);if(j==s)cap=`<b style="color:var(--ac)">↘ 实线向下第 ${j} 步</b>：${t2(Q[j-1][0])} × ${t2(Q[j][1])} = ${t2(rn(q))}；累计 S₁ = ${t2(rn(S1))}`}
for(let j=1;j<=s-k&&j<=k;j++){let q=Q[j-1][1]*Q[j][0];S2+=q;svg+=ar(X(j-1)+16,y1-8,X(j)-16,y0+8,'c2',k+j==s?3.6:2,1);if(k+j==s)cap=`<b style="color:#e67e22">↗ 虚线向上第 ${j} 步</b>：${t2(Q[j-1][1])} × ${t2(Q[j][0])} = ${t2(rn(q))}；累计 S₂ = ${t2(rn(S2))}`}
if(s==0)cap='准备：把顶点坐标排成上下两行，第一点重复写在最后一列。先画实线 ↘（x 乘下一列的 y），再画虚线 ↗（y 乘下一列的 x）。';

el.querySelector('.vw').innerHTML=`<svg viewBox="0 0 ${W} 150">${svg}</svg>`;el.querySelector('.cp').innerHTML=M(cap);el.querySelector('[data-a=p]').textContent=el.dataset.play=='1'?'⏸ 暂停':'▶ 继续'}
function initAn(){document.querySelectorAll('.an:not([data-d])').forEach(e=>{e.dataset.d=1;drawAn(e)})}
document.addEventListener('click',e=>{let b=e.target.closest('.an button');if(!b)return;let el=b.closest('.an'),a=b.dataset.a,n=2*JSON.parse(el.dataset.p).length+2,s=+el.dataset.s;
