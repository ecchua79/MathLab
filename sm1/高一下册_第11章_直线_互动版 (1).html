/* ===== 测验引擎 ===== */
const gr=s=>{s=s.replace(/[−–—]/g,'-').replace(/\s/g,'');const m=s.match(/^(-?[\d.]+)\/(-?[\d.]+)$/);return m?m[1]/m[2]:s===''?NaN:Number(s)};
function quiz(host,gens,cfg){function go(){host.innerHTML='';let done=0,sc=0;const ids=shuf(gens.map((_,i)=>i)),L=[];
const mu=cfg.must?cfg.must():[];mu.forEach(g=>L.push(g()));for(let i=mu.length;i<cfg.n;i++)L.push(gens[ids[i%ids.length]]());
const info=document.createElement('div');info.className='info';host.appendChild(info);const stat=()=>info.textContent=`选择题 ${done}/${cfg.n} 已完成 · 答对 ${sc} 题`;stat();
const mk=(t,x,f)=>{const c=document.createElement('div');c.className='qc';c.innerHTML=`<div class=qn>${t}${x.h?' <span class=hd>难题</span>':''}</div><div>${f?x.fq||x.q:x.q}</div>${(f?x.ff||x.f:x.f)||''}`;host.appendChild(c);return c};
const btn=()=>{const b=document.createElement('button');b.textContent='🔄 重新出题';b.onclick=go;host.appendChild(b)};
L.forEach((x,i)=>{const c=mk(`第 ${i+1} 题 · 选择题`,x),o=[x.a];x.w.forEach(w=>{if(!o.includes(w)&&o.length<4)o.push(w)});['以上皆非','条件不足','没有这样的值'].forEach(p=>{if(o.length<4)o.push(p)});
const ops=document.createElement('div');ops.className='ops';c.appendChild(ops);const ex=document.createElement('div');ex.className='ex';ex.hidden=true;c.appendChild(ex);
shuf(o.map((h,j)=>[h,j==0])).forEach(([h,ok],j)=>{const b=document.createElement('button');b.innerHTML='ABCD'[j]+'. '+h;b.dataset.ok=ok?1:'';b.onclick=()=>{ops.querySelectorAll('button').forEach(z=>{z.disabled=true;if(z.dataset.ok)z.classList.add('ok')});if(!ok)b.classList.add('no');else sc++;
ex.hidden=false;ex.innerHTML=(ok?'✔ 答对了！':`✘ 答错了。正确答案：${x.a}`)+'<br>'+x.e;done++;stat();if(done==cfg.n)after()};ops.appendChild(b)})});
function after(){const f=document.createElement('div');host.appendChild(f);if(sc<cfg.gate){f.innerHTML=`<div class="res no">答对 ${sc}/${cfg.n}，需答对 ${cfg.gate} 题以上才能挑战作答题，再试一次吧！</div>`;btn();return}
f.innerHTML=`<div class="res ok">选择题答对 ${sc}/${cfg.n}${cfg.gate?' —— 作答题解锁！':'，接着是作答题。'}</div>`;
const F=(cfg.fixed?cfg.fixed():[]).map(g=>{let x;do x=g();while(!x.fa);return x});let t=0;while(F.length<cfg.nf&&t++<80){const x=pick(gens)();if(x.fa)F.push(x)}let fd=0,fs=0;
F.slice(0,cfg.nf).forEach((x,i)=>{const c=mk(`第 ${i+1} 题 · 作答题`,x,1);c.insertAdjacentHTML('beforeend','<input class=ans placeholder="如 3/2 或 1.5"> <button>提交</button><div class=ex hidden></div>');
const inp=c.querySelector('input'),b=c.querySelector('button'),ex=c.querySelector('.ex');b.onclick=()=>{const v=gr(inp.value);if(isNaN(v)){inp.focus();return}const ok=Math.abs(v-x.fa[0]/x.fa[1])<.0051;inp.disabled=b.disabled=true;if(ok)fs++;
ex.hidden=false;ex.innerHTML=(ok?'✔ 答对了！':`✘ 答错了。正确答案：${q(x.fa[0],x.fa[1])}`)+'<br>'+(x.fe||x.e);fd++;if(fd==cfg.nf){const T=sc+fs,tt=cfg.n+cfg.nf;const r=document.createElement('div');r.className='res '+(T/tt>=.6?'ok':'no');
r.innerHTML=cfg.final?`总分 ${T}/${tt}（选择 ${sc}/${cfg.n} + 作答 ${fs}/${cfg.nf}）<br>评估：${T>=13?'🏆 优秀！掌握得很扎实':T>=10?'👍 良好，再巩固错题':T>=7?'🙂 及格，建议重看例题与计算器':'💪 加油！先从各节例题开始复习'}`:`作答题答对 ${fs}/${cfg.nf}${fs==cfg.nf?' 🎉 全对！':''}`;host.appendChild(r);btn()}}})}}
go()}
/* ===== 组装页面 ===== */
const nav=$('#nav'),main=$('#main'),all=G.flat().concat(H.filter(g=>g!=g53));

function initCalc(i){const h=$('#c'+i),cf=i==1?M2:[CALCS[i]];let md=0;h.innerHTML=(i==1?'<select>'+M2.map((m,j)=>`<option value=${j}>${m.n}</option>`).join('')+'</select><br>':'')+'<span class=ins></span><div class=out></div>';

build=()=>{ins.innerHTML=cf[md].l.map(([n,v])=>`<label>${n} <input type=number step=any value=${v}></label>`).join('');ins.querySelectorAll('input').forEach(e=>e.oninput=run);run()};

$('#fm').onclick=()=>sf(-1);$('#fp').onclick=()=>sf(1);
$('#th').onclick=()=>{const d=document.documentElement.dataset.t=='d';d?delete document.documentElement.dataset.t:document.documentElement.dataset.t='d';try{localStorage.setItem('l11th',d?'l':'d')}catch(e){}};
$('#wm').style.backgroundImage=`url("data:image/svg+xml,${encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="230" height="130"><text x="10" y="80" font-size="11" fill="#888" transform="rotate(-25 100 70)">蔡逸众 · ecchua79 · Chinese High School</text></svg>')}")`;
show(0);
