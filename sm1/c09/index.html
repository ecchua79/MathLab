function quiz(box,gm,gf,nm,nf,pass,fin){let sc=0,dn=0,fsc=0,fd=0;const ms=Array.from({length:nm},()=>pk(gm)()),bx=document.createElement('div');box.innerHTML='';box.append(bx);
 ms.forEach((q,i)=>{const d=document.createElement('div');d.className='card';d.innerHTML=`<b>选择题 ${i+1}</b>　${M(q.q)}`+q.o.map((o,j)=>`<button class=o data-j=${j}>${'ABCD'[j]}. ${M(o)}</button>`).join('')+`<div class=ex></div>`;

 function fills(bx){const h=document.createElement('h3');h.textContent='作答题（填充）';bx.append(h);

   d.querySelector('button').onclick=()=>{if(d.dataset.d)return;const v=d.querySelector('input').value.replace(/[，;；]/g,',').split(/[,\s]+/).filter(Boolean).map(pv).sort((a,b)=>a-b);if(!v.length||v.some(isNaN))return;d.dataset.d=1;const a=[...q.a].sort((x,y)=>x-y),ok=v.length==a.length&&a.every((x,k)=>Math.abs(x-v[k])<=q.tol);if(ok)fsc++;

const CS=[
 {h:'输入 sinA（可输入分数 如 4/5）与角所在象限',f:'<input id=c1 value="4/5" size=6> 象限 <select id=c2><option>1<option>2<option>3<option>4</select>',r(){const s=pv($('#c1').value),q=+$('#c2').value;if(isNaN(s)||Math.abs(s)>1)return'sinA 须在 −1 到 1 之间';if((s>0&&q>2)||(s<0&&q<3))return'sinA 的正负号与所选象限不符（第一、二象限为正，第三、四象限为负）';if(!s&&0)return'';const c=Math.sqrt(1-s*s)*(q==1||q==4?1:-1),th=(Math.atan2(s,c)/D+360)%360;
  return{t:`sin²A+cos²A=1 ⇒ cos²A=1−(${tf(s)})²=${tf(c*c)}<br>cosA=${tf(c)}${Math.abs(c)<1e-9?'':`<br>tanA=⟦sinA|cosA⟧=${tf(s/c)}`}<br>验算：(${tf(s)})²+(${tf(c)})²=${tf(s*s+c*c)} ✔`,g:circ({rays:[{a:th,l:'A'}],arcs:[{f:0,t:th||1,l:'A'}],proj:1,pl:['sinA='+tf(s).replace(/[⟦⟧⟨⟩]/g,'').replace('|','/'),'cosA']})}}},
 {h:'输入角 A、B（度）及运算',f:'A <input id=c1 value=45 size=4> B <input id=c2 value=30 size=4> <select id=c3><option>+<option>−</select>',r(){const a=pv($('#c1').value),b=pv($('#c2').value),m=$('#c3').value=='+'?1:-1;if(isNaN(a)||isNaN(b))return'请输入数字';const x=a+m*b,s=Math.sin,c=Math.cos,v=Math.tan;
  const sA=s(a*D),cA=c(a*D),sB=s(b*D),cB=c(b*D),o=m>0?'+':'−',o2=m>0?'−':'+',P=y=>`(${tf(y)})`;
  return{t:`已知 sinA=${tf(sA)}，cosA=${tf(cA)}，sinB=${tf(sB)}，cosB=${tf(cB)}<br>sin(A${o}B)=sinAcosB${o}cosAsinB<br>=${P(sA)}${P(cB)}${o}${P(cA)}${P(sB)}<br>=${tf(sA*cB+m*cA*sB)}<br>cos(A${o}B)=cosAcosB${o2}sinAsinB<br>=${P(cA)}${P(cB)}${o2}${P(sA)}${P(sB)}<br>=${tf(cA*cB-m*sA*sB)}<br>tan(A${o}B)=${Math.abs(c(x*D))<1e-9?'不存在（cos='+'0）':tf(v(x*D))}<br><small>（直接计算 ${x}° 验证一致）</small>`,g:circ({rays:[{a:a%360,l:'A'},{a:x%360,l:m>0?'A+B':'A−B'}],arcs:m>0?[{f:0,t:a,l:'A'},{f:a,t:x,l:'B'}]:[{f:0,t:Math.min(a,x),l:'r1'},{f:0,t:Math.max(a,x),l:'r2'}].map((o,i)=>({f:o.f,t:o.t,l:i?'A':'A−B'}))})}}},
 {h:'输入角 A（度）',f:'A <input id=c1 value=30 size=5>°',r(){const a=pv($('#c1').value);if(isNaN(a))return'请输入数字';const s=Math.sin,c=Math.cos;
  return{t:`sin2A=2sinAcosA=${tf(s(2*a*D))}<br>cos2A=cos²A−sin²A=${tf(c(2*a*D))}<br>tan2A=${Math.abs(c(2*a*D))<1e-9?'不存在':tf(Math.tan(2*a*D))}<br>半角：sin⟦A|2⟧=${tf(s(a/2*D))}，cos⟦A|2⟧=${tf(c(a/2*D))}`,g:circ({rays:[{a:a%360,l:'A'},{a:2*a%360,l:'2A'}],arcs:[{f:0,t:a||1,l:'A'},{f:0,t:2*a||1,l:'2A'}]})}}},
 {h:'解 f(x)=k，0°≤x<360°',f:'<select id=c1><option>sin<option>cos<option>tan</select>x = <input id=c2 value="1/2" size=7>',r(){const f=$('#c1').value,k=pv($('#c2').value);if(isNaN(k))return'请输入数字或分数';if(f!='tan'&&Math.abs(k)>1)return'此方程无解（−1≤'+f+'x≤1）';let r=[];for(let a=0;a<360;a+=.01){const A1=a*D,B1=(a+.01)*D,F=Math[f];const u=F(A1)-k,w=F(B1)-k;if(u*w<=0&&Math.abs(u-w)<.5&&Math.abs(F((a+.005)*D)-k)<.02)r.push(Math.round((a+.005)*100)/100)}
  r=r.filter((x,i)=>!i||x-r[i-1]>.5).map(x=>Math.round(x*10)/10);const rs=r.map(x=>x+'°').join('，')||'无解';return{t:`${f}x=${tf(k)} ⇒ 先找相伴锐角，再按象限(ASTC)判断<br>解：x=${rs}`,g:circ({pts:r.map(a=>({a,l:a+'°'})),h:f=='sin'?k:null,v:f=='cos'?k:null,hl:tf(k).replace(/[⟦⟧⟨⟩]/g,'').replace('|','/')})}}}];
