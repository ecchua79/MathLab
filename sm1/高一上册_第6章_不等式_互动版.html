const nav=$('nav'),main=$('main'),secs=[];
TT.forEach((T,i)=>{nav.insertAdjacentHTML('beforeend',`<button>${T.n}</button>`);
 main.insertAdjacentHTML('beforeend',`<section hidden><h2>${T.n}</h2><div class=box>${T.note}</div><h3>课本${T.ex}</h3><div class="box e"></div><h3>计算器</h3><div class=box><div class=f>${form(T,T.df)}</div><div class=out></div></div><h3>练习</h3><div class=qz></div></section>`);
 const s=main.lastElementChild,f=s.querySelector('.f'),o=s.querySelector('.out'),upd=()=>{try{o.innerHTML=T.run(read(f))}catch(e){o.textContent='请检查输入'}};
 s.querySelector('.e').innerHTML=T.run(T.xv);f.oninput=f.onchange=upd;upd();quiz(s.querySelector('.qz'),T.g.map(k=>G[k]),5,2,3);secs.push(s)});
nav.insertAdjacentHTML('beforeend','<button>总复习</button>');
main.insertAdjacentHTML('beforeend','<section hidden><h2>总复习（10 选择 + 5 填充）</h2><p>题目来自 6.1–6.5，每次随机生成。</p><div class=qz></div></section>');
quiz(main.lastElementChild.querySelector('.qz'),G,10,5,0,1);secs.push(main.lastElementChild);
const show=i=>{secs.forEach((s,j)=>s.hidden=j!=i);[...nav.children].forEach((b,j)=>b.classList.toggle('on',j==i))};
[...nav.children].forEach((b,i)=>b.onclick=()=>{show(i);scrollTo(0,0)});show(0);
let fs=15;try{fs=+localStorage.fs||15;if(localStorage.dk=='1')document.documentElement.classList.add('dk')}catch(e){}
const setF=v=>{fs=Math.min(22,Math.max(12,v));document.documentElement.style.fontSize=fs+'px';try{localStorage.fs=fs}catch(e){}};setF(fs);
$('#fm').onclick=()=>setF(fs-1);$('#fp').onclick=()=>setF(fs+1);
$('#th').onclick=()=>{const c=document.documentElement.classList.toggle('dk');try{localStorage.dk=c?1:0}catch(e){}};
$('#wm').innerHTML=Array(120).fill('<span>蔡逸众 · ecchua79 · Chinese High School</span>').join('');
</script></body></html>
