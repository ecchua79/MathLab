/* ---------- 界面 ---------- */
function calc(h,f,run){h.innerHTML=`<h3>🧮 专属计算器（输入数据，自动生成解答与图）</h3><div class=cf>${f.map(([k,l,d])=>`<label>${l}<input value="${d}" inputmode=decimal></label>`).join('')}</div><div class=co></div>`;
const I=[...h.querySelectorAll('input')],o=$('.co',h),go=()=>{const v={};f.forEach(([k],i)=>v[k]=pr(I[i].value));try{o.innerHTML=Object.values(v).some(isNaN)?'请输入有效数字':run(v)}catch(e){o.innerHTML='输入有误'}};I.forEach(i=>i.oninput=go);go()}
const L='ABCD';
function quiz(h,gm,gf,nM,nF,thr,rev,again){again=again||(()=>quiz(h,gm,gf,nM,nF,thr,rev));h.innerHTML=`<h2>✏️ ${rev?'总复习（10题选择 + 5题作答）':'随堂测验（5题选择，答对3题以上可做2题作答）'}</h2><div class=qs></div><div class=fl></div><div class=rs></div><button class=btn>🔄 换一组新题</button>`;
const qs=$('.qs',h),fl=$('.fl',h),rs=$('.rs',h);$('.btn',h).onclick=again;let done=0,ok=0;
sh(gm).slice(0,nM).forEach((g,i)=>{const q=g(),box=document.createElement('div');box.className='qc';box.innerHTML=`<b>第 ${i+1} 题</b>　${q.q}${q.o.map((t,j)=>`<button class=op>${L[j]}. ${t}</button>`).join('')}<div class=ex hidden></div>`;qs.append(box);
const ex=$('.ex',box);box.querySelectorAll('.op').forEach((b,j)=>b.onclick=()=>{if(box.dataset.d)return;box.dataset.d=1;const good=j===q.a;box.querySelectorAll('.op').forEach((x,k)=>{x.disabled=true;if(k===q.a)x.classList.add('ok')});if(!good)b.classList.add('bad');
ex.innerHTML=`<b>${good?'✅ 正确！':'❌ 错误，正确答案是 '+L[q.a]}</b><br>${q.e}${q.s||''}`;ex.hidden=false;if(good)ok++;if(++done==nM)fin()})});
function fin(){rs.innerHTML=`选择题：${ok} / ${nM}`;if(ok<thr){rs.innerHTML+=`　😅 需答对 ${thr} 题才能解锁作答题，请点「换一组新题」再试！`;return}
fl.innerHTML=`<h2>📝 作答题（输入数字，可写分数如 3/4）</h2>`;let fd=0,fo=0;sh(gf).slice(0,nF).forEach((g,i)=>{const q=g(),b=document.createElement('div');b.className='qc';b.innerHTML=`<b>第 ${i+1} 题</b>　${q.q}<br><input class=fi> <button class=btn>提交</button><div class=ex hidden></div>`;fl.append(b);const ex=$('.ex',b),inp=$('.fi',b);
$('.btn',b).onclick=()=>{if(b.dataset.d)return;const v=pr(inp.value);if(isNaN(v))return;b.dataset.d=1;inp.disabled=true;const good=Math.abs(v-q.a)<=(q.tol||1e-6);ex.innerHTML=`<b>${good?'✅ 正确！':'❌ 错误，正确答案：'+(q.fm?q.fm(q.a):sgn(q.a))}</b><br>${q.e}${q.s||''}`;ex.hidden=false;if(good)fo++;
if(++fd==nF){const T=ok+fo,Z=nM+nF;rs.innerHTML=`选择题 ${ok}/${nM}　作答题 ${fo}/${nF}`+(rev?`<br>🏁 总分：${T} / ${Z}（${Math.round(T/Z*100)}%）— ${T>=Z*.87?'🏆 优秀！掌握非常扎实':T>=Z*.67?'👍 良好，再巩固失分的部分':T>=Z*.47?'💪 及格，建议重做各节例题与测验':'📚 需加强，请先回到 13.1–13.4 逐节复习'}`:`　🎉 本节完成！`)}}})}}
const RP=()=>{const mp=[...G1m,...G2m,...G3m,...G4m,H1,H1],fp=[...G1f,...G2f,...G3f,...G4f];return{m:sh(mp).slice(0,10),f:sh(fp).slice(0,3).concat([H2,H3])}};
function revInit(){const g=RP();quiz($('#qr'),g.m,g.f,10,5,0,true,revInit)}
function gen(h){h.innerHTML=`<h3>🔎 通项公式生成器（输入数列，自动找出通项公式）</h3><div class=cf><label>数列（用逗号隔开，至少3项）<input value="2,6,10,14"></label><label>求第 n 项<input value="10" inputmode=numeric></label></div><div class=co></div>`;
const I=h.querySelectorAll('input'),o=$('.co',h),e=(a,b)=>Math.abs(a-b)<1e-9*Math.max(1,Math.abs(a),Math.abs(b));
const poly=c=>{let s='';[[c[0],'n²'],[c[1],'n'],[c[2],'']].forEach(([k,v])=>{if(Math.abs(k)<1e-9)return;const ab=Math.abs(k);s+=(s?(k<0?' − ':' + '):(k<0?'−':''))+((ab==1&&v)?'':N(ab))+v});return s||'0'};
const go=()=>{const t=I[0].value.split(/[,，、\s]+/).filter(x=>x!=='').map(pr),n=Math.round(pr(I[1].value));
if(t.length<3||t.length>12||t.some(isNaN)){o.innerHTML='请输入 3–12 个数字，用逗号隔开';return}
const a=t[0],df=t.slice(1).map((x,i)=>x-t[i]),d2=df.slice(1).map((x,i)=>x-df[i]);let f,s,l=null;
if(df.every(x=>e(x,df[0]))){const d=df[0];f=k=>a+(k-1)*d;l=lab(d);s=`<p>相邻两项的差都是 <b>${N(d)}</b> ⇒ <b>等差数列</b>：a = ${N(a)}，d = ${N(d)}</p><p>${an} = a + (n−1)d = ${N(a)} + (n−1)(${N(d)}) = <b>${poly([0,d,a-d])}</b></p>`}
else if(t.every(x=>x!==0)&&t.slice(1).every((x,i)=>e(x/t[i],t[1]/t[0]))){const r=t[1]/t[0];f=k=>a*r**(k-1);l='×'+tx(r);s=`<p>相邻两项的比都是 <b>${N(r)}</b> ⇒ <b>等比数列</b>：a = ${N(a)}，r = ${N(r)}</p><p>${an} = a·r<sup>n−1</sup> = <b>${N(a)} × (${N(r)})<sup>n−1</sup></b></p>`}
else if(d2.length>=2&&d2.every(x=>e(x,d2[0]))&&!e(d2[0],0)){const D=d2[0],A=D/2,B=df[0]-1.5*D,C=a-A-B;f=k=>A*k*k+B*k+C;s=`<p>一阶差：${df.map(tx).join('，')}（不相等）<br>二阶差：${d2.map(tx).join('，')}（都是 ${N(D)}）⇒ <b>二次型</b> ${an} = An² + Bn + C，其中 A = ${fr('二阶差',2)} = ${N(A)}</p><p>${an} = <b>${poly([A,B,C])}</b></p>`}
else{o.innerHTML='<p>找不到简单规律。可识别：等差（相邻差相同）、等比（相邻比相同）、二次型（差的差相同，至少4项）。</p>'+seq(t.concat(['…']));return}
o.innerHTML=s+(n>=1?`<p>第 ${n} 项：${ak(n)} = <b>${N(f(n))}</b></p>`:'')+`<p>检验：${t.map((_,i)=>`${ak(i+1)}=${tx(f(i+1))}`).join('，')}</p>`+seq(t.concat(['…']),l,[],t.map((_,i)=>'a'+(i+1)))};
I.forEach(i=>i.oninput=go);go()}
const nav=$('#nav'),main=$('#main'),names=SEC.map(s=>s.n).concat(['总复习']);
SEC.forEach((s,i)=>{main.insertAdjacentHTML('beforeend',`<section class=pane id=p${i}><div class=card>${s.intro}</div><h2>📖 课本例题</h2>${s.ex.map(e=>`<div class=card><span class=tag>${e.t}</span> ${e.q}<div class=sol>${e.sol}</div>${e.v}</div>`).join('')}<div class=card id=c${i}></div>${i==0?'<div class=card id=g0></div>':''}<div class=card id=q${i}></div></section>`);calc($('#c'+i),s.f,s.run);if(i==0)gen($('#g0'));quiz($('#q'+i),s.gm,s.gf,5,2,3,false)});
main.insertAdjacentHTML('beforeend','<section class=pane id=p4><div class=card><h2>总复习 · 第13章</h2><p>10 题选择题 + 5 题作答题，由前面各节的题型与较难的总复习题随机生成；完成后给出分数评估。</p></div><div class=card id=qr></div></section>');revInit();
names.forEach((n,i)=>{const b=document.createElement('button');b.textContent=n;b.onclick=()=>show(i);nav.append(b)});

const Z=[14,16,18,20,23];let zi=1;const zs=d=>{zi=Math.max(0,Math.min(4,zi+d));document.documentElement.style.fontSize=Z[zi]+'px'};$('#fm').onclick=()=>zs(-1);$('#fp').onclick=()=>zs(1);$('#fn').onclick=()=>{zi=1;zs(0)};
$('#th').onclick=()=>{const d=document.documentElement.dataset;d.t=d.t=='dark'?'':'dark'};
if(matchMedia('(prefers-color-scheme:dark)').matches)document.documentElement.dataset.t='dark';
