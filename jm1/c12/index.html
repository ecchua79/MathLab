<script>
/* ===================== 基础工具函数 ===================== */
function randInt(min,max){ return Math.floor(Math.random()*(max-min+1))+min; }
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}
function roundN(x,d=2){ const p=Math.pow(10,d); return Math.round(x*p)/p; }

function makeOptions(correct, candidates){
  let vals = [];
  for(const c of candidates){
    if(c===undefined || c===null || Number.isNaN(c)) continue;
    const cv = roundN(c);
    if(Math.abs(cv-correct) < 0.001) continue;
    if(!vals.some(v=>Math.abs(v-cv)<0.001)) vals.push(cv);
  }
  vals = shuffle(vals).slice(0,3);
  let guard = 0;
  while(vals.length < 3 && guard < 30){
    guard++;
    const delta = randInt(4,18) * (Math.random()<0.5?-1:1);
    let perturb = roundN(correct + delta);
    if(perturb < 0) perturb = Math.abs(perturb) + 1;
    if(Math.abs(perturb-correct)>0.001 && !vals.some(v=>Math.abs(v-perturb)<0.001)){
      vals.push(perturb);
    }
  }
  return shuffle([correct, ...vals]);
}

/* ===================== SVG 小图 ===================== */
function svgClock(H,M){
  const Heff = H%12;
  const minuteAngle = M*6;                 // 分针角度 (从12点方向顺时针)
  const hourAngle = (Heff*30) + (M*0.5);    // 时针角度
  function pt(cx,cy,r,deg){
    const rad = (deg-90) * Math.PI/180;
    return [cx + r*Math.cos(rad), cy + r*Math.sin(rad)];
  }
  const cx=90, cy=90;
  const [hx,hy] = pt(cx,cy,42,hourAngle);
  const [mx,my] = pt(cx,cy,62,minuteAngle);
  let ticks = '';
  for(let i=0;i<12;i++){
    const [x1,y1] = pt(cx,cy,72,i*30);
    const [x2,y2] = pt(cx,cy,64,i*30);
    ticks += `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="var(--muted)" stroke-width="2"/>`;
  }
  return `<svg class="diagram" width="180" height="180" viewBox="0 0 180 180">
    <circle cx="${cx}" cy="${cy}" r="76" fill="none" stroke="var(--accent)" stroke-width="3"/>
    ${ticks}
    <line x1="${cx}" y1="${cy}" x2="${hx.toFixed(1)}" y2="${hy.toFixed(1)}" stroke="var(--text)" stroke-width="5" stroke-linecap="round"/>
    <line x1="${cx}" y1="${cy}" x2="${mx.toFixed(1)}" y2="${my.toFixed(1)}" stroke="var(--accent-2)" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="${cx}" cy="${cy}" r="4" fill="var(--danger)"/>
  </svg>`;
}

/* 通用：用采样多段线绘制圆弧，避免SVG椭圆弧命令的大弧/方向标志混淆
   角度约定：0°=正右方，角度增大＝顺时针方向（与屏幕y轴向下一致） */
function arcPoly(cx,cy,r,startDeg,endDeg,steps){
  steps = steps || 24;
  let pts=[];
  for(let i=0;i<=steps;i++){
    const d = startDeg + (endDeg-startDeg)*i/steps;
    const rad = d*Math.PI/180;
    pts.push(`${(cx+r*Math.cos(rad)).toFixed(1)},${(cy+r*Math.sin(rad)).toFixed(1)}`);
  }
  return `<polyline points="${pts.join(' ')}" fill="none" stroke="var(--accent-2)" stroke-width="2.5"/>`;
}

function svgParallel(){
  const cy1=90, cy2=210;               // AB、CD两条水平线的高度
  const cx1=122.5, cx2=212.5;          // 截线与两条直线的交点
  const ang=53.13;                     // 截线与水平线的夹角（3-4-5三角形，角度干净）
  const r=22, lr=38;                   // 弧线半径／数字标示半径
  // 8个角的角度区间：按真实几何计算，确保同位角、内错角、同旁内角关系与课文一致，
  // 且每个角有各自独立的扇形区间，绝不会与相邻角重叠
  const sectors=[
    {pos:1, cx:cx1, cy:cy1, s:180,      e:180+ang},
    {pos:2, cx:cx1, cy:cy1, s:180+ang,  e:360},
    {pos:3, cx:cx1, cy:cy1, s:0,        e:ang},
    {pos:4, cx:cx1, cy:cy1, s:ang,      e:180},
    {pos:5, cx:cx2, cy:cy2, s:180,      e:180+ang},
    {pos:6, cx:cx2, cy:cy2, s:180+ang,  e:360},
    {pos:7, cx:cx2, cy:cy2, s:0,        e:ang},
    {pos:8, cx:cx2, cy:cy2, s:ang,      e:180},
  ];
  let arcsSvg='', labelsSvg='';
  sectors.forEach(sec=>{
    arcsSvg += arcPoly(sec.cx, sec.cy, r, sec.s, sec.e);
    const mid = (sec.s+sec.e)/2;
    const rad = mid*Math.PI/180;
    const lx = sec.cx + lr*Math.cos(rad);
    const ly = sec.cy + lr*Math.sin(rad);
    labelsSvg += `<text x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" font-size="13" fill="var(--muted)" text-anchor="middle" dominant-baseline="middle">${sec.pos}</text>`;
  });
  return `<div class="diagram-wrap"><svg class="diagram" width="320" height="300" viewBox="0 0 320 300">
    <line x1="30" y1="${cy1}" x2="285" y2="${cy1}" stroke="var(--accent)" stroke-width="3"/>
    <line x1="30" y1="${cy2}" x2="285" y2="${cy2}" stroke="var(--accent)" stroke-width="3"/>
    <line x1="70" y1="20" x2="250" y2="260" stroke="var(--danger)" stroke-width="3"/>
    <text x="16" y="${cy1+5}" font-size="14" fill="var(--text)">A</text>
    <text x="291" y="${cy1+5}" font-size="14" fill="var(--text)">B</text>
    <text x="16" y="${cy2+5}" font-size="14" fill="var(--text)">C</text>
    <text x="291" y="${cy2+5}" font-size="14" fill="var(--text)">D</text>
    <text x="62" y="14" font-size="14" fill="var(--text)">E</text>
    <text x="248" y="278" font-size="14" fill="var(--text)">F</text>
    ${arcsSvg}
    ${labelsSvg}
  </svg><div class="cap">AB∥CD，EF为截线；内角为∠3∠4∠5∠6，外角为∠1∠2∠7∠8（每个角均按实际几何角度独立标示，不重叠）</div></div>`;
}

/* ---- 12.1 三角形辅助图：点、线、顶点、边 ---- */
function svgTrianglePLF(){

    <polygon points="130,20 40,180 220,180" fill="none" stroke="var(--accent)" stroke-width="3"/>

  </svg><div class="cap">三角形ABC：A、B、C是点（也是顶点）；AB、BC、CA是边（也是线段）</div></div>`;
}
function svgLineTypes(){

    <defs>
      <marker id="arwR" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="var(--accent)"/></marker>
      <marker id="arwL" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 Z" fill="var(--accent)"/></marker>

/* ---- 12.2 图形对称性图库（正多边形 / 常见图形都配SVG小图）---- */
function polyPoints(n,cx,cy,r,rotDeg){
  let pts=[];
  for(let i=0;i<n;i++){
    const a=(rotDeg + i*(360/n))*Math.PI/180;
    pts.push(`${(cx+r*Math.cos(a)).toFixed(1)},${(cy+r*Math.sin(a)).toFixed(1)}`);
  }
  return pts.join(' ');
}
function axisLineSVG(x1,y1,x2,y2){
  return `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="var(--danger)" stroke-width="1.3" stroke-dasharray="3,2"/>`;
}
function polygonVertex(n,i,cx,cy,r,rotDeg){
  const a=(rotDeg + (i%n+n)%n*(360/n))*Math.PI/180;
  return [cx+r*Math.cos(a), cy+r*Math.sin(a)];
}
function polygonAxesSVG(n,cx,cy,r,rotDeg){
  let lines=[];
  if(n%2===0){
    for(let i=0;i<n/2;i++){
      const v1=polygonVertex(n,i,cx,cy,r,rotDeg);
      const v2=polygonVertex(n,i+n/2,cx,cy,r,rotDeg);
      lines.push([v1,v2]);
    }
    for(let i=0;i<n/2;i++){
      const a=polygonVertex(n,i,cx,cy,r,rotDeg), b=polygonVertex(n,i+1,cx,cy,r,rotDeg);
      const mid1=[(a[0]+b[0])/2,(a[1]+b[1])/2];
      const c=polygonVertex(n,i+n/2,cx,cy,r,rotDeg), dd=polygonVertex(n,i+n/2+1,cx,cy,r,rotDeg);
      const mid2=[(c[0]+dd[0])/2,(c[1]+dd[1])/2];
      lines.push([mid1,mid2]);
    }
  } else {
    for(let i=0;i<n;i++){
      const v=polygonVertex(n,i,cx,cy,r,rotDeg);
      const a=polygonVertex(n,i+Math.floor(n/2),cx,cy,r,rotDeg);
      const b=polygonVertex(n,i+Math.ceil(n/2),cx,cy,r,rotDeg);
      const mid=[(a[0]+b[0])/2,(a[1]+b[1])/2];
      lines.push([v,mid]);
    }
  }
  return lines.map(l=>axisLineSVG(l[0][0],l[0][1],l[1][0],l[1][1])).join('');
}
function shapeIconSVG(d){

      axesSvg = axisLineSVG(8,45,82,45) + axisLineSVG(45,24,45,66); break;
    case 'rhombus':

      axesSvg = axisLineSVG(45,8,45,82) + axisLineSVG(12,45,78,45); break;
    case 'parallelogram':
      shape = `<polygon points="20,18 80,18 65,72 5,72" fill="none" stroke="var(--accent)" stroke-width="3"/>`;
      axesSvg = ''; break;
    case 'triEq':

      axesSvg = polygonAxesSVG(3,cx,cy,r,-90); break;
    case 'triIso':
      shape = `<polygon points="45,8 78,78 12,78" fill="none" stroke="var(--accent)" stroke-width="3"/>`;
      axesSvg = axisLineSVG(45,8,45,78); break;
    case 'pentagon':
      shape = `<polygon points="${polyPoints(5,cx,cy,r,-90)}" fill="none" stroke="var(--accent)" stroke-width="3"/>`;
      axesSvg = polygonAxesSVG(5,cx,cy,r,-90); break;
    case 'hexagon':
      shape = `<polygon points="${polyPoints(6,cx,cy,r,0)}" fill="none" stroke="var(--accent)" stroke-width="3"/>`;
      axesSvg = polygonAxesSVG(6,cx,cy,r,0); break;
    case 'circle':
      shape = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--accent)" stroke-width="3"/>`;
      axesSvg = [0,45,90,135].map(a=>{
        const rad=a*Math.PI/180;
        const x1=cx+r*Math.cos(rad), y1=cy+r*Math.sin(rad);
        const x2=cx-r*Math.cos(rad), y2=cy-r*Math.sin(rad);
        return axisLineSVG(x1,y1,x2,y2);
      }).join('');
      break;
    default:
      shape = `<text x="${cx}" y="${cy+17}" font-size="50" text-anchor="middle" font-weight="700" fill="var(--accent)">${kind}</text>`;
      if(d.axes===2){ axesSvg = axisLineSVG(cx,8,cx,82) + axisLineSVG(6,cy,84,cy); }
      else if(d.axes===1){ axesSvg = axisLineSVG(cx,8,cx,82); }
      break;
  }
  return `<svg width="90" height="90" viewBox="0 0 90 90">${shape}${axesSvg}</svg>`;
}

/* ---- 12.3 量角器辅助图 ---- */
function svgProtractor(){
  const cx=150, cy=140, R=105;
  let ticks='';
  for(let d=0; d<=180; d+=10){
    const rad=(180-d)*Math.PI/180;
    const len=(d%30===0)?14:8;
    const x1=cx+R*Math.cos(rad), y1=cy-R*Math.sin(rad);
    const x2=cx+(R-len)*Math.cos(rad), y2=cy-(R-len)*Math.sin(rad);
    ticks+=`<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="var(--muted)" stroke-width="${d%30===0?2:1}"/>`;
    if(d%30===0){
      const lx=cx+(R-28)*Math.cos(rad), ly=cy-(R-28)*Math.sin(rad);
      ticks+=`<text x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" font-size="11" fill="var(--muted)" text-anchor="middle">${d}°</text>`;
    }
  }
  function rayEnd(deg,len){ const rad=(180-deg)*Math.PI/180; return [cx+len*Math.cos(rad), cy-len*Math.sin(rad)]; }
  const [ax,ay]=rayEnd(15,120);
  const [bx,by]=rayEnd(100,120);
  return `<div class="diagram-wrap"><svg class="diagram" width="300" height="175" viewBox="0 0 300 175">
    <path d="M ${cx-R} ${cy} A ${R} ${R} 0 0 1 ${cx+R} ${cy}" fill="none" stroke="var(--accent)" stroke-width="2"/>
    <line x1="${cx-R}" y1="${cy}" x2="${cx+R}" y2="${cy}" stroke="var(--accent)" stroke-width="2"/>
    ${ticks}
    <line x1="${cx}" y1="${cy}" x2="${ax.toFixed(1)}" y2="${ay.toFixed(1)}" stroke="var(--danger)" stroke-width="3"/>
    <line x1="${cx}" y1="${cy}" x2="${bx.toFixed(1)}" y2="${by.toFixed(1)}" stroke="var(--danger)" stroke-width="3"/>
    <circle cx="${cx}" cy="${cy}" r="3" fill="var(--text)"/>
  </svg><div class="cap">零刻度线未必对齐角的一边——角的度数＝两读数之差（示意：读数约15°与100°，角＝85°）</div></div>`;
}

/* ---- 12.3：可调式量角器 —— 可任意旋转0°位置、任意拖出角度，实时显示读数与角度 ---- */
function initProtractorWidget(containerId){
  const container = document.getElementById(containerId);
  if(!container) return;
  const size=300, cy2=320, cx=150, cy=150, dialR=120, rayR=100;
  let phi=0, thetaA=20, thetaB=100, dragging=null;

  container.innerHTML = `<svg id="${containerId}_svg" class="diagram" width="300" height="320" viewBox="0 0 300 320" style="touch-action:none">
      <g id="${containerId}_dial"></g>
      <line id="${containerId}_rayA" stroke="var(--danger)" stroke-width="3"/>
      <line id="${containerId}_rayB" stroke="var(--accent-2)" stroke-width="3"/>
      <circle cx="${cx}" cy="${cy}" r="3" fill="var(--text)"/>
      <circle id="${containerId}_hA" r="9" fill="var(--danger)" style="cursor:grab"/>
      <circle id="${containerId}_hB" r="9" fill="var(--accent-2)" style="cursor:grab"/>
      <circle id="${containerId}_hD" r="8" fill="var(--accent)" style="cursor:grab"/>
    </svg>
    <div style="text-align:center;margin-top:4px;font-size:0.92rem">
      <span style="color:var(--danger)">A边读数 <b id="${containerId}_rA">-</b>°</span>　
      <span style="color:var(--accent-2)">B边读数 <b id="${containerId}_rB">-</b>°</span><br>
      <span>∠AOB＝<b id="${containerId}_ang" style="color:var(--accent);font-size:1.15rem">-</b>°　（<span id="${containerId}_nm">-</span>）</span>
    </div>
    <div class="cap">拖动红／绿端点可画出任意角度；拖动蓝色手柄能把0°刻度线旋到任何位置——两边读数之差永远等于真实角度！</div>`;

  const svgEl=document.getElementById(containerId+'_svg');
  const dialG=document.getElementById(containerId+'_dial');
  const rayA=document.getElementById(containerId+'_rayA');
  const rayB=document.getElementById(containerId+'_rayB');
  const hA=document.getElementById(containerId+'_hA');
  const hB=document.getElementById(containerId+'_hB');
  const hD=document.getElementById(containerId+'_hD');
  const rAOut=document.getElementById(containerId+'_rA');
  const rBOut=document.getElementById(containerId+'_rB');
  const angOut=document.getElementById(containerId+'_ang');
  const nmOut=document.getElementById(containerId+'_nm');

  function norm360(a){ a=a%360; if(a<0)a+=360; return a; }
  function classify(a){
    if(a>0&&a<90) return '锐角';
    if(Math.abs(a-90)<0.5) return '直角';
    if(a>90&&a<180) return '钝角';
    if(Math.abs(a-180)<0.5) return '平角';
    if(a>180&&a<360) return '优角';
    return '—';
  }
  function buildDial(){
    let html=`<circle cx="${cx}" cy="${cy}" r="${dialR}" fill="none" stroke="var(--accent)" stroke-width="2"/>`;
    for(let d=0; d<360; d+=10){
      const rad=d*Math.PI/180, len=(d%30===0)?14:8;
      const x1=cx+dialR*Math.cos(rad), y1=cy+dialR*Math.sin(rad);
      const x2=cx+(dialR-len)*Math.cos(rad), y2=cy+(dialR-len)*Math.sin(rad);
      html+=`<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="var(--muted)" stroke-width="${d%30===0?2:1}"/>`;
      if(d%30===0){
        const lx=cx+(dialR-28)*Math.cos(rad), ly=cy+(dialR-28)*Math.sin(rad);
        html+=`<text x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" font-size="11" fill="var(--muted)" text-anchor="middle" dominant-baseline="middle">${d}</text>`;
      }
    }
    html+=`<line x1="${cx}" y1="${cy}" x2="${cx+dialR}" y2="${cy}" stroke="var(--accent)" stroke-width="2" stroke-dasharray="4,3"/>`;
    dialG.innerHTML=html;
    dialG.setAttribute('transform',`rotate(${phi.toFixed(1)} ${cx} ${cy})`);
  }
  function render(){
    buildDial();
    const radA=thetaA*Math.PI/180, radB=thetaB*Math.PI/180;
    const ax=cx+rayR*Math.cos(radA), ay=cy+rayR*Math.sin(radA);
    const bx=cx+rayR*Math.cos(radB), by=cy+rayR*Math.sin(radB);
    rayA.setAttribute('x1',cx); rayA.setAttribute('y1',cy); rayA.setAttribute('x2',ax.toFixed(1)); rayA.setAttribute('y2',ay.toFixed(1));
    rayB.setAttribute('x1',cx); rayB.setAttribute('y1',cy); rayB.setAttribute('x2',bx.toFixed(1)); rayB.setAttribute('y2',by.toFixed(1));
    hA.setAttribute('cx',ax.toFixed(1)); hA.setAttribute('cy',ay.toFixed(1));
    hB.setAttribute('cx',bx.toFixed(1)); hB.setAttribute('cy',by.toFixed(1));
    const dRad=phi*Math.PI/180;
    hD.setAttribute('cx',(cx+(dialR+15)*Math.cos(dRad)).toFixed(1));
    hD.setAttribute('cy',(cy+(dialR+15)*Math.sin(dRad)).toFixed(1));
    const rA=norm360(thetaA-phi), rB=norm360(thetaB-phi);
    let diff=Math.abs(rA-rB); if(diff>180) diff=360-diff;
    rAOut.textContent=rA.toFixed(0);
    rBOut.textContent=rB.toFixed(0);
    angOut.textContent=diff.toFixed(0);
    nmOut.textContent=classify(diff);
  }
  function svgPoint(evt){
    const rect=svgEl.getBoundingClientRect();
    const sx=300/rect.width, sy=320/rect.height;
    return {x:(evt.clientX-rect.left)*sx, y:(evt.clientY-rect.top)*sy};
  }
  function attach(handle,which){
    handle.addEventListener('pointerdown',function(e){ dragging=which; handle.setPointerCapture(e.pointerId); e.preventDefault(); });
    handle.addEventListener('pointermove',function(e){
      if(dragging!==which) return;
      const p=svgPoint(e);
      const a=Math.atan2(p.y-cy,p.x-cx)*180/Math.PI;
      if(which==='A') thetaA=a; else if(which==='B') thetaB=a; else phi=a;
      render();
    });
    handle.addEventListener('pointerup',function(){dragging=null;});
    handle.addEventListener('pointercancel',function(){dragging=null;});
  }
  attach(hA,'A'); attach(hB,'B'); attach(hD,'DIAL');
  render();
}

    </svg>
    <div style="text-align:center;margin-top:4px;font-size:0.9rem" id="${containerId}_ro"></div>
    <div class="cap">拖动两个端点任意改变两条直线的夹角——同色的一对对顶角，无论角度多大或多小，恒相等！</div>`;

  const svgEl=document.getElementById(containerId+'_svg');
  const dyn=document.getElementById(containerId+'_dyn');
  const h1=document.getElementById(containerId+'_h1');
  const h2=document.getElementById(containerId+'_h2');
  const ro=document.getElementById(containerId+'_ro');

  function norm360(a){ a=a%360; if(a<0)a+=360; return a; }
  function render(){
    const a1=norm360(alpha), a2=norm360(beta);
    let rays=[a1, norm360(a1+180), a2, norm360(a2+180)].sort((x,y)=>x-y);
    let gaps=[];
    for(let i=0;i<4;i++){
      const nextA=(i<3)? rays[i+1] : rays[0]+360;
      gaps.push(nextA-rays[i]);
    }
    const r=28, lr=48;
    const colors=['var(--accent-2)','var(--danger)','var(--accent-2)','var(--danger)'];
    let html='';
    [a1,a2].forEach(ang=>{
      const rad=ang*Math.PI/180;
      const x1=cx+R*Math.cos(rad), y1=cy+R*Math.sin(rad);
      const x2=cx-R*Math.cos(rad), y2=cy-R*Math.sin(rad);
      html+=`<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="var(--text)" stroke-width="2.5"/>`;
    });
    for(let i=0;i<4;i++){
      html += arcPoly(cx,cy,r,rays[i],rays[i]+gaps[i]);
      const mid=rays[i]+gaps[i]/2, rad=mid*Math.PI/180;
      const lx=cx+lr*Math.cos(rad), ly=cy+lr*Math.sin(rad);
      html += `<text x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" font-size="13" fill="${colors[i]}" text-anchor="middle" dominant-baseline="middle">${gaps[i].toFixed(0)}°</text>`;
    }
    dyn.innerHTML=html;
    h1.setAttribute('cx',(cx+R*Math.cos(a1*Math.PI/180)).toFixed(1));
    h1.setAttribute('cy',(cy+R*Math.sin(a1*Math.PI/180)).toFixed(1));
    h2.setAttribute('cx',(cx+R*Math.cos(a2*Math.PI/180)).toFixed(1));
    h2.setAttribute('cy',(cy+R*Math.sin(a2*Math.PI/180)).toFixed(1));
    ro.innerHTML = `<b style="color:var(--accent-2)">∠＝${gaps[0].toFixed(0)}°＝${gaps[2].toFixed(0)}°</b>　<b style="color:var(--danger)">∠＝${gaps[1].toFixed(0)}°＝${gaps[3].toFixed(0)}°</b>`;
  }
  function svgPoint(evt){
    const rect=svgEl.getBoundingClientRect();
    const sx=300/rect.width, sy=230/rect.height;
    return {x:(evt.clientX-rect.left)*sx, y:(evt.clientY-rect.top)*sy};
  }
  function attach(handle,which){
    handle.addEventListener('pointerdown',function(e){ dragging=which; handle.setPointerCapture(e.pointerId); e.preventDefault(); });
    handle.addEventListener('pointermove',function(e){
      if(dragging!==which) return;
      const p=svgPoint(e);
      const a=Math.atan2(p.y-cy,p.x-cx)*180/Math.PI;
      if(which===1) alpha=a; else beta=a;
      render();
    });
    handle.addEventListener('pointerup',function(){dragging=null;});
    handle.addEventListener('pointercancel',function(){dragging=null;});
  }
  attach(h1,1); attach(h2,2);
  render();
}

/* ---- 12.7：可调式截线 —— 任意拖动截线EF的角度，实时验证同位角/内错角/同旁内角关系 ---- */
function initParallelWidget(containerId){
  const container = document.getElementById(containerId);
  if(!container) return;
  const cy1=90, cy2=210, xMin=30, xMax=285;
  let E={x:70,y:20}, F={x:250,y:260}, dragging=null;

  container.innerHTML = `<svg id="${containerId}_svg" class="diagram" width="320" height="300" viewBox="0 0 320 300" style="touch-action:none">
      <line x1="${xMin}" y1="${cy1}" x2="${xMax}" y2="${cy1}" stroke="var(--accent)" stroke-width="3"/>
      <line x1="${xMin}" y1="${cy2}" x2="${xMax}" y2="${cy2}" stroke="var(--accent)" stroke-width="3"/>
      <text x="16" y="${cy1+5}" font-size="14" fill="var(--text)">A</text>
      <text x="291" y="${cy1+5}" font-size="14" fill="var(--text)">B</text>
      <text x="16" y="${cy2+5}" font-size="14" fill="var(--text)">C</text>
      <text x="291" y="${cy2+5}" font-size="14" fill="var(--text)">D</text>
      <g id="${containerId}_dyn"></g>
      <circle id="${containerId}_hE" r="9" fill="var(--danger)" style="cursor:grab"/>
      <circle id="${containerId}_hF" r="9" fill="var(--danger)" style="cursor:grab"/>
    </svg>
    <div style="text-align:center;margin-top:4px;font-size:0.92rem">
      <span style="color:var(--accent-2)">∠1＝∠3＝∠5＝∠7＝<b id="${containerId}_t1">-</b>°</span>　
      <span style="color:var(--danger)">∠2＝∠4＝∠6＝∠8＝<b id="${containerId}_t2">-</b>°</span>
    </div>
    <div class="cap">拖动红色端点E、F，任意改变截线EF的角度——同位角、内错角、对顶角始终保持相等；同旁内角、邻补角始终互补！</div>`;

  const svgEl=document.getElementById(containerId+'_svg');
  const dyn=document.getElementById(containerId+'_dyn');
  const hE=document.getElementById(containerId+'_hE');
  const hF=document.getElementById(containerId+'_hF');
  const t1Out=document.getElementById(containerId+'_t1');
  const t2Out=document.getElementById(containerId+'_t2');

  function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }
  function render(){
    E.x=clamp(E.x,5,315); E.y=clamp(E.y,5,cy1-5);
    F.x=clamp(F.x,5,315); F.y=clamp(F.y,cy2+5,295);
    const t90=(cy1-E.y)/(F.y-E.y), t210=(cy2-E.y)/(F.y-E.y);
    const xO1=E.x+t90*(F.x-E.x), xO2=E.x+t210*(F.x-E.x);
    const theta=Math.atan2(cy2-cy1, xO2-xO1)*180/Math.PI; // 恒落在(0°,180°)之间
    const r=22, lr=38;
    const sectors=[
      {pos:1,cx:xO1,cy:cy1,s:180,e:180+theta},
      {pos:2,cx:xO1,cy:cy1,s:180+theta,e:360},
      {pos:3,cx:xO1,cy:cy1,s:0,e:theta},
      {pos:4,cx:xO1,cy:cy1,s:theta,e:180},
      {pos:5,cx:xO2,cy:cy2,s:180,e:180+theta},
      {pos:6,cx:xO2,cy:cy2,s:180+theta,e:360},
      {pos:7,cx:xO2,cy:cy2,s:0,e:theta},
      {pos:8,cx:xO2,cy:cy2,s:theta,e:180},
    ];
    let html=`<line x1="${E.x.toFixed(1)}" y1="${E.y.toFixed(1)}" x2="${F.x.toFixed(1)}" y2="${F.y.toFixed(1)}" stroke="var(--text)" stroke-width="3"/>`;
    sectors.forEach(sec=>{
      html+=arcPoly(sec.cx,sec.cy,r,sec.s,sec.e);
      const mid=(sec.s+sec.e)/2, rad=mid*Math.PI/180;
      const lx=sec.cx+lr*Math.cos(rad), ly=sec.cy+lr*Math.sin(rad);
      html+=`<text x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" font-size="12" fill="var(--muted)" text-anchor="middle" dominant-baseline="middle">${sec.pos}</text>`;
    });
    dyn.innerHTML=html;
    hE.setAttribute('cx',E.x.toFixed(1)); hE.setAttribute('cy',E.y.toFixed(1));
    hF.setAttribute('cx',F.x.toFixed(1)); hF.setAttribute('cy',F.y.toFixed(1));
    t1Out.textContent=theta.toFixed(0);
    t2Out.textContent=(180-theta).toFixed(0);
  }
  function svgPoint(evt){
    const rect=svgEl.getBoundingClientRect();
    const sx=320/rect.width, sy=300/rect.height;
    return {x:(evt.clientX-rect.left)*sx, y:(evt.clientY-rect.top)*sy};
  }
  function attach(handle,which){
    handle.addEventListener('pointerdown',function(e){ dragging=which; handle.setPointerCapture(e.pointerId); e.preventDefault(); });
    handle.addEventListener('pointermove',function(e){
      if(dragging!==which) return;
      const p=svgPoint(e);
      if(which==='E'){ E.x=p.x; E.y=p.y; } else { F.x=p.x; F.y=p.y; }
      render();
    });
    handle.addEventListener('pointerup',function(){dragging=null;});
    handle.addEventListener('pointercancel',function(){dragging=null;});
  }
  attach(hE,'E'); attach(hF,'F');
  render();
}

/* ===================== 第12.1节：数据与出题函数 ===================== */
const SOLIDS = [
  {name:'立方体', f:6, e:12, v:8},
  {name:'长方体', f:6, e:12, v:8},
  {name:'四角锥体', f:5, e:8,  v:5},
  {name:'四面体（三棱锥体）', f:4, e:6,  v:4},
  {name:'三棱柱体', f:5, e:9,  v:6},
  {name:'五棱柱体', f:7, e:15, v:10},
  {name:'正八面体', f:8, e:12, v:6},
  {name:'正十二面体', f:12, e:30, v:20},
];

function s1_solidCount(){
  const s = SOLIDS[randInt(0,SOLIDS.length-1)];
  const propKey = ['f','e','v'][randInt(0,2)];
  const propName = {f:'面',e:'边',v:'顶点'}[propKey];
  const unit = propKey==='e' ? '条' : '个';
  const correct = s[propKey];
  const others = SOLIDS.filter(x=>x.name!==s.name);
  const other = others[randInt(0,others.length-1)];
  const candidates = [s.f, s.e, s.v, other[propKey], correct+1, correct-1].filter(x=>x>0);
  const opts = makeOptions(correct, candidates);
  return {
    stem: `${s.name}有多少个${propName}？`,
    options: opts.map(o=>`${o}${unit}`),
    correctText: `${correct}${unit}`,
    correctNum: correct,
    explain: `${s.name}共有 ${s.f} 个面、${s.e} 条边、${s.v} 个顶点，别记混了。`,
    numeric: true
  };
}

function s1_polygonVertex(){
  const names=[['六边形',6],['七边形',7],['八边形',8],['九边形',9],['十边形',10],['五边形',5]];
  const pick = names[randInt(0,names.length-1)];
  const askEdge = Math.random()<0.5;
  const correct = pick[1];
  const unit = askEdge?'条':'个';
  const candidates=[correct-1,correct+1,correct*2,Math.max(1,correct-2)];
  const opts = makeOptions(correct,candidates);
  return {
    stem:`一个${pick[0]}有多少${askEdge?'条边':'个顶点'}？`,
    options: opts.map(o=>`${o}${unit}`),
    correctText:`${correct}${unit}`,
    correctNum: correct,
    explain:`多边形的边数与顶点数是相等的：${pick[0]}有 ${correct} 条边，也有 ${correct} 个顶点。`,
    numeric:true
  };
}

function s1_notSolid(){
  const planeShapes=['正方形','三角形','长方形','圆形','梯形','平行四边形'];
  const solidNames=SOLIDS.map(s=>s.name).concat(['球体','圆柱体','圆锥体']);
  const plane = planeShapes[randInt(0,planeShapes.length-1)];
  const chosenSolids = shuffle(solidNames).slice(0,3);
  const opts = shuffle([plane, ...chosenSolids]);
  return {
    stem:`下列图形中，哪一个不是立体图形？`,
    options: opts,
    correctText: plane,
    correctNum: null,
    explain:`${plane}是平面图形（没有厚度/体积），其余选项都是立体图形（占有空间，由面围成）。`,

  };
}

function s2_symType(){
  const d = SYM_DATA[randInt(0,SYM_DATA.length-1)];
  const hasLine = d.axes>0;
  let correct;
  if(hasLine && d.point) correct='既是线对称图形，也是点对称图形';
  else if(hasLine && !d.point) correct='只是线对称图形（不是点对称图形）';
  else if(!hasLine && d.point) correct='只是点对称图形（不是线对称图形）';
  else correct='既不是线对称图形，也不是点对称图形';
  const allOpts=['既是线对称图形，也是点对称图形','只是线对称图形（不是点对称图形）','只是点对称图形（不是线对称图形）','既不是线对称图形，也不是点对称图形'];
  return {
    stem:`${d.name}属于下列哪一种情况？`,
    options: shuffle(allOpts),
    correctText: correct,
    correctNum: null,
    explain:`${d.name}${hasLine? (d.axes===Infinity?'有无数条对称轴':'有'+d.axes+'条对称轴') : '没有对称轴'}；${d.point? '绕中心旋转180°能与自身完全重合，所以是点对称图形':'旋转180°后不能与自身重合，所以不是点对称图形'}。`,
    numeric:false
  };
}

function s2_axesCount(){
  const filtered = SYM_DATA.filter(d=>d.axes>0 && d.axes!==Infinity);
  const d = filtered[randInt(0,filtered.length-1)];
  const correct = d.axes;
  const candidates=[correct+1,correct-1,correct+2,1].filter(x=>x>=0);
  const opts = makeOptions(correct,candidates);
  return {
    stem:`${d.name}共有多少条对称轴？`,
    options: opts.map(o=>`${o}条`),
    correctText:`${correct}条`,
    correctNum: correct,
    explain:`${d.name}的对称轴数目是 ${correct} 条。`,

}

function s2_pentagonTrap(){
  return {
    stem:`正五边形是点对称图形吗？`,

    correctText:'不是（旋转180°不能与原图重合）',

const S2_MC = [s2_symType, s2_axesCount, s2_pentagonTrap];

function s3_protractorOffset(){
  const a = randInt(5,60);
  const b = randInt(a+15,175);
  const correct = b-a;
  const candidates=[a+b, b, a, 180-correct];
  const opts = makeOptions(correct,candidates);

  };

function s3_divideStraight(){

function classifyAngle(x){
  if(x>0 && x<90) return '锐角';
  if(x===90) return '直角';
  if(x>90 && x<180) return '钝角';
  if(x===180) return '平角';
  if(x>180 && x<360) return '优角';
  if(x===360) return '周角';
  return '未知';
}

function s4_classify(){
  const pool=[89,91,179,181,269,271,359,45,120,200,300,90,180,175,185,265,275,10,350];
  const x = pool[randInt(0,pool.length-1)];
  const correct = classifyAngle(x);
  const allCats=['锐角','直角','钝角','平角','优角','周角'];
  const others = shuffle(allCats.filter(c=>c!==correct));
  const opts = shuffle([correct, others[0], others[1], others[2]]);
  return {
    stem:`${x}° 的角属于下列哪一种角？`,
    options: opts,
    correctText: correct,
    correctNum:null,
    explain:`锐角：0°~90°之间；直角：等于90°；钝角：90°~180°之间；平角：等于180°；优角：180°~360°之间；周角：等于360°。所以 ${x}° 属于${correct}。`,
    numeric:false
  };
}

function s4_clockSmaller(){
  const H = randInt(1,12);
  const M = [0,5,10,15,20,25,30,35,40,45,50,55][randInt(0,11)];
  const Heff = H%12;
  let angle = Math.abs(30*Heff - 5.5*M);
  if(angle>180) angle = 360-angle;
  angle = roundN(angle);
  const reflex = roundN(360-angle);
  const wrongFormula = roundN(Math.abs(30*Heff - 6*M));
  const rawNoFold = roundN(Math.abs(30*Heff - 5.5*M));
  const candidates=[reflex, wrongFormula, rawNoFold];
  const opts = makeOptions(angle,candidates);
  return {
    stem:`时钟显示 ${H} 时 ${M===0?'整':M+' 分'}，此时时针与分针所构成的较小角（劣角）是多少度？`,
    options: opts.map(o=>`${o}°`),
    correctText:`${angle}°`,
    correctNum: angle,
    explain:`分针角度 = ${M}×6° = ${M*6}°；时针角度 = ${Heff}×30° + ${M}×0.5° = ${(Heff*30+M*0.5).toFixed(1)}°。两者相减取绝对值，若结果超过180°，须用360°减去才是较小角，最终得 ${angle}°。`,
    numeric:true,
    svgClock:[H,M]
  };
}

function s4_rotateInterval(){
  const H = randInt(1,12);
  const s = randInt(0,45);
  const e = randInt(s+5,59);
  const diff = e-s;
  const minuteRot = roundN(diff*6);
  const hourRot = roundN(diff*0.5);
  const askMinute = Math.random()<0.5;
  const correct = askMinute?minuteRot:hourRot;

  const candidates=[xTarget+5, Math.max(1,xTarget-5), roundN((180-c)/(a+b))].filter(v=>v>0 && Number.isFinite(v));
  const opts = makeOptions(xTarget,candidates);
  return {
    stem:`射线OA、OB把一个周角分成∠1和∠2，∠1 = ${a}x°，∠2 = (${b}x + ${c})°，且∠1与∠2互为共轭角（∠1+∠2=360°），求x的值。`,
    options: opts.map(o=>`${o}`),

  {id:'s7', code:'12.7', title:'与平行线有关的角', mc:S7_MC, num:S7_NUM},
];
const ALL_MC = SECTIONS.reduce((acc,s)=>acc.concat(s.mc),[]);

/* ===================== 出题辅助：生成不重复模板序列 ===================== */
function pickQuestions(pool, count){
  const bag = shuffle(pool);
  const out = [];
  for(let i=0;i<count;i++){
    out.push(bag[i % bag.length]());
  }
  return out;
}

/* ===================== 渲染：单个题卡 ===================== */
function renderQCard(idx, q, onAnswered){
  const div = document.createElement('div');
  div.className = 'qcard';
  let extra = '';
  if(q.svgClock) extra = `<div style="text-align:center">${svgClock(q.svgClock[0],q.svgClock[1])}</div>`;
  if(q.svgParallel) extra = svgParallel();
  div.innerHTML = `
    <div class="qstem"><span class="qnum">第${idx+1}题.</span>${q.stem}</div>
    ${extra}
    <div class="opts"></div>
    <div class="explain">💡 ${q.explain}</div>
  `;
  const optsWrap = div.querySelector('.opts');
  q.options.forEach(opt=>{
    const b = document.createElement('button');
    b.className='opt-btn';
    b.textContent = opt;
    b.onclick = ()=>{
      const correct = (opt === q.correctText);
      Array.from(optsWrap.children).forEach(btn=>{
        btn.disabled = true;
        if(btn.textContent === q.correctText) btn.classList.add('correct');
      });
      if(!correct) b.classList.add('wrong');
      div.querySelector('.explain').classList.add('show');
      onAnswered(correct);
    };
    optsWrap.appendChild(b);
  });
  return div;
}

/* ===================== 渲染：一节的测验区（5选择 + 2作答） ===================== */
function renderSectionQuiz(container, sec){
  container.innerHTML = '';
  const wrap = document.createElement('div');
  wrap.className = 'quiz-section';
  wrap.innerHTML = `
    <div class="quiz-header">
      <h3 style="margin:0">📝 ${sec.code} 随堂小测验（5题选择）</h3>
      <span class="scorepill" id="score_${sec.id}">尚未作答</span>
    </div>
    <div id="qlist_${sec.id}"></div>
    <div id="summary_${sec.id}"></div>
    <div id="fillin_${sec.id}"></div>
    <div style="margin-top:14px">
      <button class="btn secondary" onclick="startSectionQuiz('${sec.id}')">🔄 重新出题（本节）</button>
    </div>
  `;
  container.appendChild(wrap);
  startSectionQuiz(sec.id);
}

const quizState = {};

function startSectionQuiz(secId){
  const sec = SECTIONS.find(s=>s.id===secId);
  const qlist = document.getElementById(`qlist_${secId}`);
  const summary = document.getElementById(`summary_${secId}`);
  const fillin = document.getElementById(`fillin_${secId}`);
  const scorepill = document.getElementById(`score_${secId}`);
  qlist.innerHTML = ''; summary.innerHTML=''; fillin.innerHTML='';
  scorepill.textContent = '尚未作答';

  const questions = pickQuestions(sec.mc, 5);
  quizState[secId] = { total:5, answered:0, correct:0 };

  questions.forEach((q,idx)=>{
    const card = renderQCard(idx, q, (isCorrect)=>{
      const st = quizState[secId];
      st.answered++;
      if(isCorrect) st.correct++;
      scorepill.textContent = `已答 ${st.answered}/${st.total}　答对 ${st.correct}`;
      if(st.answered === st.total){
        showSectionSummary(secId, sec);
      }
    });
    qlist.appendChild(card);
  });
}

function showSectionSummary(secId, sec){
  const st = quizState[secId];
  const summary = document.getElementById(`summary_${secId}`);
  const fillin = document.getElementById(`fillin_${secId}`);
  const pass = st.correct >= 3;
  summary.innerHTML = `
    <div class="summary">
      <div>选择题结果</div>
      <div class="big">${st.correct} / ${st.total}</div>
      <div style="margin-top:6px">
        ${pass
          ? '🎉 答对3题或以上，已解锁挑战：<b>2题作答题</b>（需自行输入答案）'
          : '再接再厉！答对3题或以上即可解锁作答题，点击下方"重新出题"再试一次吧。'}
      </div>
    </div>`;
  if(pass){
    renderFillIn(secId, sec);
  } else {
    fillin.innerHTML = '';
  }
}

function renderFillIn(secId, sec){
  const fillin = document.getElementById(`fillin_${secId}`);
  const qs = pickQuestions(sec.num.length? sec.num : sec.mc, 2);
  let html = `<h3>✍️ 作答题挑战（2题，请自行输入正确答案）</h3>`;
  qs.forEach((q,idx)=>{
    html += `
    <div class="qcard fillin-box" id="fq_${secId}_${idx}">
      <div class="qstem"><span class="qnum">作答${idx+1}.</span>${q.stem}</div>
      ${q.svgClock? `<div style="text-align:center">${svgClock(q.svgClock[0],q.svgClock[1])}</div>` : (q.svgParallel? svgParallel() : '')}
      <div>
        <input type="text" id="fin_${secId}_${idx}" placeholder="请输入答案">
        <button class="btn" style="padding:8px 14px" onclick="checkFillIn('${secId}',${idx})">提交</button>
        <span class="fresult" id="fres_${secId}_${idx}"></span>
      </div>
      <div class="explain" id="fexp_${secId}_${idx}">💡 ${q.explain}</div>
    </div>`;
  });
  fillin.innerHTML = html;
  fillin.dataset.answers = JSON.stringify(qs.map(q=>({num:q.correctNum, text:q.correctText})));
}

function checkFillIn(secId, idx){
  const fillin = document.getElementById(`fillin_${secId}`);
  const answers = JSON.parse(fillin.dataset.answers);
  const ans = answers[idx];
  const input = document.getElementById(`fin_${secId}_${idx}`);
  const resultEl = document.getElementById(`fres_${secId}_${idx}`);
  const expEl = document.getElementById(`fexp_${secId}_${idx}`);
  let raw = input.value.trim();
  let ok = false;
  if(ans.num !== null && ans.num !== undefined){
    const cleaned = raw.replace(/[°度个条]/g,'').trim();
    const val = parseFloat(cleaned);
    if(!Number.isNaN(val) && Math.abs(val - ans.num) < 0.05){ ok = true; }
  } else {
    // 文字型答案：宽松比对，允许包含关键字判断
    const key = ans.text.replace(/（[^）]*）/g,'').trim();
    if(raw && key.includes(raw.trim()) === false && raw.trim().length>0 && key.indexOf(raw.trim())>=0){ ok = true; }
    if(raw.trim() === key) ok = true;
  }
  input.disabled = true;
  resultEl.textContent = ok ? '✅ 答对了！' : `❌ 不正确，正确答案：${ans.text}`;
  resultEl.className = 'fresult ' + (ok?'ok':'no');
  expEl.classList.add('show');
}

/* ===================== 渲染：总复习 ===================== */
function renderFinalReview(container){
  container.innerHTML = `
  <div class="card">
    <h2>🏆 第十二章 总复习</h2>
    <p>点击下方按钮，系统将从全章各小节随机抽取 12 道选择题，题目内容、顺序与选项每次都会重新打乱。</p>
    <button class="btn" onclick="startFinalReview()">🚀 开始总复习</button>
    <div id="finalQList" style="margin-top:14px"></div>
    <div id="finalSummary"></div>
  </div>`;
}

function startFinalReview(){
  const qlist = document.getElementById('finalQList');
  const summary = document.getElementById('finalSummary');
  qlist.innerHTML = ''; summary.innerHTML = '';
  const questions = pickQuestions(ALL_MC, 12);
  const st = {total:12, answered:0, correct:0};
  questions.forEach((q,idx)=>{
    const card = renderQCard(idx, q, (isCorrect)=>{
      st.answered++;
      if(isCorrect) st.correct++;
      if(st.answered === st.total){
        const pct = Math.round(st.correct/st.total*100);
        let msg = pct>=90 ? '🌟 非常出色！几何基础掌握得很扎实！'
                 : pct>=70 ? '👍 不错，继续加油，查漏补缺！'
                 : '📖 再接再厉，建议重新复习课文内容后再挑战一次。';
        summary.innerHTML = `
          <div class="summary">
            <div>总复习成绩</div>
            <div class="big">${st.correct} / ${st.total}（${pct}%）</div>
            <div style="margin-top:6px">${msg}</div>
            <button class="btn secondary" style="margin-top:10px" onclick="startFinalReview()">🔄 重新测试（新题目）</button>
          </div>`;
      }
    });
    qlist.appendChild(card);
  });
}

/* ===================== 主体渲染：标签页 ===================== */
let activeTab = 's1';
function buildTabs(){
  const nav = document.getElementById('tabsNav');
  nav.innerHTML = '';
  SECTIONS.forEach(sec=>{
    const b = document.createElement('button');
    b.textContent = sec.code + ' ' + sec.title;
    b.onclick = ()=>switchTab(sec.id);
    b.id = 'tab_'+sec.id;
    nav.appendChild(b);
  });
  const finalBtn = document.createElement('button');
  finalBtn.textContent = '总复习';
  finalBtn.onclick = ()=>switchTab('final');
  finalBtn.id = 'tab_final';
  nav.appendChild(finalBtn);
}

function switchTab(id){
  activeTab = id;
  document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.remove('active'));
  document.getElementById('tab_'+id).classList.add('active');
  const app = document.getElementById('app');
  app.innerHTML = '';

  if(id==='final'){
    renderFinalReview(app);
    return;
  }
  const sec = SECTIONS.find(s=>s.id===id);
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `<h2>${sec.code} ${sec.title}</h2>` + CONTENT[sec.id];
  app.appendChild(card);
  if(id==='s3') initProtractorWidget('protractorWidget');
  if(id==='s6') initVerticalWidget('verticalWidget');
  if(id==='s7') initParallelWidget('parallelWidget');

  const quizCard = document.createElement('div');
  quizCard.className = 'card';
  app.appendChild(quizCard);
  renderSectionQuiz(quizCard, sec);
}

/* ===================== 主题 / 字体控制 ===================== */
function toggleTheme(){
  const body = document.body;
  const isDark = body.getAttribute('data-theme') === 'dark';
  body.setAttribute('data-theme', isDark? 'light':'dark');
  document.getElementById('themeBtn').textContent = isDark? '🌙 深色模式' : '☀️ 浅色模式';
  try{ localStorage.setItem('ch12_theme', isDark?'light':'dark'); }catch(e){}
}
function changeFont(delta){
  let cur = parseInt(document.documentElement.style.getPropertyValue('--fs')) || 100;
  cur = Math.min(160, Math.max(70, cur+delta));
  document.documentElement.style.setProperty('--fs', cur+'%');
  document.getElementById('fontLabel').textContent = cur+'%';
  try{ localStorage.setItem('ch12_fontsize', cur); }catch(e){}
}

/* ===================== 初始化 ===================== */
(function init(){
  try{
    const savedTheme = localStorage.getItem('ch12_theme');
    if(savedTheme){
      document.body.setAttribute('data-theme', savedTheme);
      document.getElementById('themeBtn').textContent = savedTheme==='dark' ? '☀️ 浅色模式' : '🌙 深色模式';
    }
    const savedFs = localStorage.getItem('ch12_fontsize');
    if(savedFs){
      document.documentElement.style.setProperty('--fs', savedFs+'%');
      document.getElementById('fontLabel').textContent = savedFs+'%';
    }
  }catch(e){}
  buildTabs();
  switchTab('s1');
})();
