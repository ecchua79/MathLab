function t3(){const g=i=>+$(i).value||0,A=g('c1'),B=g('c2'),C=g('c3'),D=g('c4'),s=$('co').value=='-'?-1:1,o=s>0?'+':'−';$('t3o').innerHTML=`去括号：${sup(P([A,'x'],[B,'y']))} ${o} (${sup(P([C,'x'],[D,'y']))})<br>x项：${A}${o}(${C})=${A+s*C}；y项：${B}${o}(${D})=${B+s*D}<br><b>结果：${sup(P([A+s*C,'x'],[B+s*D,'y']))}</b>`}
function t5(){const g=i=>+$(i).value||0,k=g('m1'),A=g('m2'),B=g('m3'),l=g('m4'),C=g('m5'),D=g('m6'),s=$('mo').value=='-'?-1:1,o=s>0?'+':'−',p=[k*A,k*B],q=[l*C,l*D],E=(a,b)=>sup(P([a,'x'],[b,'']));

$('t7o').innerHTML=ln.map(sup).join('<br>')}

function t6(){const n=Math.max(-5,Math.min(5,Math.round(+$('nv').value)||0)),o=$('no').value,X=v=>20+(v+5)*26,r=o=='>'||o=='≥',f=o=='≥'||o=='≤';let s=`<svg viewBox="0 0 300 50" width="100%" style="max-width:420px"><line x1=10 y1=25 x2=290 y2=25 stroke=currentColor /><rect x=${r?X(n):10} y=18 width=${r?290-X(n):X(n)-10} height=14 fill=#d4a017 opacity=.45 />`;for(let v=-5;v<=5;v++)s+=`<line x1=${X(v)} y1=21 x2=${X(v)} y2=29 stroke=currentColor /><text x=${X(v)} y=44 font-size=10 text-anchor=middle fill=currentColor>${v<0?'−'+-v:v}</text>`;s+=`<circle cx=${X(n)} cy=25 r=5 fill="${f?'#c0392b':'none'}" stroke=#c0392b stroke-width=2 /></svg>`;$('t6o').innerHTML=`x ${o} ${sup(n)}（${f?'● 实心＝包含':'○ 空心＝不含'}）<br>`+s}

let T=0,Q=[],F=[],right=0,done=0,fdone=0,fr=0;
