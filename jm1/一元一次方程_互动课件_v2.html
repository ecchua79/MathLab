<script>

const $=id=>document.getElementById(id);
const ri=(a,b)=>Math.floor(Math.random()*(b-a+1))+a, pick=a=>a[ri(0,a.length-1)], nz=(a,b)=>{let v;do v=ri(a,b);while(!v);return v};

function gA1(){const x=nz(-12,12),b=nz(-15,15),c=x+b;return{q:`解方程式：x${ad(b)} = ${M(c)}`,ans:x,wrong:[[c+b,'移项时没有改变符号'],[-x,'求出了 x 的相反数（符号弄反）'],[R(c,b),'把「+b」当成了「×b」']]}}

function gB1(){const a=nz(-9,9),x=nz(-9,9);if(Math.abs(a)<2)return gB1();const c=a*x;return{q:`解方程式：${M(a)}x = ${M(c)}`,ans:x,wrong:[[c*a,'应该除以系数，而不是乘以系数'],[c-a,'把系数当成加数来移项'],[-x,'符号弄反（负数除法）']]}}

function gB3(){const a=ri(2,9),x=nz(-9,9),c=-a*x;return{q:`解方程式：−${a}x = ${M(c)}`,ans:x,wrong:[[R(c,a),'除以 −a 时丢了负号'],[c*a,'该除却乘了'],[-c*a,'该除却乘，而且符号也错了']]}}
function gB4(){const q=ri(2,5),p=pick([2,3,5,7].filter(z=>z!==q)),t=nz(-6,6);return{q:`解方程式：${fr(p,q)}x = ${M(p*t)}`,ans:q*t,wrong:[[t,'只除以了分子，忘记乘分母'],[R(p*t*p,q),'乘的是 p/q，而不是它的倒数 q/p'],[-q*t,'符号弄反']]}}
function gB5(){const m=ri(2,9),x=m*nz(-7,7),c=-x/m;return{q:`解方程式：−${fr('x',m)} = ${M(c)}`,ans:x,wrong:[[c*m,'漏掉了左边的负号'],[R(c,m),'该乘以 m 却除了'],[c-m,'把分母当成加数来移项']]}}
function gC1(){const p=ri(2,6),q=nz(-6,6),x=nz(-8,9),r=p*(x+q);return{q:`解方程式：${bk(p,q)} = ${M(r)}`,ans:x,wrong:[[R(r-q,p),'去括号时只乘了 x，没乘常数 q'],[R(r+p*q,p),'两边除以 p 后，q 没有移项变号'],[p*x,'求出的是 px，忘了再除以 p']]}}
function gC2(){const p=ri(2,5),s=ri(2,5),q=nz(-5,5),t=ri(1,6),x=nz(-7,8),r=p*(x+q)+s*(x-t);return{q:`解方程式：${bk(p,q)} + ${s}(x − ${t}) = ${M(r)}`,ans:x,wrong:[[R(r-p*q+t,p+s),'去括号时 −t 没有乘以 s'],[R(r-p*q-s*t,p+s),'−s·t 移项时没有变号'],[R(r-p*q+s*t,p*s),'合并时把 x 的系数相乘了（应相加）']]}}

c:{t:'括号求解器：p(x + q) + r = s(x + t)',d:[['p','p',4],['q','q',3],['r','r',2],['s','s',2],['t','t',-1]],fn:(p,q,r,s,t)=>{
  if(![p,q,r,s,t].every(okm))return '⚠️ 请输入整数';
  const P=p-s,Q=s*t-p*q-r;let o=`方程式：${p}(x${ad(q)})${ad(r)} = ${s}(x${ad(t)})\n去括号：${tm(p)}${ad(p*q)}${ad(r)} = ${tm(s)}${ad(s*t)}\n移项合并：(${p} − ${s})x = ${s*t} − ${p*q} − ${r}\n即 ${M(P)}x = ${M(Q)}\n`;
  if(!P)return o+(Q?'0x = 非零数 → 原方程式无解':'0x = 0 → x 为任何数');
  const x=R(Q,P),L=R(p*(x.n+q*x.d)+r*x.d,x.d),Rt=R(s*(x.n+t*x.d),x.d);return o+`x = ${disp(x)}\n代入检验：左式 = ${disp(L)}，右式 = ${disp(Rt)} ${key(L)===key(Rt)?'✓':'✗'}`}},
d:{t:'分数方程求解器：（ax + b）/ m = （cx + d）/ n',d:[['a','a',1],['b','b',1],['m','分母 m',3],['c','c',2],['d','d',-3],['n','分母 n',7]],fn:(a,b,m,c,d,n)=>{
  if(![a,b,m,c,d,n].every(okm))return '⚠️ 请输入整数';if(m<=0||n<=0)return '⚠️ 分母必须是正整数';
  const L=lcm(m,n),A=L/m,B=L/n,P=A*a-B*c,Q=B*d-A*b;
  let o=`方程式：${fr(lin(a,b),m)} = ${fr(lin(c,d),n)}\n${m} 与 ${n} 的最小公倍数是 ${L}，两边同时乘以 ${L}（每一项都要乘）：\n${A}(${lin(a,b)}) = ${B}(${lin(c,d)})\n去括号：${tm(A*a)}${ad(A*b)} = ${tm(B*c)}${ad(B*d)}\n移项合并：(${A*a} − ${B*c})x = ${B*d} − ${A*b}\n即 ${M(P)}x = ${M(Q)}\n`;
  if(!P)return o+(Q?'0x = 非零数 → 原方程式无解':'0x = 0 → x 为任何数');
  const x=R(Q,P),l=R(a*x.n+b*x.d,m*x.d),r=R(c*x.n+d*x.d,n*x.d);return o+`x = ${disp(x)}\n代入检验：左式 = ${disp(l)}，右式 = ${disp(r)} ${key(l)===key(r)?'✓':'✗'}`}}
};
function build(){const tabs=$('tabs'),main=$('main');
  [...SECS,{id:'f',name:'🏆 总复习测试'}].forEach((s,i)=>{const b=document.createElement('button');b.className='tab-btn'+(i?'':' active');b.textContent=s.name;
    b.onclick=()=>{document.querySelectorAll('.tab-btn,.tab-content').forEach(e=>e.classList.remove('active'));b.classList.add('active');$('t_'+s.id).classList.add('active');scrollTo(0,0)};tabs.appendChild(b);
    const t=document.createElement('div');t.id='t_'+s.id;t.className='tab-content'+(i?'':' active');
    t.innerHTML=s.id==='f'?`<div class="card"><div class="card-title"><span>🏆 第 10 章总复习：10 道选择题 + 3 道作答题</span><button class="btn btn-primary" style="margin-left:auto" onclick="genFinal()">🎲 新的一组</button></div><p>题目从所有小节随机抽取，选项随机排列，干扰项都是常见的计算错误。</p><div id="fm"></div><div id="fres" class="feedback-box"></div><div id="fs" style="margin-top:1rem"></div></div>`:
    `<div class="card"><div class="card-title">📌 ${s.name}</div>${s.concept}</div>
    <div class="card"><div class="card-title">🔍 逐步例题</div><div class="stp" id="stp_${s.id}"></div><button class="btn btn-primary" id="stn_${s.id}">▶ 下一步</button> <button class="btn" id="str_${s.id}">↺ 重来</button></div>
    ${CALCS[s.id]||s.id==='e'?`<div class="card"><div class="card-title">🧮 ${s.id==='e'?'应用题建模求解器':CALCS[s.id].t}</div>${s.id==='e'?'<select id="cs_e" style="margin-bottom:1rem;padding:.4rem"></select>':''}<div class="calculator-grid" id="cg_${s.id}"></div><button class="btn btn-primary" id="cb_${s.id}" style="margin-top:1rem;width:100%">生成详细步骤</button><div class="steps-box" id="co_${s.id}" style="display:none"></div></div>`:''}
    <div class="card"><div class="card-title"><span>✏️ ${s.name} 练习</span><button class="btn" id="re_${s.id}" style="margin-left:auto">🔄 换一组</button></div><p style="color:var(--text-muted);margin-bottom:1rem">5 道选择题，答对 3 题以上解锁 2 道作答题。</p><div id="mq_${s.id}"></div><div id="ub_${s.id}" class="unlock-banner"></div><div id="sq_${s.id}"></div></div>`;
    main.appendChild(t)});
  SECS.forEach(s=>{let k=0;const st=$('stp_'+s.id),nx=$('stn_'+s.id);nx.onclick=()=>{if(k<s.steps.length){const d=document.createElement('div');d.innerHTML=(k?'➜ ':'')+s.steps[k++];st.appendChild(d)}nx.disabled=k>=s.steps.length};$('str_'+s.id).onclick=()=>{k=0;st.innerHTML='';nx.disabled=false;nx.onclick()};nx.onclick();
    $('re_'+s.id).onclick=()=>gen(s);gen(s)});
  ['a','b','c','d'].forEach(k=>calcUI(k,CALCS[k].d,CALCS[k].fn));
  const cs=$('cs_e');cs.innerHTML=Object.entries(CT).map(([k,v])=>`<option value="${k}">${v.n}</option>`).join('');cs.onchange=()=>calcUI('e',CT[cs.value].d,CT[cs.value].fn);cs.onchange();genFinal()}
if(typeof document!=='undefined'){let t='light';try{t=localStorage.getItem('th')||t;fs=+localStorage.getItem('fs')||16}catch(e){}build();setTheme(t);setFont(fs)}
</script>
