<div class="box"><b>位名：</b>每向左移一位，值扩大 10 倍；每向右移一位，值缩小为原来的 1/10。个位右边依次是<b>十分位</b>(1/10)、<b>百分位</b>(1/100)、<b>千分位</b>(1/1000)。<br>例：5 在十分位 → 0.5（零点五）；5 在百分位 → 0.05；2、3 分别在十分位、百分位 → 0.23。</div>
